<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing · Luyện viết – D&amp;T Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--o:#9F1239;--o2:#E11D48;--ol:#FFF1F3;--navy:#1D3557;--red:#D02F3A;--blue:#2346A8;--green:#1E7B4F;--teal:#0F766E;--ink:#1F2937;--mut:#5B6472;--bg:#FFF8F9;--card:#FFFFFF;--line:#F5D0D8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header.top{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;padding:14px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--o);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:18px;line-height:1.1}.brand small{font-size:13px;opacity:.95}
.who{font-size:14px;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;border:0;color:#fff}
h1{font-size:26px;margin:22px 0 6px;color:var(--navy)}h2{font-size:21px;margin:18px 0 10px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 16px}
.namebox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.namebox label{font-weight:700;width:100%}
.namebox input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--o);color:#fff;min-height:46px}
.btn.alt{background:#fff;color:var(--o);border:2px solid var(--o)}
.btn.ghost{background:transparent;color:var(--mut);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:8px 0 18px}
.bigbtn{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:22px;padding:20px;color:#fff;min-height:130px;text-decoration:none}
.bigbtn b{font-size:22px}.bigbtn span{font-size:14.5px;opacity:.95}
.bigbtn.soon{filter:grayscale(.35);opacity:.75;cursor:default}
.tag{display:inline-block;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;width:max-content}
.prog{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bar{height:14px;background:#F8DDE3;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));border-radius:9px;transition:width .4s}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ucard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px}
.ucard .n{font-size:13px;font-weight:800;color:var(--o);letter-spacing:1px}.ucard b{font-size:17px;color:var(--navy)}.ucard small{color:var(--mut)}
.ucard.lock{opacity:.55;cursor:default}
.ucard .done{margin-top:auto;font-size:13px;font-weight:700;color:var(--green)}
.back{background:none;border:0;color:var(--o);font-weight:700;font-size:15px;padding:12px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 10px;margin:8px 0 6px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;color:var(--mut);min-height:44px}
.tab.on{background:var(--o);border-color:var(--o);color:#fff}.tab .ok{color:var(--green)}.tab.on .ok{color:#fff}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.map img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.hint{font-size:14px;color:var(--mut);margin:8px 0 0}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fc{perspective:900px;height:230px;width:100%;display:block;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.fc .b{transform:rotateY(180deg);background:var(--ol)}
.fc img{width:100%;height:120px;object-fit:contain}
.noimg{font-size:26px;font-weight:800;color:var(--o);min-height:80px;display:flex;align-items:center}.fc .f .w:only-child{font-size:15px}
.fc .w{font-weight:800;font-size:19px;color:var(--red)}.fc .ipa{color:var(--mut);font-size:14px}.fc .vi{color:var(--blue);font-weight:700;font-size:17px}
.spk{border:0;background:var(--o);color:#fff;border-radius:50%;width:46px;height:46px;display:inline-grid;place-items:center;flex:0 0 auto}
.spk svg{width:22px;height:22px}
.ex{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:520px;margin:0 auto}
.ex img{max-width:260px;width:100%;height:170px;object-fit:contain}
.ex .vi{font-size:19px;font-weight:700;color:var(--blue)}
.ex input{font:inherit;font-size:22px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);width:100%;max-width:340px;letter-spacing:1px}
.slots{font-size:22px;letter-spacing:6px;color:var(--mut);font-weight:700}
.count{font-size:14px;color:var(--mut);font-weight:700}
.fb{min-height:28px;font-weight:700;font-size:16px}.fb.good{color:var(--green)}.fb.bad{color:var(--red)}
.shake{animation:sh .35s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-size:15px;min-height:56px;color:var(--ink)}
.mi.sel{border-color:var(--o);background:var(--ol)}.mi.ok{border-color:var(--green);background:#E8F5EE;color:var(--green);cursor:default}.mi.no{border-color:var(--red)}
.q{font-size:19px;font-weight:700;color:var(--navy);margin:4px 0 14px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;text-align:left;min-height:52px;color:var(--ink)}
.opt.no{border-color:var(--red);background:#FFF1F1}.opt.ok{border-color:var(--green);background:#E8F5EE}
.done-box{text-align:center;padding:22px 10px}.done-box .star{font-size:44px;color:var(--o2);font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--mut);font-size:13.5px;padding:20px 16px 30px}
.lf{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.lf .sent{font-size:20px;line-height:1.7;color:var(--navy);font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lf .sent input{font:inherit;font-size:19px;width:160px;max-width:100%;padding:6px 10px;border-radius:10px;border:2px solid var(--o);text-align:center;color:var(--red)}
.tfl{display:flex;flex-direction:column;gap:10px}
.tfi{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tfi span{font-size:16.5px;flex:1 1 260px}
.tfi .tb{display:flex;gap:8px}
.tfb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-weight:700;min-width:86px;min-height:44px;color:var(--ink)}
.tfb.ok{border-color:var(--green);background:#E8F5EE;color:var(--green)}.tfb.no{border-color:var(--red);background:#FFF1F1;color:var(--red)}
.tfi.done{border-color:#BFE3CF;background:#F5FBF7}
.passage{background:var(--ol);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16.5px;line-height:1.65;white-space:pre-line;margin-bottom:14px}
.passage .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;white-space:normal}
.passage .ph b{color:var(--o);font-size:17px}
.listenbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ol);border-radius:16px;padding:14px;margin-bottom:14px;text-align:center}
.spk.lg{width:64px;height:64px}.spk.lg svg{width:30px;height:30px}
.ord{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.ord .ans{min-height:64px;border:2px dashed var(--o);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:18px;font-weight:600;min-height:46px;color:var(--navy)}
.ans .chip{background:var(--ol);border-color:var(--o2)}
.vi-hint{font-size:15px;color:var(--mut);text-align:center}
.note{background:var(--ol);border:2px dashed var(--o2);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:1.5}
.note summary{font-weight:700;color:var(--o);cursor:pointer}
.sp{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.qbox{display:flex;align-items:center;gap:10px;justify-content:center;font-size:21px;font-weight:700;color:var(--navy);line-height:1.4}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--o);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.mic svg{width:36px;height:36px}.mic:disabled{opacity:.4}
.mic.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(208,47,58,.55)}100%{box-shadow:0 0 0 20px rgba(208,47,58,0)}}
.said{min-height:22px;color:var(--mut);font-style:italic;font-size:15px}
.steps{text-align:left;margin:0;padding-left:22px;line-height:1.7;font-size:16px}
.timer{width:100%;height:12px;background:var(--line);border-radius:8px;overflow:hidden}.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width 1s linear}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.gapp{font-size:17px;line-height:2.3;white-space:pre-line}
.gapp input.gp{font:inherit;font-weight:700;color:var(--blue);border:0;border-bottom:3px solid var(--o);background:var(--ol);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;min-width:4ch;max-width:100%}
.gapp input.gp.ok{border-color:var(--green);color:var(--green);background:#E8F5EE}.gapp input.gp.no{border-color:var(--red);color:var(--red);background:#FFF1F1}
.para{flex-direction:column;align-items:stretch}.para .chip{text-align:left;font-size:16px}
textarea.wr{width:100%;min-height:230px;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.7;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-top:6px}
textarea.wr:focus{outline:3px solid var(--o2);border-color:var(--o)}
.ck{list-style:none;padding:0;margin:10px 0;font-weight:700;line-height:1.8}.ck .ok{color:var(--green)}.ck .no{color:var(--red)}
@media (max-width:520px){h1{font-size:22px}.match{grid-template-columns:1fr}.fc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fc{height:190px}.fc img{height:90px}.fc .w{font-size:17px}}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vgrid .fc{height:250px}
.fc .pos{font-size:13px;font-weight:700;color:var(--teal);background:#E6F4F1;border-radius:999px;padding:1px 9px}
.fc .exs{font-size:14px;color:var(--ink);font-style:italic;line-height:1.45}
.fc .f .w{font-size:20px}
.prompt{background:#fff;border:2px solid var(--line);border-left:6px solid var(--o);border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.6;white-space:pre-line;margin-bottom:12px}
.prompt .lb{display:block;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--o);margin-bottom:4px}
.pimg{display:block;max-width:100%;margin:10px auto 0;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.tr{display:flex;flex-direction:column;gap:12px;max-width:740px;margin:0 auto}
.tr .vi{font-size:18px;font-weight:700;color:var(--blue);line-height:1.5}
.tr .wrong{font-size:18px;font-weight:600;color:var(--red);line-height:1.5}
textarea.ln{width:100%;min-height:96px;font:inherit;font-size:17px;line-height:1.55;padding:10px 12px;border:2px solid var(--line);border-radius:14px;box-sizing:border-box}
textarea.ln:focus,textarea.wr:focus{outline:3px solid #FBCFE8;border-color:var(--o)}
.model{background:#F5FBF7;border:2px solid #BFE3CF;border-radius:14px;padding:10px 14px;font-size:16.5px;line-height:1.55}
.model b{color:var(--green)}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.miss span{background:#FFF1F1;border:1px solid #F7C6C6;color:var(--red);border-radius:8px;padding:2px 8px;font-weight:700;font-size:15px}
.ol{display:flex;flex-direction:column;gap:12px}
.olp{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.olp>b{color:var(--o);display:block;margin-bottom:4px;font-size:17px}.olp ul{margin:0;padding-left:20px;line-height:1.7}
.tw{overflow-x:auto;margin:8px 0}
table.nt{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
table.nt th{background:var(--ol);color:var(--navy);text-align:left;padding:7px 9px;border:1px solid var(--line)}
table.nt td{padding:7px 9px;border:1px solid var(--line);vertical-align:top}
table.dt{width:auto;min-width:60%;margin:10px auto 0;white-space:normal}table.dt td{text-align:center}table.dt td:first-child{text-align:left;font-weight:700}
.wbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.wc{font-weight:800;font-size:16px}.wc.ok{color:var(--green)}.wc.low{color:var(--red)}
.tmr{font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy);background:var(--ol);border-radius:999px;padding:6px 14px}
.used{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.used span{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:14px;color:var(--mut)}.used span.on{background:#E8F5EE;border-color:#BFE3CF;color:var(--green);font-weight:700}
.essay p{margin:0 0 10px;line-height:1.7;font-size:16.5px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pr .spk{width:38px;height:38px}.pr .spk svg{width:18px;height:18px}
.secb{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--ol);color:var(--o);width:max-content}
.subt{font-weight:800;color:var(--navy);font-size:17px;margin:2px 0 8px}
.chip{font-size:17px}
.grph{font-size:15px;font-weight:800;color:var(--o);letter-spacing:.5px;margin:18px 0 8px;text-transform:uppercase}
.qsent{font-size:19px;font-weight:600;color:var(--navy);line-height:2.1}
.qsent input.gp{font:inherit;font-weight:700;color:var(--blue);border:0;border-bottom:3px solid var(--o);background:var(--ol);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;min-width:5ch}
.qsent input.gp.ok{border-color:var(--green);color:var(--green);background:#E8F5EE}.qsent input.gp.no{border-color:var(--red);color:var(--red);background:#FFF1F1}
.tag2{display:inline-block;font-size:12.5px;font-weight:800;border-radius:8px;padding:2px 8px;background:#EEF2FF;color:var(--blue);margin-bottom:6px}
.rv{list-style:none;padding:0;margin:12px 0 0;text-align:left;display:flex;flex-direction:column;gap:8px}
.rv li{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.5}
.rv li.ok{border-color:#BFE3CF;background:#F5FBF7}.rv li.no{border-color:#F7C6C6;background:#FFF7F7}
.rv .k{color:var(--green);font-weight:700}.rv .u{color:var(--red)}
.lnote{background:#FFFBEB;border:2px dashed #F59E0B;border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0;line-height:1.55}
</style>
</head>

e impact not only on the workers themselves but also on their families and the community as a whole."]}, {"vi": "Vì vậy, tôi hoàn toàn đồng ý với ý tưởng hạn chế giờ làm việc.", "en": ["Therefore, I totally agree with the idea of limiting working hours."]}, {"vi": "Vài thập kỷ trước, một người thông thường làm trung bình tám tiếng mỗi ngày.", "en": ["A few decades ago, a person normally worked an average of eight hours per day."]}, {"vi": "Tuy nhiên, số giờ làm việc trung bình mỗi ngày trong những năm gần đây đã tăng đáng kể lên mười hoặc thậm chí mười bốn tiếng.", "en": ["Average daily working hours in recent years, however, have significantly increased to ten or even fourteen."]}, {"vi": "Những người dành nhiều thời gian hơn ở nơi làm việc có nhiều khả năng mắc phải nhiều vấn đề sức khỏe khác nhau, từ mệt mỏi đến các vấn đề nghiêm trọng hơn như rối loạn lo âu hoặc thậm chí đột quỵ.", "en": ["People who spend longer at work are more likely to suffer from various health issues, ranging from fatigue to more serious problems like anxiety disorders or even stroke."]}, {"vi": "Sức khỏe kém dẫn đến nghỉ ốm nhiều hơn, hiệu suất làm việc kém và năng suất thấp.", "en": ["Failing health leads to more sick leave, poor work performance, and low productivity."]}, {"vi": "Anh họ của tôi là một ví dụ điển hình. Làm việc gần mười hai tiếng mỗi ngày, anh thường xuyên cảm thấy kiệt sức và mắc nhiều lỗi hơn ở nơi làm việc so với trước đây.", "en": ["My cousin is a case in point. Working nearly twelve hours on a daily basis, he frequently feels exhausted and makes more errors at work than he used to."]}, {"vi": "Tôi cũng cho rằng thời gian làm việc kéo dài có những hậu quả nghiêm trọng đối với gia đình và cộng đồng.", "en": ["I also think that extended hours of work have serious consequences for families and communities."]}, {"vi": "Ở cấp độ gia đình, lịch làm việc bận rộn ngăn cản mọi người thường xuyên đi du lịch cùng gia đình hoặc thậm chí chỉ ăn cơm cùng nhau.", "en": ["At the family level, busy working schedules prevent people from taking frequent family trips or even just having meals together."]}, {"vi": "Mối quan hệ giữa các thành viên bị suy yếu đáng kể nếu họ không thể dành thời gian cho nhau.", "en": ["Relationships among members are greatly weakened if they cannot make time for each other."]}, {"vi": "Về đời sống cộng đồng, những người làm việc quá sức không dành thời gian cho các hoạt động tình nguyện mang lại lợi ích cho xã hội của họ.", "en": ["In terms of community life, overworked people do not devote time to voluntary activity that brings benefits to their society."]}, {"vi": "Ví dụ, chú tôi hầu như không có thời gian cho các dự án phục vụ cộng đồng địa phương như công tác bảo tồn hoặc làm việc với một tổ chức từ thiện vì ông làm việc hơn sáu mươi tiếng mỗi tuần.", "en": ["My uncle, for example, hardly has time for local community service projects such as conservation work or working with a charity because he works more than sixty hours per week."]}, {"vi": "Tóm lại, tôi cho rằng thời gian làm việc nên được giảm xuống vì tần suất làm việc nhiều giờ gây ảnh hưởng bất lợi đến nhân viên, sự gắn kết gia đình và cộng đồng của họ.", "en": ["In conclusion, I would argue that working time should be reduced since the frequency of long working hours exerts an adverse effect on employees, their family bonds, and their community."]}], "outline": [{"h": "Thân bài 1: Tại sao mình đống ý ngày nay người ta làm việc nhiều hơn", "pts": ["Ảnh hưởng của xu hướng này lên cá nhân người lao động", "Ngày xưa: làm khoảng 8h/ngày → Bây giờ: tăng lên 10-14 tiếng/ngày", "Cá nhân người lao động ảnh hưởng lên sức khỏe → Mắc hàng loạt vấn đề về sức khỏe (mệt mỏi, rối loạn lo âu, đột quỵ) Xin nghỉ ốm nhiều, năng suất thấp", "Ví dụ: Anh họ làm 12 tiếng luôn cảm thấy kiệt sức + sai sót nhiều"]}, {"h": "Thân bài 2: Ảnh hưởng của xu hướng này lên gia đình và XH", "pts": ["Gia đình: Không có thời gian du lịch gia đình + ăn cơm → Mối quan hệ bị yếu đi", "Xã hội: không có thời gian cho các hoạt động tình nguyện", "Ví dụ: Chú hầu như không tham gia vào các dự án dịch vụ cộng đồng vì làm việc hơn 60 tiếng/tuần"]}], "gap": {"title": "Điền từ", "text": "Working longer hours is getting more common in today's society. I believe this trend has a severe impact not only on the workers themselves but also on their [family bonds] and the community.\nAverage daily [working hours] in recent years have significantly increased to ten or even fourteen hours per day.\nPeople who spend longer at work are more likely to suffer from various health issues. Failing health leads to more [sick leave] and poor work performance.\nMy cousin works nearly twelve hours on a daily basis and frequently feels [exhausted] at the end of each day.\nOverworked employees often show [low productivity], making more errors than they normally would.\nThe frequency of long working hours exerts an [adverse effect] on employees, their family bonds, and their community.\nOverworked people do not [devote] time to voluntary activity that brings benefits to their society.\nIt is necessary for governments to [restrict] the number of hours employees can work per week.", "extra": []}, "build": [{"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Working longer hours | is getting | more common | in today's society."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "People who spend | longer at work | are more likely to | suffer from | various health issues."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "It is necessary | for governments | to restrict | the number of hours | employees can work."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Busy working schedules | prevent people | from taking | frequent family trips."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Overworked people | do not devote | time to voluntary activity | that brings benefits | to their society."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": " se the one that works best for me after watching ads.", "spell": false}, {"w": "A complete prohibition / A total ban on", "vi": "Một sự cấm đoán/lệnh cấm hoàn toàn đối với", "ex": "A complete prohibition on advertising would harm the economy.", "spell": false}, {"w": "Prohibit (v) / Be prohibited", "vi": "Cấm / Bị cấm", "ex": "Advertising should not be prohibited without good reason.", "spell": false}, {"w": "Be made illegal", "vi": "Bị coi là bất hợp pháp", "ex": "It would be wrong if advertising were made illegal."}, {"w": "Illegal / Legal", "vi": "Bất hợp pháp / Hợp pháp", "ex": "Banning ads entirely would be seen as an illegal restriction.", "sp": "Illegal"}, {"w": "Do not issue sb with a licence", "vi": "Không cấp giấy phép cho ai đó", "ex": "If the government did not issue licences, agencies would close.", "spell": false}, {"w": "License (n)", "vi": "Giấy phép", "ex": "Advertising agencies need a business licence to operate.", "spell": false}, {"w": "I totally disagree with this point of view", "vi": "Tôi hoàn toàn không đồng ý với quan điểm này", "ex": "I totally disagree with this point of view on banning ads.", "spell": false}, {"w": "I would argue that", "vi": "Tôi cho rằng / Tôi lập luận rằng", "ex": "I would argue that a ban on advertising would be harmful."}, {"w": "Creates a range of job opportunities", "vi": "Tạo ra nhiều cơ hội việc làm", "ex": "The advertising industry creates a range of job opportunities.", "spell": false}, {"w": "Face unemployment", "vi": "Đối mặt với tình trạng thất nghiệp", "ex": "Millions would face unemployment if advertising were banned."}, {"w": "Millions of people", "vi": "Hàng triệu người", "ex": "Millions of people work in the global advertising industry."}, {"w": "Have a negative/severe/adverse effect on", "vi": "Có ảnh hưởng xấu/nghiêm trọng lên", "ex": "A ban would have a severe effect on the advertising sector.", "spell": false}, {"w": "Make significant contributions to", "vi": "Đóng góp đáng kể cho", "ex": "Advertising agencies make significant contributions to the nation.", "spell": false}, {"w": "Lose a large amount of tax revenue", "vi": "Mất một khoản thu thuế lớn", "ex": "The government would lose a large amount of tax revenue.", "spell": false}, {"w": "The tax revenue", "vi": "Nguồn thu thuế", "ex": "Tax revenue from advertising supports public services."}, {"w": "Suffer a great deal", "vi": "Chịu tổn thất lớn", "ex": "Society would suffer a great deal if all ads were banned."}, {"w": "Benefit (v)", "vi": "Mang lại lợi ích cho", "ex": "Advertising benefits both businesses and consumers.", "spell": false}, {"w": "Brings a wide range of benefits to society", "vi": "Mang lại nhiều lợi ích cho xã hội", "ex": "Advertising brings a wide range of benefits to society.", "spell": false}, {"w": "Without causing any harm", "vi": "Mà không gây ra bất kỳ thiệt hại nào", "ex": "Advertising can inform consumers without causing any harm."}, {"w": "Provide sb with information about", "vi": "Cung cấp thông tin cho ai đó về", "ex": "Ads provide people with information about new products.", "spell": false}, {"w": "Make better shopping choices", "vi": "Lựa chọn mua sắm tốt hơn", "ex": "Advertising helps consumers make better shopping choices."}, {"w": "Enrich people's knowledge about various aspects of life", "vi": "Làm giàu kiến thức về nhiều khía cạnh cuộc sống", "ex": "Adverts enrich people's knowledge about technology and lifestyle.", "spell": false}, {"w": "The technological device / The digital gadget", "vi": "Thiết bị công nghệ / Thiết bị điện tử", "ex": "My nephew learned about digital gadgets through adverts.", "spell": false}, {"w": "This can be explained by the fact that", "vi": "Điều này có thể được giải thích bởi việc", "ex": "This can be explained by the fact that ads inform and educate.", "spell": false}, {"w": "Serve (v) / Service (n)", "vi": "Phục vụ / Dịch vụ", "ex": "Advertising serves the important purpose of informing the public.", "spell": false}, {"w": "Useful / Purpose / Harm", "vi": "Hữu ích / Mục đích / Gây hại", "ex": "Ads serve a useful purpose and do not harm anyone.", "sp": "Useful"}, {"w": "The mentioned above", "vi": "Đã được đề cập ở trên", "ex": "For the reasons mentioned above, I disagree with the ban."}], "trans": [{"vi": "Một số người tin rằng việc cấm hoàn toàn tất cả các loại quảng cáo sẽ có lợi cho xã hội vì nó hoàn toàn vô dụng và thậm chí có thể gây ra nhiều thiệt hại.", "en": ["Some people believe that a complete prohibition on all kinds of advertising would benefit society because it is totally useless and can even cause a lot of damage."]}, {"vi": "Tôi hoàn toàn không đồng ý với quan điểm này.", "en": ["I totally disagree with this point of view."]}, {"vi": "Tôi tin rằng xã hội sẽ chịu tổn thất lớn nếu tất cả các hình thức quảng cáo bị coi là bất hợp pháp.", "en": ["I believe that society would suffer a great deal if all forms of advertising were made illegal."]}, {"vi": "Lý do đầu tiên là ngành quảng cáo tạo ra nhiều cơ hội việc làm cho nhiều người.", "en": ["The first reason is that the advertising industry creates a range of job opportunities for many people."]}, {"vi": "Một lệnh cấm hoàn toàn đối với ngành này có nghĩa là hàng triệu người sẽ phải đối mặt với tình trạng thất nghiệp, điều này sẽ có tác động nghiêm trọng đến cuộc sống của họ.", "en": ["A complete ban on this industry means that millions of people would have to face unemployment, which would have a severe impact on their lives."]}, {"vi": "Một lý do khác là ngành quảng cáo đóng góp đáng kể cho sự phát triển của bất kỳ quốc gia nào. Do đó, chính phủ sẽ mất một khoản thu thuế lớn từ các công ty quảng cáo nếu không cấp giấy phép kinh doanh cho các công ty này.", "en": ["Another reason is that the advertising industry makes significant contributions to the development of any nation. Therefore, the government would lose a large amount of tax revenue from advertising agencies if it did not issue these companies with business licences."]}, {"vi": "Tôi cũng cho rằng quảng cáo mang lại nhiều lợi ích cho xã hội mà không gây ra bất kỳ thiệt hại nào.", "en": ["I also think that advertising brings a wide range of benefits to society without causing any harm."]}, {"vi": "Điều này có thể được giải thích bởi việc các quảng cáo cung cấp thông tin cho mọi người về các sản phẩm hoặc dịch vụ để họ có thể lựa chọn mua sắm tốt hơn.", "en": ["This can be explained by the fact that advertisements provide people with information about products or services so that they can make better shopping choices."]}, {"vi": "Hơn nữa, quảng cáo có thể giúp làm giàu kiến thức của mọi người về nhiều khía cạnh của cuộc sống.", "en": ["Moreover, advertising could help enrich people's knowledge about various aspects of life."]}, {"vi": "Tóm lại, vì những lý do đã được đề cập ở trên, tôi cho rằng việc cấm hoàn toàn quảng cáo sẽ có tác động bất lợi cho xã hội vì nó phục vụ nhiều mục đích hữu ích và không gây hại cho ai.", "en": ["In conclusion, for the reasons mentioned above, I would argue that a total ban on advertising would have an adverse effect on society because it serves many useful purposes and does not harm anybody."]}], "outline": [{"h": "Thân bài 1", "pts": ["Tại sao mình không đồng ý \"việc cấm quảng cáo mang lại lợi ích cho XH\" → XH sẽ bị tổn thất nếu quảng cáo bị cấm", "Lý do 1: Ngành quảng cáo tạo nhiều việc làm → Cấm quảng cáo → nhiều người mất việc → ảnh hưởng tới cuộc sống của họ.", "Lý do 2: Ngành quảng cáo đóng góp lớn cho đất nước → Cấm quảng cáo → chính phủ bị mất 1 nguồn thu thuế lớn."]}, {"h": "Thân bài 2", "pts": ["Tại sao mình không đồng ý \"quảng cáo không hữu ích + thậm chí gây thiệt hại\" → Quảng cáo có lợi, ko hề gây thiệt hại → Lý do 1: cung cấp thông tin cho người tiêu dùng → Lựa chọn mua sắm tốt hơn. → Ví dụ: tôi, dầu gội. → Lý do 2: làm tăng vốn kiến thức về nhiều lĩnh vực → Ví dụ: cháu tôi, công nghệ"]}], "gap": {"title": "Điền từ", "text": "Some people believe a ban on advertising would benefit society. [I totally disagree] with this point of view.\nI believe that society would [suffer a great deal] if all forms of advertising were banned.\nA complete ban on this industry means that millions of people would have to [face unemployment].\nIf advertising were [made illegal], the government would lose large amounts of money.\nThe advertising industry makes significant [contributions] to the development of any nation.\nThe government would lose a large amount of [tax revenue] if it banned advertising agencies.\nAdvertisements provide people with information so that they can make [better shopping choices].\nAdvertising can [enrich] people's knowledge about various aspects of life.\nAdvertising brings a wide range of benefits to society [without causing any harm].\nA total ban on advertising would be harmful because it serves many [useful purpose] and does not harm anyone.", "extra": []}, "build": [{"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Some people believe that a complete prohibition | on all kinds of advertising | would benefit society | because it is totally useless and can even cause a lot of damage."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "I believe that | society would suffer a great deal | if all forms of advertising | were made illegal."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "The advertising industry | creates a range | of job opportunities | for many people."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "A complete ban on this industry means that millions of people | would have to face unemployment, | which would have | a severe impact on their lives."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "The government would | lose a large amount of tax revenue from advertising agencies | if it did not issue | these companies with business licences."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "A total ban on advertising | would have an adverse effect on society | because it serves | many useful purposes | and does not harm anybody."}], "ready": true, "test": [{"t": "mc", "q": "“Millions of people” nghĩa là:", "o": ["Hàng triệu người", "Cung cấp thông tin cho ai đó về", "Giấy phép"], "why": ""}, {"t": "mc", "q": "“Serve (v) / Service (n)” nghĩa là:", "o": ["Phục vụ / Dịch vụ", "Quảng cáo trên truyền hình", "Có ảnh hưởng xấu/nghiêm trọng lên"], "why": ""}, {"t": "mc", "q": "“The mentioned above” nghĩa là:", "o": ["Đã được đề cập ở trên", "Quảng cáo (ngành/danh từ/số nhiều)", "Bị coi là bất hợp pháp"], "why": ""}, {"t": "mc", "q": "“Advertising / Advertisement / Adverts” nghĩa là:", "o": ["Quảng cáo (ngành/danh từ/số nhiều)", "Quảng cáo (động từ)", "Giấy phép"], "why": ""}, {"t": "mc", "q": "“Make significant contributions to” nghĩa là:", "o": ["Đóng góp đáng kể cho", "Nguồn thu thuế", "Cung cấp thông tin cho ai đó về"], "why": ""}, {"t": "mc", "q": "“I would argue that” nghĩa là:", "o": ["Tôi cho rằng / Tôi lập luận rằng", "Mất một khoản thu thuế lớn", "Một sự cấm đoán/lệnh cấm hoàn toàn đối với"], "why": ""}, {"t": "fill", "q": "I believe that society would ___ if all forms of advertising were made illegal. (Tôi tin rằng xã hội sẽ chịu tổn thất lớn nếu tất cả các hình thức quảng cáo bị coi là bất hợp pháp.)", "a": ["suffer a great deal"], "why": ""}, {"t": "fill", "q": "This can be explained by the fact that advertisements provide people with information about products or services so that they can ___. (Điều này có thể được giải thích bởi việc các quảng cáo cung cấp thông tin cho mọi người về các sản phẩm hoặc dịch vụ để họ có thể lựa chọn mua sắm tốt hơn.)", "a": ["make better shopping choices"], "why": ""}, {"t": "fill", "q": "Some people believe that a complete prohibition on all kinds of ___ would benefit society because it is totally useless and can even cause a lot of damage. (Một số người tin rằng việc cấm hoàn toàn tất cả các loại quảng cáo sẽ có lợi cho xã hội vì nó hoàn toàn vô dụng và thậm chí có thể gây ra nhiều thiệt hại.)", "a": ["advertising"], "why": ""}, {"t": "fill", "q": "I also think that advertising brings a wide range of benefits to society ___. (Tôi cũng cho rằng quảng cáo mang lại nhiều lợi ích cho xã hội mà không gây ra bất kỳ thiệt hại nào.)", "a": ["without causing any harm"], "why": ""}]}, {"id": "t2-fuel-environment", "code": "Đề 3", "kind": "Agree / Disagree · Balanced", "title": "Fuel prices & the environment", "vi": "Tăng giá nhiên liệu để bảo vệ môi trường", "grp": "Đề theo dạng bài", "prompt": "The best way to solve the world's environmental problems is to increase the cost of fuel. Do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["It is believed that the most effective solution to combat environmental issues is to raise fuel prices. While I accept that this measure could have some effects in the short run, I believe that raising people's environmental awareness is by far the best approach to deal with these problems.", "On the one hand, I think that increasing fuel costs such as petrol, oil and natural gas could help address some of the world's environmental problems nowadays. Industries, especially power plants, might find alternative energy sources such as nuclear or renewables to replace fossil fuels. This would lead to fewer greenhouse gases and emissions released into the atmosphere, mitigating global warming and air pollution. Another point that needs to be mentioned is that rising fuel prices mean that commuting costs would rapidly climb. People might take public transport, carpool, or cycle to work rather than use their private vehicles. This could also help reduce the amount of exhaust fumes produced into the environment.", "On the other hand, I personally believe that this is not the best solution to various environmental issues facing the world today. This is because in recent years, the cost of fuel has grown enormously, but the number of private cars has still increased at alarming rates. Therefore, I think that in order to properly solve environmental problems, we need to increase public awareness about the importance of protecting the earth. When everyone is fully aware of this, they would be willing to take action to tackle environmental pollution and other related issues.", "In conclusion, although increasing fuel costs could somewhat contribute to environmental protection, it seems to me that improving people's environmental protection consciousness is by far the most practical solution."], "vocab": [{"w": "Environmental issues / problems", "vi": "Các vấn đề môi trường", "ex": "Raising fuel prices may help address environmental issues.", "spell": false}, {"w": "The world's environmental problems", "vi": "Các vấn đề môi trường của thế giới", "ex": "We need better solutions to the world's environmental problems.", "spell": false}, {"w": "Global warming", "vi": "Sự nóng lên toàn cầu", "ex": "Fewer emissions help in mitigating global warming."}, {"w": "Air pollution", "vi": "Ô nhiễm không khí", "ex": "Cars produce exhaust fumes that cause air pollution."}, {"w": "Greenhouse gases / Emissions", "vi": "Khí nhà kính / Khí thải", "ex": "Factories release large amounts of greenhouse gases.", "sp": "Greenhouse gases"}, {"w": "Release into the atmosphere", "vi": "Thải vào bầu không khí", "ex": "These gases are released into the atmosphere daily."}, {"w": "Exhaust fumes", "vi": "Khói thải từ ống xả", "ex": "Private vehicles produce exhaust fumes that harm the environment."}, {"w": "Environmental protection", "vi": "Bảo vệ môi trường", "ex": "Increasing awareness promotes environmental protection."}, {"w": "Increase at alarming rates", "vi": "Tăng với tốc độ đáng lo ngại", "ex": "The number of private cars has increased at alarming rates."}, {"w": "Raise/increase fuel prices/costs", "vi": "Tăng giá/chi phí nhiên liệu", "ex": "The government plans to raise fuel prices next year.", "spell": false}, {"w": "Petrol / Oil / Natural gas", "vi": "Xăng / Dầu / Khí đốt tự nhiên", "ex": "Industries rely on petrol, oil, and natural gas for energy.", "sp": "Petrol"}, {"w": "Fossil fuels", "vi": "Nhiên liệu hóa thạch", "ex": "Burning fossil fuels causes serious air pollution."}, {"w": "Alternative energy sources", "vi": "Các nguồn năng lượng thay thế", "ex": "Power plants should switch to alternative energy sources."}, {"w": "Nuclear power / Renewable power", "vi": "Điện hạt nhân / Điện tái tạo", "ex": "Nuclear power and renewables produce fewer emissions.", "spell": false}, {"w": "Power plants", "vi": "Nhà máy điện", "ex": "Power plants might find cleaner alternatives if fuel costs rise."}, {"w": "Replace fossil fuels", "vi": "Thay thế nhiên liệu hóa thạch", "ex": "Renewables can replace fossil fuels in the long run."}, {"w": "Commute / Commuting costs", "vi": "Đi lại / Chi phí đi lại", "ex": "Rising fuel prices cause commuting costs to climb rapidly.", "sp": "Commute"}, {"w": "Public transport", "vi": "Phương tiện công cộng", "ex": "People may switch to public transport when fuel is expensive."}, {"w": "Carpool", "vi": "Đi chung xe", "ex": "Carpooling reduces both costs and exhaust fume emissions."}, {"w": "Private vehicles", "vi": "Phương tiện cá nhân", "ex": "Fewer people will use private vehicles if fuel prices rise."}, {"w": "Rather than", "vi": "Hơn là, thay vì", "ex": "People may cycle rather than drive to reduce costs."}, {"w": "Reduce the amount of exhaust fumes", "vi": "Giảm lượng khói thải", "ex": "Cycling helps reduce the amount of exhaust fumes in the city.", "spell": false}, {"w": "The most effective/practical solution", "vi": "Giải pháp hiệu quả/thực tế nhất", "ex": "Raising awareness is the most practical solution long-term.", "spell": false}, {"w": "Combat environmental issues", "vi": "Chống lại các vấn đề môi trường", "ex": "Education can help combat environmental issues effectively."}, {"w": "Raising people's environmental awareness", "vi": "Nâng cao nhận thức , "vi": "Theo tôi thấy thì", "ex": "It seems to me that education is the best solution."}, {"w": "I personally believe that", "vi": "Cá nhân tôi tin rằng", "ex": "I personally believe that awareness matters more than taxes."}], "trans": [{"vi": "Người ta tin rằng giải pháp hiệu quả nhất để chống lại các vấn đề môi trường là tăng giá nhiên liệu.", "en": ["It is believed that the most effective solution to combat environmental issues is to raise fuel prices."]}, {"vi": "Trong khi tôi đồng ý rằng biện pháp này có thể có tác động trong ngắn hạn, tôi tin rằng nâng cao nhận thức về môi trường của mọi người là hơn hẳn cách tiếp cận tốt nhất để giải quyết những vấn đề này.", "en": ["While I accept that this measure could have some effects in the short run, I believe that raising people's environmental awareness is by far the best approach to deal with these problems."]}, {"vi": "Một mặt, tôi nghĩ rằng việc tăng chi phí nhiên liệu như xăng, dầu và khí đốt tự nhiên có thể giúp giải quyết một số vấn đề môi trường của thế giới hiện nay.", "en": ["On the one hand, I think that increasing fuel costs such as petrol, oil and natural gas could help address some of the world's environmental problems nowadays."]}, {"vi": "Các ngành công nghiệp, đặc biệt là các nhà máy điện, có thể tìm kiếm các nguồn năng lượng thay thế như điện hạt nhân hoặc năng lượng tái tạo để thay thế nhiên liệu hóa thạch.", "en": ["Industries, especially power plants, might find alternative energy sources such as nuclear or renewables to replace fossil fuels."]}, {"vi": "Điều này sẽ dẫn đến ít khí nhà kính và khí thải hơn được thải vào bầu khí quyển, giúp giảm thiểu sự nóng lên toàn cầu và ô nhiễm không khí.", "en": ["This would lead to fewer greenhouse gases and emissions released into the atmosphere, mitigating global warming and air pollution."]}, {"vi": "Một điểm khác cần được đề cập là giá nhiên liệu tăng có nghĩa là chi phí đi lại sẽ tăng nhanh chóng. Mọi người có thể đi phương tiện công cộng, đi chung xe hoặc đạp xe đi làm thay vì sử dụng phương tiện cá nhân.", "en": ["Another point that needs to be mentioned is that rising fuel prices mean that commuting costs would rapidly climb. People might take public transport, carpool, or cycle to work rather than use their private vehicles."]}, {"vi": "Mặt khác, cá nhân tôi tin rằng đây không phải là giải pháp tốt nhất cho các vấn đề môi trường mà thế giới ngày nay đang phải đối mặt.", "en": ["On the other hand, I personally believe that this is not the best solution to various environmental issues facing the world today."]}, {"vi": "Điều này là vì trong những năm gần đây, chi phí nhiên liệu đã tăng rất nhiều, nhưng số lượng xe hơi cá nhân vẫn tiếp tục tăng với tốc độ đáng lo ngại.", "en": ["This is because in recent years, the cost of fuel has grown enormously, but the number of private cars has still increased at alarming rates."]}, {"vi": "Vì vậy, tôi nghĩ rằng để giải quyết đúng đắn các vấn đề môi trường, chúng ta cần nâng cao nhận thức cộng đồng về tầm quan trọng của việc bảo vệ trái đất.", "en": ["Therefore, I think that in order to properly solve environmental problems, we need to increase public awareness about the importance of protecting the earth."]}, {"vi": "Khi mọi người nhận thức đầy đủ về điều này, họ sẽ sẵn sàng hành động để giải quyết ô nhiễm môi trường và các vấn đề liên quan khác.", "en": ["When everyone is fully aware of this, they would be willing to take action to tackle environmental pollution and other related issues."]}, {"vi": "Tóm lại, mặc dù việc tăng chi phí nhiên liệu có thể phần nào đóng góp vào việc bảo vệ môi trường, tôi cảm thấy rằng nâng cao ý thức bảo vệ môi trường của con người là hơn hẳn giải pháp thực tế nhất.", "en": ["In conclusion, although increasing fuel costs could somewhat contribute to environmental protection, it seems to me that improving people's environmental protection consciousness is by far the most practical solution."]}], "outline": [{"h": "Thân bài 1.", "pts": ["tăng giá nhiên liệu → giúp trong thời gian ngắn → Lý do 1: → Tăng giá nhiên liệu → nhà máy tìm kiếm năng lượng thay thế (hạt nhân, tái tạo) → Ít khí thải hơn → giúp giải quyết nóng lên toàn cầu và ô nhiễm không khí. → Lý do 2: → Tăng giá nhiên liệu → chi phí đi lại tăng → Đi phương tiện công cộng + đi chung xe + đi xe đạp thay vì xe hơi → Giảm khói bụi thải ra môi trường"]}, {"h": "Thân bài 2.", "pts": ["Đây không phải là phương pháp tốt nhất + nâng cao ý thức con người mới là phương pháp tốt nhất → Tại sao đây ko là phương pháp tốt nhất? → Giá nhiên liệu đã tăng mạnh trong những năm gần đây → nhưng số lượng xe hơi vẫn tăng → Tại sao nâng cao ý thức con người mới là phương pháp tốt nhất? → Nếu ai cũng ý thức được tầm quan trọng của việc bảo vệ môi trường → họ sẽ sẵn sàng hành động"]}], "gap": {"title": "Điền từ", "text": "It is believed that the most effective solution to [combat] environmental issues is to raise fuel prices.\nWhile I accept that this measure could have some effects in the [short run], raising awareness is a better long-term solution.\nPower plants might find [alternative energy sources] such as nuclear or renewables to replace fossil fuels.\nThis would lead to fewer [greenhouse gases] and emissions released into the atmosphere.\nRising fuel prices mean that [commuting costs] would rapidly climb, forcing people to use public transport.\nPeople might take public transport, [carpool], or cycle to work rather than use private vehicles.\nIn recent years, the number of private cars has still increased at [alarming rates].\nIn order to properly solve environmental problems, we need to increase public [environmental awareness].\nIndustries might find alternative energy sources to replace [fossil fuels].\nRaising people's awareness is [by far] the best approach to deal with environmental problems.", "extra": []}, "build": [{"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "It is believed that | the most effective solution | to combat environmental issues | i rking sites like Facebook connect children globally."}, {"w": "Entertain (v) / Entertainment (n)", "vi": "Giải trí (động từ) / Sự giải trí (danh từ)", "ex": "Technology offers both entertainment and education for children.", "spell": false}, {"w": "Social activities", "vi": "Hoạt động xã hội", "ex": "Online tools can also support social activities and teamwork."}], "trans": [{"vi": "Những phát triển công nghệ mới đã thay đổi cách trẻ em sử dụng thời gian rảnh của chúng.", "en": ["Novel technological developments have altered how children spend their leisure time."]}, {"vi": "Mặc dù xu hướng này có một số nhược điểm rõ ràng, tôi tin rằng những nhược điểm này bị lu mờ bởi những lợi ích.", "en": ["Despite some obvious disadvantages of this trend, I believe that these are outweighed by the advantages."]}, {"vi": "Một mặt, có một số hạn chế lớn khi trẻ em dành quá nhiều thời gian chơi với các thiết bị công nghệ.", "en": ["On the one hand, there are a number of major drawbacks when children spend too much time playing with technological devices."]}, {"vi": "Hạn chế đầu tiên là xu hướng này sẽ có tác động xấu đến sức khỏe của chúng. Trẻ em dành nhiều thời gian cho trò chơi điện tử hoặc các hoạt động sử dụng màn hình có nhiều khả năng mắc phải các vấn đề sức khỏe khác nhau như mỏi mắt, cận thị hoặc béo phì.", "en": ["The first drawback is that this trend would have an adverse impact on their health. Children who devote a large amount of their time to video games or screen time activities are more likely to suffer from various health problems such as eye strain, short-sightedness, or obesity."]}, {"vi": "Một ảnh hưởng tiêu cực khác là việc dành nhiều thời gian hơn cho các hoạt động giải trí trực tuyến đồng nghĩa với việc có ít thời gian hơn cho các hoạt động xã hội khác.", "en": ["Another negative effect is that more time spent on online entertainment activities means less time for other social activities."]}, {"vi": "Trẻ em có xu hướng chơi game điện tử hoặc lướt web thay vì đi chơi với bạn bè cùng trang lứa. Điều này sẽ dẫn đến sự cô lập xã hội, điều này ảnh hưởng nghiêm trọng đến cuộc sống sau này của chúng.", "en": ["Children tend to play electronic games or browse the Internet instead of hanging out with their peers. This would lead to social isolation, which seriously affects their later lives."]}, {"vi": "Mặt khác, tôi tin rằng những lợi ích quan trọng hơn so với những bất lợi đó.", "en": ["On the other hand, I believe that the benefits are more significant than such disadvantages."]}, {"vi": "Thứ nhất, công nghệ mới giúp trẻ em làm giàu vốn kiến thức và học được nhiều kỹ năng hữu ích. Ví dụ, cháu gái nhỏ của tôi biết thêm về động vật và môi trường sống tự nhiên của chúng nhờ xem kênh Discovery trên iPad của cô bé.", "en": ["Firstly, new technologies help kids enrich their knowledge and learn a wide range of valuable skills. My young niece, for example, knows more about animals and their natural habitats by watching the Discovery Channel on her iPad."]}, {"vi": "Thứ hai, các thiết bị công nghệ cao thúc đẩy tính sáng tạo và trí tưởng tượng của trẻ. Chẳng hạn, một đứa trẻ có thể học cách thực hiện các thí nghiệm đơn giản bằng cách xem các chương trình giáo dục như Minute Earth hoặc Best of Science.", "en": ["Secondly, hi-tech gadgets stimulate children's creativity and imagination. A child, for instance, could learn to conduct simple experiments by watching educational programmes like Minute Earth or Best of Science."]}, {"vi": "Cuối cùng, trẻ em có nhiều cơ hội kết bạn với mọi người trên khắp thế giới bằng cách sử dụng các trang mạng xã hội như Facebook, Twitter hoặc Instagram.", "en": ["Finally, children have more opportunities to make friends from all over the world by using social networking sites such as Facebook, Twitter or Instagram."]}, {"vi": "Tóm lại, tôi cho rằng sự xuất hiện của những cải tiến công nghệ mới mang lại nhiều lợi ích hơn là bất lợi.", "en": ["In conclusion, I would argue that the appearance of new technological improvements brings more benefits than drawbacks."]}], "outline": [{"h": "Thân bài 1: HẠN CHẾ", "pts": ["Ảnh hưởng xấu lên sức khỏe của trẻ.", "Chơi game nhiều → mắc các vấn đề sức khỏe như mỏi mắt, cận thị hoặc béo phì. → Có ít thời gian cho các hoạt động xã hội", "Chơi game điện tử, lướt web thay vì đi chơi với bạn bè cùng trang lứa. → Sự cô lập xã hội → Ảnh hưởng tới cuộc sống sau này của chúng."]}, {"h": "Thân bài 2: LỢI ÍCH", "pts": ["Giúp trẻ làm giàu vốn kiến thức và học được các kỹ năng hữu ích.", "Ví dụ: Cháu tôi biết thêm về động vật và môi trường sống của chúng nhờ xem kênh Discovery trên ipad. → Thúc đẩy tính sáng tạo và tưởng tượng của trẻ.", "1 đứa trẻ có thể học làm thí nghiệm đơn giản bằng việc xem các chương trình giáo dục như Minute Earth hay Best of Science.", "Trẻ có nhiều cơ hội kết bạn với mọi người ở khắp thế giới bằng việc sử dụng các mạng XH như Facebook, Twitter, Instagram."]}], "gap": {"title": "Điền từ", "text": "Despite some obvious disadvantages of this trend, I believe that these are [outweighed] by the advantages.\nThis trend would have an [adverse impact] on children's health and development.\nChildren who [devote a large amount of time] to video games are more likely to develop health problems.\nThese children are more likely to [suffer from] various health problems such as eye strain, short-sightedness, or obesity.\nThis would lead to [social isolation], which seriously affects their later lives.\nNew technologies help kids [enrich their knowledge] and learn a wide range of valuable skills.\nHi-tech gadgets [stimulate] children's creativity and imagination through interactive content.\nTechnology helps children learn a wide range of [valuable skills] such as coding and communication.\nMy niece knows more about animals and their [natural habitats] by watching the Discovery Channel.\nChildren can make friends from all over the world by using [social networking sites] such as Facebook or Instagram.", "extra": []}, "build": [{"vi ructure of a family and the role of its members are gradually changing. What kinds of changes can occur? Do you think these changes are positive and negative?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["In the past few decades, the structure of a family and the responsibility of its members have been greatly altered. There are some important changes that have taken place, and I believe that these changes would have both benefits and drawbacks.", "Families at present have undergone two main differences compared to the past. In terms of family size, a few decades ago there were normally three or four generations living under the same roof. These days, however, nuclear families and one-person households are becoming increasingly popular. The cost of living has risen considerably, and this prevents people from having too many children. Regarding the responsibility of family members, fathers traditionally take on the role of primary breadwinner, while the job of homemaker is done by mothers. Many women in today's society have the opportunity to gain qualifications and pursue their own careers, and family financial burdens are now shared by both fathers and mothers.", "In my opinion, those changes would have both positive and negative consequences. The major benefit is that children of small families are given better education opportunities. Many children have the chance to study abroad and gain international qualifications, which would ensure them a better job after graduation. However, working parents are now too busy to take care of their offspring. Without parental care and guidance, children may suffer from various problems, ranging from autism to bad behaviours. Some children even engage in criminal activities such as illegal drug use or unlawful gambling, which may ruin their future.", "In conclusion, there are several changes in family structure and the role of its  và trách nhiệm của các thành viên đã thay đổi đáng kể.", "en": ["In the past few decades, the structure of a family and the responsibility of its members have been greatly altered."]}, {"vi": "Có một số thay đổi quan trọng đã diễn ra, và tôi tin rằng những thay đổi này sẽ có cả lợi ích và bất lợi.", "en": ["There are some important changes that have taken place, and I believe that these changes would have both benefits and drawbacks."]}, {"vi": "Hiện tại, các gia đình đã trải qua hai sự khác biệt chính so với quá khứ.", "en": ["Families at present have undergone two main differences compared to the past."]}, {"vi": "Về quy mô gia đình, vài thập kỷ trước thường có ba hoặc bốn thế hệ sống chung một mái nhà. Tuy nhiên ngày nay, các gia đình hạt nhân và hộ gia đình một người ngày càng trở nên phổ biến.", "en": ["In terms of family size, a few decades ago there were normally three or four generations living under the same roof. These days, however, nuclear families and one-person households are becoming increasingly popular."]}, {"vi": "Chi phí sinh hoạt đã tăng đáng kể, và điều này ngăn cản mọi người sinh quá nhiều con.", "en": ["The cost of living has risen considerably, and this prevents people from having too many children."]}, {"vi": "Liên quan đến trách nhiệm của các thành viên gia đình, theo truyền thống người cha đảm nhận vai trò trụ cột kinh tế chính, trong khi công việc nội trợ do người mẹ đảm nhiệm.", "en": ["Regarding the responsibility of family members, fathers traditionally take on the role of primary breadwinner, while the job of homemaker is done by mothers."]}, {"vi": "Nhiều phụ nữ trong xã hội ngày nay có cơ hội có được bằng cấp và theo đuổi sự nghiệp riêng, và gánh nặng tài chính gia đình hiện nay được chia sẻ bởi cả cha lẫn mẹ.", "en": ["Many women in today's society have the opportunity to gain qualifications and pursue their own careers, and family financial burdens are now shared by both fathers and mothers."]}, {"vi": "Theo quan điểm của tôi, những thay đổi đó sẽ có cả hệ quả tích cực và tiêu cực.", "en": ["In my opinion, those changes would have both positive and negative consequences."]}, {"vi": "Lợi ích lớn nhất là con cái của các gia đình nhỏ được trao cơ hội giáo dục tốt hơn.", "en": ["The major benefit is that children of small families are given better education opportunities."]}, {"vi": "Nhiều trẻ em có cơ hội đi du học và có được bằng cấp quốc tế, điều này sẽ đảm bảo cho chúng một công việc tốt hơn sau khi tốt nghiệp.", "en": ["Many children have the chance to study abroad and gain international qualifications, which would ensure them a better job after graduation."]}, {"vi": "Tuy nhiên, các bậc cha mẹ đi làm hiện nay quá bận rộn để chăm sóc con cái của họ. Nếu không có sự chăm sóc và hướng dẫn của cha mẹ, trẻ em có thể mắc phải nhiều vấn đề khác nhau, từ tự kỷ đến các hành vi xấu.", "en": ["However, working parents are now too busy to take care of their offspring. Without parental care and guidance, children may suffer from various problems, ranging from autism to bad behaviours."]}, {"vi": "Một số trẻ thậm chí tham gia vào các hoạt động tội phạm như sử dụng ma túy trái phép hoặc cờ bạc trái phép, điều này có thể hủy hoại tương lai của chúng.", "en": ["Some children even engage in criminal activities such as illegal drug use or unlawful gambling, which may ruin their future."]}, {"vi": "Tóm lại, có một số thay đổi trong cấu trúc gia đình và vai trò của các thành viên, và tôi cho rằng những thay đổi này vừa có lợi vừa có hại.", "en": ["In conclusion, there are several changes in family structure and the role of its members, and I would argue that these changes are both beneficial and detrimental."]}], "outline": [{"h": "Thân bài 1: NHỮNG SỰ THAY ĐỔI", "pts": ["Cấu trúc gia đình", "Ngày xưa: thường có 3 – 4 thế hệ sống chung 1 nhà.", "Bây giờ: 2 thế hệ, 1 người", "Chi phí cuộc sống tăng → ngăn cản người ta sinh quá nhiều con. → Vai trò của các thành viên", "Ngày xưa: cha là trụ cột chính, mẹ lo việ  const read=()=>{$('#pn').innerHTML=`<p class="hint" style="margin-top:0">Đọc kỹ dàn ý của bài. Sau đó bấm <b>Luyện sắp xếp dàn ý</b> để kiểm tra em đã nhớ chưa.</p>${d.tip?`<div class="lnote"><b>Lưu ý:</b> ${fmt(d.tip)}</div>`:""}<div class="ol">${P.map(p=>`<div class="olp"><b>${esc(p.h)}</b><ul>${p.pts.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" type="button" id="go">Luyện sắp xếp dàn ý</button></div>`;$('#go').onclick=prac};
 const prac=()=>{const items=[];P.forEach((p,pi)=>p.pts.forEach(x=>items.push({x,pi})));let pool=shuffle(items.map((it,k)=>({...it,k})));let picked=[],wrong=false;
  const draw=()=>{$('#pn').innerHTML=`<div class="ord"><p class="hint" style="margin:0">Chạm vào các ý theo đúng thứ tự trong bài (từ Mở bài đến Kết bài).</p><div class="ans para" id="ans">${picked.length?picked.map((p,k)=>`<button class="chip" type="button" data-p="${k}"><small style="color:var(--o);font-weight:800">${k+1}.</small> ${fmt(p.x)}</button>`).join(''):'<span class="hint" style="margin:0">Chưa chọn ý nào…</span>'}</div><div class="pool para" style="display:flex">${pool.map((p,k)=>`<button class="chip" type="button" data-k="${k}">${fmt(p.x)}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="row"><button class="btn ghost" type="button" id="rs">Xếp lại</button><button class="btn ghost" type="button" id="rv">Xem lại dàn ý</button><button class="btn" type="button" id="ck">Kiểm tra</button></div></div>`;
   $$('[data-k]').forEach(b=>b.onclick=()=>{picked.push(pool.splice(+b.dataset.k,1)[0]);draw()});
   $$('[data-p]').forEach(b=>b.onclick=()=>{pool.push(picked.splice(+b.dataset.p,1)[0]);draw()});
   $('#rs').onclick=()=>{pool=shuffle(pool.concat(picked));picked=[];draw()};$('#rv').onclick=read;
   $('#ck').onclick=()=>{if(pool.length){fb('bad','Em xếp hết các ý rồi mới kiểm tra nhé.');return}
    const bad=picked.findIndex((p,k)=>p.pi!==items[k].pi||(p.k!==k&&!(P[p.pi].h.match(/Tổng quan|Overall/i))));
    if(bad<0){report(d,'outline',wrong?0:1,1);finish(d,'outline','Em đã nắm chắc dàn ý của bài. Giờ mình viết bài nhé!')}else{wrong=true;fb('bad',`Ý thứ ${bad+1} chưa đúng vị trí. Em chạm vào để trả lại rồi xếp lại nhé.`);shake($('#ans'))}}};
  draw()};
 read()}
/* ---------- Viết bài ---------- */
let tmr=null;
function vWrite(d){const isT1=secOf(d).k==='task1';const minw=d.minw||(isT1?150:250);const mins=d.mins||(isT1?20:40);const dk='draft_'+d.id;let left=store.get('tleft_'+d.id,mins*60);let running=false;clearInterval(tmr);
 const sent=store.get('sent_'+d.id,null);const V=d.vocab||[];
 $('#pn').innerHTML=`${promptHtml(d)}${d.tip?`<div class="lnote"><b>Lưu ý:</b> ${fmt(d.tip)}</div>`:""}
 <p class="hint" style="margin-top:0">Viết ít nhất <b>${minw} từ</b>, khoảng <b>${mins} phút</b>. Bài được lưu nháp tự động trên máy. Khi xong, bấm <b>Nộp bài cho cô</b>.</p>
 <div class="wbar"><span class="wc" id="wc">0 từ</span><span><span class="tmr" id="tm"></span> <button class="btn ghost" type="button" id="tb" style="min-height:38px;padding:6px 12px">Bấm giờ</button></span></div>
 <textarea class="wr" id="es" spellcheck="false" placeholder="${minw<150?'Viết đoạn văn của em ở đây.':isT1?'Viết bài của em ở đây. Xuống dòng giữa các đoạn (Mở bài – Tổng quan – Thân bài 1 – Thân bài 2).':'Viết bài của em ở đây. Xuống dòng giữa các đoạn (Mở bài – Thân bài 1 – Thân bài 2 – Kết bài).'}"></textarea>
 ${V.length?`<div class="hint">Từ vựng của bài em đã dùng:</div><div class="used" id="used">${V.map((v,k)=>`<span data-u="${k}">${esc(v.w)}</span>`).join('')}</div>`:''}
 <ul class="ck" id="ckl"></ul><div class="fb" id="fb"></div>
 <div class="row" style="justify-content:flex-start"><button class="btn" type="button" id="sb">Nộp bài cho cô</button></div><div id="after"></div>`;
 bindZoom();
 const es=$('#es');es.value=store.get(dk,'');
 const tm=()=>{const m=Math.floor(Math.max(0,left)/60),s=Math.max(0,left)%60;$('#tm').textContent=(left<=0?'Hết giờ · ':'')+m+':'+String(s).padStart(2,'0')};tm();
 $('#tb').onclick=()=>{running=!running;$('#tb').textContent=running?'Tạm dừng':'Bấm giờ';clearInterval(tmr);if(running)tmr=setInterval(()=>{if(!$('#tm')){clearInterval(tmr);return}left--;store.set('tleft_'+d.id,left);tm();if(left===0)fb('bad','Đã hết '+mins+' phút. Em viết nốt câu cuối rồi nộp bài nhé.')},1000)};
 let confirmSend=false;
 const upd=()=>{const t=es.value;const n=wcount(t);store.set(dk,t);const w=$('#wc');w.textContent=n+' / '+minw+' từ';w.className='wc '+(n>=minw?'ok':'low');
  let used=0;V.forEach((v,k)=>{const on=stemOk(t,v.w);if(on)used++;const s=document.querySelector(`[data-u="${k}"]`);if(s)s.classList.toggle('on',on)});
  const paras=t.split(/\n/).filter(p=>wcount(p)>=6).length;const needP=minw<150?1:4;const needV=Math.min(4,V.length);
  $('#ckl').innerHTML=[[n>=minw,`Đủ ${minw} từ (${n})`],[paras>=needP,`Có ít nhất ${needP} đoạn (${paras})`]].concat(V.length?[[used>=needV,`Dùng ít nhất ${needV} từ vựng của bài (${used})`]]:[]).map(x=>`<li class="${x[0]?'ok':'no'}">${x[0]?'✓':'○'} ${x[1]}</li>`).join('');
  confirmSend=false;$('#sb').textContent=store.get('sent_'+d.id,null)?'Nộp lại bài đã sửa':'Nộp bài cho cô';return {n,used}};
 es.addEventListener('input',upd);upd();
 const showAfter=(when)=>{const ps=(d.model||[]);$('#after').innerHTML=`<div class="note" style="margin-top:14px"><b style="color:var(--green)">Đã nộp bài lúc ${esc(when)}.</b> Cô sẽ chấm và nhận xét. Em có thể sửa và nộp lại – cô sẽ nhận bản mới nhất.</div>${ps.length?`<details class="note"><summary>Xem bài mẫu để so sánh</summary><div class="row" style="justify-content:flex-start;margin:8px 0"><button class="btn alt" type="button" id="pall">Nghe cả bài mẫu</button></div><div class="essay">${ps.map((p,k)=>`<div class="pr"><button class="spk" type="button" data-mp="${k}" aria-label="Nghe đoạn">${SPK}</button><p>${esc(p)}</p></div>`).join('')}</div></details>`:''}`;
  if(ps.length){$('#pall').onclick=()=>sayAll(ps);$$('[data-mp]').forEach(b=>b.onclick=()=>say(ps[+b.dataset.mp]))}};
 if(sent)showAfter(sent);
 $('#sb').onclick=()=>{const r=upd();if(r.n<Math.round(minw*0.5)){fb('bad',`Bài mới có ${r.n} từ – em cần viết ít nhất ${Math.round(minw*0.5)} từ mới nộp được.`);shake(es);return}
  if(r.n<minw&&!confirmSend){confirmSend=true;fb('bad',`Bài chưa đủ ${minw} từ (thi thật sẽ bị trừ điểm). Nếu em vẫn muốn nộp, bấm nút thêm 1 lần nữa.`);$('#sb').textContent='Vẫn nộp bài';return}
  report(d,'write',r.used,Math.max(1,V.length),es.value.trim(),r.n);const when=new Date().toLocaleString('vi-VN');store.set('sent_'+d.id,when);
  fb('good','Đã gửi bài cho cô! ✓');confirmSend=false;$('#sb').textContent='Nộp lại bài đã sửa';clearInterval(tmr);running=false;$('#tb').textContent='Bấm giờ';showAfter(when)};
}
/* ---------- điều hướng ---------- */
function route(){stopSay();clearInterval(tmr);setWho();const h=location.hash.replace(/^#\/?/,'').split('/');
 if(h[0]==='s')secView(h[1]);else if(h[0]==='d')deView(h[1],h[2]);else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
