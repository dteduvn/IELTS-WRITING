<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing · Luyện viết – D&amp;T Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--o:#9F1239;--o2:#E11D48;--ol:#FFF1F3;--navy:#1D3557;--red:#D02F3A;--blue:#2346A8;--green:#1E7B4F;--teal:#0F766E;--ink:#1F2937;--mut:#5B6472;--bg:#FFF8F9;--card:#FFFFFF;--line:#F5D0D8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header.top{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;padding:14px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--o);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:18px;line-height:1.1}.brand small{font-size:13px;opacity:.95}
.who{font-size:14px;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;border:0;color:#fff}
h1{font-size:26px;margin:22px 0 6px;color:var(--navy)}h2{font-size:21px;margin:18px 0 10px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 16px}
.namebox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.namebox label{font-weight:700;width:100%}
.namebox input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--o);color:#fff;min-height:46px}
.btn.alt{background:#fff;color:var(--o);border:2px solid var(--o)}
.btn.ghost{background:transparent;color:var(--mut);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:8px 0 18px}
.bigbtn{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:22px;padding:20px;color:#fff;min-height:130px;text-decoration:none}
.bigbtn b{font-size:22px}.bigbtn span{font-size:14.5px;opacity:.95}
.bigbtn.soon{filter:grayscale(.35);opacity:.75;cursor:default}
.tag{display:inline-block;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;width:max-content}
.prog{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bar{height:14px;background:#F8DDE3;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));border-radius:9px;transition:width .4s}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ucard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px}
.ucard .n{font-size:13px;font-weight:800;color:var(--o);letter-spacing:1px}.ucard b{font-size:17px;color:var(--navy)}.ucard small{color:var(--mut)}
.ucard.lock{opacity:.55;cursor:default}
.ucard .done{margin-top:auto;font-size:13px;font-weight:700;color:var(--green)}
.back{background:none;border:0;color:var(--o);font-weight:700;font-size:15px;padding:12px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 10px;margin:8px 0 6px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;color:var(--mut);min-height:44px}
.tab.on{background:var(--o);border-color:var(--o);color:#fff}.tab .ok{color:var(--green)}.tab.on .ok{color:#fff}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.map img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.hint{font-size:14px;color:var(--mut);margin:8px 0 0}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fc{perspective:900px;height:230px;width:100%;display:block;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.fc .b{transform:rotateY(180deg);background:var(--ol)}
.fc img{width:100%;height:120px;object-fit:contain}
.noimg{font-size:26px;font-weight:800;color:var(--o);min-height:80px;display:flex;align-items:center}.fc .f .w:only-child{font-size:15px}
.fc .w{font-weight:800;font-size:19px;color:var(--red)}.fc .ipa{color:var(--mut);font-size:14px}.fc .vi{color:var(--blue);font-weight:700;font-size:17px}
.spk{border:0;background:var(--o);color:#fff;border-radius:50%;width:46px;height:46px;display:inline-grid;place-items:center;flex:0 0 auto}
.spk svg{width:22px;height:22px}
.ex{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:520px;margin:0 auto}
.ex img{max-width:260px;width:100%;height:170px;object-fit:contain}
.ex .vi{font-size:19px;font-weight:700;color:var(--blue)}
.ex input{font:inherit;font-size:22px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);width:100%;max-width:340px;letter-spacing:1px}
.slots{font-size:22px;letter-spacing:6px;color:var(--mut);font-weight:700}
.count{font-size:14px;color:var(--mut);font-weight:700}
.fb{min-height:28px;font-weight:700;font-size:16px}.fb.good{color:var(--green)}.fb.bad{color:var(--red)}
.shake{animation:sh .35s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-size:15px;min-height:56px;color:var(--ink)}
.mi.sel{border-color:var(--o);background:var(--ol)}.mi.ok{border-color:var(--green);background:#E8F5EE;color:var(--green);cursor:default}.mi.no{border-color:var(--red)}
.q{font-size:19px;font-weight:700;color:var(--navy);margin:4px 0 14px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;text-align:left;min-height:52px;color:var(--ink)}
.opt.no{border-color:var(--red);background:#FFF1F1}.opt.ok{border-color:var(--green);background:#E8F5EE}
.done-box{text-align:center;padding:22px 10px}.done-box .star{font-size:44px;color:var(--o2);font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--mut);font-size:13.5px;padding:20px 16px 30px}
.lf{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.lf .sent{font-size:20px;line-height:1.7;color:var(--navy);font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lf .sent input{font:inherit;font-size:19px;width:160px;max-width:100%;padding:6px 10px;border-radius:10px;border:2px solid var(--o);text-align:center;color:var(--red)}
.tfl{display:flex;flex-direction:column;gap:10px}
.tfi{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tfi span{font-size:16.5px;flex:1 1 260px}
.tfi .tb{display:flex;gap:8px}
.tfb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-weight:700;min-width:86px;min-height:44px;color:var(--ink)}
.tfb.ok{border-color:var(--green);background:#E8F5EE;color:var(--green)}.tfb.no{border-color:var(--red);background:#FFF1F1;color:var(--red)}
.tfi.done{border-color:#BFE3CF;background:#F5FBF7}
.passage{background:var(--ol);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16.5px;line-height:1.65;white-space:pre-line;margin-bottom:14px}
.passage .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;white-space:normal}
.passage .ph b{color:var(--o);font-size:17px}
.listenbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ol);border-radius:16px;padding:14px;margin-bottom:14px;text-align:center}
.spk.lg{width:64px;height:64px}.spk.lg svg{width:30px;height:30px}
.ord{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.ord .ans{min-height:64px;border:2px dashed var(--o);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:18px;font-weight:600;min-height:46px;color:var(--navy)}
.ans .chip{background:var(--ol);border-color:var(--o2)}
.vi-hint{font-size:15px;color:var(--mut);text-align:center}
.note{background:var(--ol);border:2px dashed var(--o2);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:1.5}
.note summary{font-weight:700;color:var(--o);cursor:pointer}
.sp{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.qbox{display:flex;align-items:center;gap:10px;justify-content:center;font-size:21px;font-weight:700;color:var(--navy);line-height:1.4}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--o);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.mic svg{width:36px;height:36px}.mic:disabled{opacity:.4}
.mic.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(208,47,58,.55)}100%{box-shadow:0 0 0 20px rgba(208,47,58,0)}}
.said{min-height:22px;color:var(--mut);font-style:italic;font-size:15px}
.steps{text-align:left;margin:0;padding-left:22px;line-height:1.7;font-size:16px}
.timer{width:100%;height:12px;background:var(--line);border-radius:8px;overflow:hidden}.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width 1s linear}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.gapp{font-size:17px;line-height:2.3;white-space:pre-line}
.gapp input.gp{font:inherit;font-weight:700;color:var(--blue);border:0;border-bottom:3px solid var(--o);background:var(--ol);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;min-width:4ch;max-width:100%}
.gapp input.gp.ok{border-color:var(--green);color:var(--green);background:#E8F5EE}.gapp input.gp.no{border-color:var(--red);color:var(--red);background:#FFF1F1}
.para{flex-direction:column;align-items:stretch}.para .chip{text-align:left;font-size:16px}
textarea.wr{width:100%;min-height:230px;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.7;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-top:6px}
textarea.wr:focus{outline:3px solid var(--o2);border-color:var(--o)}
.ck{list-style:none;padding:0;margin:10px 0;font-weight:700;line-height:1.8}.ck .ok{color:var(--green)}.ck .no{color:var(--red)}
@media (max-width:520px){h1{font-size:22px}.match{grid-template-columns:1fr}.fc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fc{height:190px}.fc img{height:90px}.fc .w{font-size:17px}}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vgrid .fc{height:250px}
.fc .pos{font-size:13px;font-weight:700;color:var(--teal);background:#E6F4F1;border-radius:999px;padding:1px 9px}
.fc .exs{font-size:14px;color:var(--ink);font-style:italic;line-height:1.45}
.fc .f .w{font-size:20px}
.prompt{background:#fff;border:2px solid var(--line);border-left:6px solid var(--o);border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.6;white-space:pre-line;margin-bottom:12px}
.prompt .lb{display:block;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--o);margin-bottom:4px}
.pimg{display:block;max-width:100%;margin:10px auto 0;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.tr{display:flex;flex-direction:column;gap:12px;max-width:740px;margin:0 auto}
.tr .vi{font-size:18px;font-weight:700;color:var(--blue);line-height:1.5}
.tr .wrong{font-size:18px;font-weight:600;color:var(--red);line-height:1.5}
textarea.ln{width:100%;min-height:96px;font:inherit;font-size:17px;line-height:1.55;padding:10px 12px;border:2px solid var(--line);border-radius:14px;box-sizing:border-box}
textarea.ln:focus,textarea.wr:focus{outline:3px solid #FBCFE8;border-color:var(--o)}
.model{background:#F5FBF7;border:2px solid #BFE3CF;border-radius:14px;padding:10px 14px;font-size:16.5px;line-height:1.55}
.model b{color:var(--green)}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.miss span{background:#FFF1F1;border:1px solid #F7C6C6;color:var(--red);border-radius:8px;padding:2px 8px;font-weight:700;font-size:15px}
.ol{display:flex;flex-direction:column;gap:12px}
.olp{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.olp>b{color:var(--o);display:block;margin-bottom:4px;font-size:17px}.olp ul{margin:0;padding-left:20px;line-height:1.7}
.tw{overflow-x:auto;margin:8px 0}
table.nt{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
table.nt th{background:var(--ol);color:var(--navy);text-align:left;padding:7px 9px;border:1px solid var(--line)}
table.nt td{padding:7px 9px;border:1px solid var(--line);vertical-align:top}
table.dt{width:auto;min-width:60%;margin:10px auto 0;white-space:normal}table.dt td{text-align:center}table.dt td:first-child{text-align:left;font-weight:700}
.wbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.wc{font-weight:800;font-size:16px}.wc.ok{color:var(--green)}.wc.low{color:var(--red)}
.tmr{font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy);background:var(--ol);border-radius:999px;padding:6px 14px}
.used{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.used span{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:14px;color:var(--mut)}.used span.on{background:#E8F5EE;border-color:#BFE3CF;color:var(--green);font-weight:700}
.essay p{margin:0 0 10px;line-height:1.7;font-size:16.5px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pr .spk{width:38px;height:38px}.pr .spk svg{width:18px;height:18px}
.secb{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--ol);color:var(--o);width:max-content}
.subt{font-weight:800;color:var(--navy);font-size:17px;margin:2px 0 8px}
.chip{font-size:17px}
.grph{font-size:15px;font-weight:800;color:var(--o);letter-spacing:.5px;margin:18px 0 8px;text-transform:uppercase}
.qsent{font-size:19px;font-weight:600;color:var(--navy);line-height:2.1}
.qsent input.gp{font:inherit;font-weight:700;color:var(--blue);border:0;border-bottom:3px solid var(--o);background:var(--ol);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;min-width:5ch}
.qsent input.gp.ok{border-color:var(--green);color:var(--green);background:#E8F5EE}.qsent input.gp.no{border-color:var(--red);color:var(--red);background:#FFF1F1}
.tag2{display:inline-block;font-size:12.5px;font-weight:800;border-radius:8px;padding:2px 8px;background:#EEF2FF;color:var(--blue);margin-bottom:6px}
.rv{list-style:none;padding:0;margin:12px 0 0;text-align:left;display:flex;flex-direction:column;gap:8px}
.rv li{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.5}
.rv li.ok{border-color:#BFE3CF;background:#F5FBF7}.rv li.no{border-color:#F7C6C6;background:#FFF7F7}
.rv .k{color:var(--green);font-weight:700}.rv .u{color:var(--red)}
.lnote{background:#FFFBEB;border:2px dashed #F59E0B;border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0;line-height:1.55}
</style>
</head>

a number of reasons for the rising levels of ___. (Có một số nguyên nhân dẫn đến mức độ béo phì ngày càng tăng ở trẻ em.)", "a": ["childhood obesity"], "why": ""}]}, {"id": "t2-ageing-population", "code": "Đề 7", "kind": "Problems – Solutions", "title": "Ageing population", "vi": "Dân số già", "grp": "Đề theo dạng bài", "prompt": "In the developed world, average life expectancy is increasing. What problems will this cause for individuals and society? Suggest some measures that could be taken to reduce the impact of ageing\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["It is true that in industrialized nations, people are living longer than ever before. Although there will undoubtedly be some negative consequences of this trend, solutions can be taken to mitigate these potential problems.", "There are a number of problems related to this trend. The main issue is that there will obviously be more people of retirement age who will be eligible to receive a pension. The proportion of younger, working adults will be smaller, and governments will therefore receive less money in taxes. Another problem is a rise in the demand for healthcare. This would mean that more money would need to be allocated to health care for the ageing population. Finally, there would be a decline in population growth as young adults will increasingly have to look after their elderly relatives, which could prevent them from having a family of their own.", "However, there are several actions that could be taken to solve the problems mentioned above. Firstly, it is important for the government to increase the retirement age for working adults, perhaps from 65 to 70. If people work longer, they will pay more in taxes, reducing the cost of government pensions. Secondly, the government should encourage the immigration of working people in order to increase the number of working adults who pay taxes. Finally, money from national budgets will need to be taken from other areas and spent on vital healthcare, accommodation, and transport facilities for the rising number of older citizens", "In conclusion, various measures can be implemented to tackle the problems that are certain to arise as the populations of countries grow older."], "vocab": [{"w": "The developed world / Industrialized nations", "vi": "Thế giới phát triển / Các quốc gia công nghiệp hóa", "ex": "In industrialized nations, people are living longer than ever.", "spell": false}, {"w": "Average life expectancy is increasing", "vi": "Tuổi thọ trung bình đang tăng lên", "ex": "Average life expectancy is increasing in most countries.", "spell": false}, {"w": "People are living longer than ever before", "vi": "Con người đang sống lâu hơn bao giờ hết", "ex": "People are living longer than ever before due to better healthcare.", "spell": false}, {"w": "Ageing population", "vi": "Dân số già hóa", "ex": "An ageing population puts pressure on public services."}, {"w": "A decline in population growth", "vi": "Sự suy giảm tăng trưởng dân số", "ex": "There would be a decline in population growth as a result.", "spell": false}, {"w": "Older citizens", "vi": "Công dân lớn tuổi / Người cao tuổi", "ex": "More resources are needed for the rising number of older citizens."}, {"w": "Elderly relatives", "vi": "Người thân lớn tuổi", "ex": "Young adults increasingly have to look after elderly relatives."}, {"w": "Retire / Retirement", "vi": "Nghỉ hưu / Sự nghỉ hưu", "ex": "More people are retiring earlier than before.", "sp": "Retire"}, {"w": "People of retirement age", "vi": "Người trong độ tuổi nghỉ hưu", "ex": "People of retirement age are eligible to receive a pension."}, {"w": "Pension / Receive a pension", "vi": "Lương hưu / Nhận lương hưu", "ex": "The government spends more on pensions each year.", "sp": "Pension"}, {"w": "Eligible", "vi": "Đủ điều kiện", "ex": "More elderly people are eligible to receive government support."}, {"w": "Working adults", "vi": "Người trưởng thành đang đi làm", "ex": "The proportion of working adults is shrinking."}, {"w": "Tax / Pay more in taxes", "vi": "Thuế / Đóng nhiều thuế hơn", "ex": "Fewer workers means governments receive less money in taxes.", "sp": "Tax"}, {"w": "Reduce the cost of government pensions", "vi": "Giảm chi phí lương hưu", "ex": "Higher retirement age reduces the cost of government pensions.", "spell": false}, {"w": "Demand for healthcare", "vi": "Nhu cầu chăm sóc sức khỏe", "ex": "An ageing population creates a rise in demand for healthcare."}, {"w": "Vital healthcare", "vi": "Dịch vụ chăm sóc sức khỏe thiết yếu", "ex": "Governments must fund vital healthcare for elderly citizens."}, {"w": "Allocate to", "vi": "Phân bổ cho", "ex": "More money must be allocated to healthcare for the elderly."}, {"w": "Look after", "vi": "Chăm sóc", "ex": "Young people must look after their elderly relatives."}, {"w": "Prevent sb from doing sthg", "vi": "Ngăn cản ai làm điều gì", "ex": "Caring duties prevent young adults from starting families."}, {"w": "Having a family of their own", "vi": "Có gia đình riêng", "ex": "This could prevent them from having a family of their own."}, {"w": "Accommodation", "vi": "Chỗ ở", "ex": "More accommodation must be built for elderly residents."}, {"w": "Transport facilities", "vi": "Cơ sở / Phương tiện giao thông", "ex": "Better transport facilities are needed for older citizens."}, {"w": "Increase the retirement age", "vi": "Tăng tuổi nghỉ hưu", "ex": "The government should increase the retirement age to 70."}, {"w": "Encourage the immigration of working people", "vi": "Khuyến khích lao động nhập cư", "ex": "Encouraging immigration helps increase the working population.", "spell": false}, {"w": "Increase the number of working adults", "vi": "Tăng số lượng người đi làm", "ex": "Immigration can increase the number of working adults.", "spell": false}, {"w": "Need to be taken from other areas", "vi": "Cần được lấy từ các lĩnh vực khác", "ex": "Funds need to be taken from other areas for elderly care.", "spell": false}, {"w": "In order to …", "vi": "Để / Nhằm …", "ex": "The policy was introduced in order to reduce pension costs.", "spell": false}, {"w": "It is important for sb to do sthg", "vi": "Điều quan trọng là ai đó làm gì", "ex": "It is important for governments to act on this issue now.", "spell": false}], "trans": [{"vi": "Đúng là ở các quốc gia công nghiệp hóa, con người đang sống lâu hơn bao giờ hết.", "en": ["It is true that in industrialized nations, people are living longer than ever before."]}, {"vi": "Mặc dù xu hướng này chắc chắn sẽ có một số hậu quả tiêu cực, các giải pháp có thể được thực hiện để giảm thiểu những vấn đề tiềm ẩn này.", "en": ["Although there will undoubtedly be some negative consequences of this trend, solutions can be taken to mitigate these potential problems."]}, {"vi": "Có một số vấn đề liên quan đến xu hướng này.", "en": ["There are a number of problems related to this trend."]}, {"vi": "Vấn đề chính là rõ ràng sẽ có nhiều người ở độ tuổi nghỉ hưu đủ điều kiện nhận lương hưu hơn.", "en": ["The main issue is that there will obviously be more people of retirement age who will be eligible to receive a pension."]}, {"vi": "Tỷ lệ người trưởng thành trẻ đang đi làm sẽ nhỏ hơn, và do đó chính phủ sẽ thu được ít tiền thuế hơn.", "en": ["The proportion of younger, working adults will be smaller, and governments will therefore receive less money in taxes."]}, {"vi": "Một vấn đề khác là nhu cầu chăm sóc sức khỏe gia tăng. Điều này có nghĩa là nhiều tiền hơn sẽ cần được phân bổ cho chăm sóc sức khỏe của dân số già hóa.", "en": ["Another problem is a rise in the demand for healthcare. This would mean that more money would need to be allocated to health care for the ageing population."]}, {"vi": "Cuối cùng, sẽ có sự suy giảm tăng trưởng dân số khi người trẻ ngày càng phải chăm sóc người thân lớn tuổi của họ, điều này có thể ngăn cản họ có gia đình riêng.", "en": ["Finally, there would be a decline in population growth as young adults will increasingly have to look after their elderly relatives, which could prevent them from having a family of their own."]}, {"vi": "Tuy nhiên, có một số hành động có thể được thực hiện để giải quyết các vấn đề nêu trên.", "en": ["However, there are several actions that could be taken to solve the problems mentioned above."]}, {"vi": "Thứ nhất, điều quan trọng là chính phủ phải tăng tuổi nghỉ hưu cho người lao động, có lẽ từ 65 lên 70 tuổi.", "en": ["Firstly, it is important for the government to increase the retirement age for working adults, perhaps from 65 to 70."]}, {"vi": "Nếu mọi người làm việc lâu hơn, họ sẽ đóng thuế nhiều hơn, từ đó giảm chi phí lương hưu của chính phủ.", "en": ["If people work longer, they will pay more in taxes, reducing the cost of government pensions."]}, {"vi": "Thứ hai, chính phủ nên khuyến khích lao động nhập cư nhằm tăng số lượng người trưởng thành đang đi làm và đóng thuế.", "en": ["Secondly, the government should encourage the immigration of working people in order to increase the number of working adults who pay taxes."]}, {"vi": "Cuối cùng, tiền từ ngân sách quốc gia sẽ cần được lấy từ các lĩnh vực khác và chi cho dịch vụ chăm sóc sức khỏe thiết yếu, chỗ ở và phương tiện giao thông cho số lượng ngày càng tăng của người cao tuổi.", "en": ["Finally, money from national budgets will need to be taken from other areas and spent on vital healthcare, accommodation, and transport facilities for the rising number of older citizens."]}, {"vi": "Tóm lại, có thể thực hiện nhiều biện pháp khác nhau để giải quyết những vấn đề chắc chắn sẽ phát sinh khi dân số của các quốc gia ngày càng già đi.", "en": ["In conclusion, various measures can be implemented to tackle the problems that are certain to arise as the populations of countries grow older."]}], "outline": [{"h": "Thân bài 1: VẤN ĐỀ", "pts": ["1. Tăng số người nghỉ hưu nhận lương hưu", "Lao động trẻ chiếm tỷ lệ nhỏ hơn chính phủ thu số tiền thuế ít hơn", "2. Người già nhu cầu y tế cao", "Chi nhiều tiền hơn vào y tế", "3. Giảm dân số", "Người trẻ phải dành thời gian nhiều hơn để chăm sóc cha mẹ/thân nhân cao tuổi → Ngăn cản họ lập gia đình"]}, {"h": "Thân bài 2: GIẢI PHÁP", "pts": ["1. Chính phủ tăng tuổi nghỉ hưu", "Người dân làm việc lâu hơn đóng thuế nhiều hơn + giảm chi tiêu lương hưu của chính phủ", "2. Khuyến khích nhập cư", "Tăng lượng người lao động thuế sẽ được tăng", "3. Ngân sách chi trả cho y tế, chăm sóc cho người già nên lấy từ lĩnh vực khác thay vì lấy từ ngân sách nhà nước"]}], "gap": {"title": "Điền từ", "text": "In industrialized nations, people are living [longer] than ever before.\nThere will obviously be more people of retirement age who will be eligible to receive a [pension].\nThe proportion of younger, working adults will be smaller, and governments will therefore receive less money in [taxes].\nMore money would need to be [allocated] to healthcare for the ageing population.\nYoung adults will increasingly have to look after their [elderly relatives], which could prevent them from having a family.\nIt is important for the government to increase the [retirement age] for working adults, perhaps from 65 to 70.\nThe government should encourage the [immigration] of working people in order to increase the number of taxpayers.\nMoney from national budgets will need to be taken from other areas and spent on vital healthcare and [accommodation] for older citizens.", "extra": []}, "build": [{"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Although there will undoubtedly | be some negative consequences | of this trend, solutions | can be taken to | mitigate these potential problems."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "There will obviously be | more people of retirement age | who will be eligible | to receive a pension."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "More money | would need to be allocated | to healthcare | for the ageing population."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Young adults | will increasingly have to | look after their elderly relatives, | which could prevent them | from having a family of their own."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "If people work longer, | they will pay more in taxes, | reducing the cost | of government pensions."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "Various measures | can be implemented | to tackle the problems | that are certain to arise | as the populations of countries grow older."}], "ready": true, "test": [{"t": "mc", "q": "“Prevent sb from doing sthg” nghĩa là:", "o": ["Ngăn cản ai làm điều gì", "Nhu cầu chăm sóc sức khỏe", "Tuổi thọ trung bình đang tăng lên"], "why": ""}, {"t": "mc", "q": "“People of retirement age” nghĩa là:", "o": ["Người trong độ tuổi nghỉ hưu", "Thuế / Đóng nhiều thuế hơn", "Khuyến khích lao động nhập cư"], "why": ""}, {"t": "mc", "q": "“Older citizens” nghĩa là:", "o": ["Công dân lớn tuổi / Người cao tuổi", "Dịch vụ chăm sóc sức khỏe thiết yếu", "Chỗ ở"], "why": ""}, {"t": "mc", "q": "“Vital healthcare” nghĩa là:", "o": ["Dịch vụ chăm sóc sức khỏe thiết yếu", "Cơ sở / Phương tiện giao thông", "Đủ điều kiện"], "why": ""}, {"t": "mc", "q": "“Tax / Pay more in taxes” nghĩa là:", "o": ["Thuế / Đóng nhiều thuế hơn", "Chăm sóc", "Sự suy giảm tăng trưởng dân số"], "why": ""}, {"t": "mc", "q": "“Allocate to” nghĩa là:", "o": ["Phân bổ cho", "Cần được lấy từ các lĩnh vực khác", "Điều quan trọng là ai đó làm gì"], "why": ""}, {"t": "fill", "q": "It is true that in industrialized nations, ___. (Đúng là ở các quốc gia công nghiệp hóa, con người đang sống lâu hơn bao giờ hết.)", "a": ["people are living longer than ever before"], "why": ""}, {"t": "fill", "q": "Secondly, the government should encourage the immigration of working people in order to increase the number of ___ who pay taxes. (Thứ hai, chính phủ nên khuyến khích lao động nhập cư nhằm tăng số lượng người trưởng thành đang đi làm và đóng thuế.)", "a": ["working adults"], "why": ""}, {"t": "fill", "q": "Finally, there would be a decline in population growth as young adults will increasingly have to ___ their elderly relatives, which could prevent them from having a family of their own. (Cuối cùng, sẽ có sự suy giảm tăng trưởng dân số khi người trẻ ngày càng phải chăm sóc người thân lớn tuổi của họ, điều này có thể ngăn cản họ có gia đình riêng.)", "a": ["look after"], "why": ""}, {"t": "fill", "q": "Another problem is a rise in the ___. This would mean that more money would need to be allocated to health care for the ageing population. (Một vấn đề khác là nhu cầu chăm sóc sức khỏe gia tăng. Điều này có nghĩa là nhiều tiền hơn sẽ cần được phân bổ cho chăm sóc sức khỏe của dân số già hóa.)", "a": ["demand for healthcare"], "why": ""}]}, {"id": "t2-single-sex-schools", "code": "Đề 8", "kind": "Discuss both views", "title": "Single-sex vs mixed schools", "vi": "Trường đơn giới hay trường hỗn hợp", "grp": "Đề theo dạng bài", "prompt": "Some people think that it is better to educate boys and girls in separate schools. Others, however, believe that boys and girls benefit more from attending mixed schools. Discuss both these views and give your own opinion.\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["It would be argued by some that it is more beneficial to send students to single sex schools. In my opinion, however, they should enter mixed gender education.", "On the one hand, there are a number of reasons why some think that students should study in single-gender schools. The first reason is that when boys and girls are taught separately, there is little chance for early relationships. Without worrying about these distractions, students might be able to concentrate more on their studies, and therefore, might get higher academic results than those at co-ed schools. Another reason is that boys and girls have different learning needs. Therefore, it is better for them to be taught separately as single-sex schools offer teaching styles, subject choices, and learning programmes that are entirely focused on either boys or girls.", "On the other hand, I would argue that it would be better for students to enter mixed-gender education. Firstly, students studying in co-ed schools have the opportunity to interact and take part in group work activities with opposite-sex classmates. This may help them learn a wide range of skills, such as communication or teamwork, which are necessary for their later jobs. Secondly, co-ed schools teach them about co-existence and gender equality. This is because male and female students are given the chance to explore each other’s perspectives, their similarities, and differences.", "In conclusion, although some people think that students should be sent to single-sex schools, I personally believe that mixed-gender education brings more benefits for students."], "vocab": [{"w": "Separate schools / Single-sex schools", "vi": "Trường học tách biệt / đơn giới tính", "ex": "Single-sex schools separate boys and girls completely.", "spell": false}, {"w": "Mixed schools / Co-ed schools", "vi": "Trường học hỗn hợp nam nữ", "ex": "Co-ed schools allow boys and girls to study together.", "spell": false}, {"w": "Integrated schools", "vi": "Trường học hòa nhập", "ex": "Integrated schools promote gender equality from an early age."}, {"w": "Send sb to … / Enter … school", "vi": "Gửi ai học ở … / Vào học trường …", "ex": "Many parents send their children to single-sex schools.", "spell": false}, {"w": "Opposite sex classmates", "vi": "Bạn cùng lớp khác giới", "ex": "Students interact with opposite sex classmates in co-ed schools."}, {"w": "Be more beneficial / Bring more benefit for sb", "vi": "Có lợi hơn / Mang lại nhiều lợi ích hơn", "ex": "Mixed schools bring more benefits for students' social development." de range of …", "vi": "Nhiều loại / Đa dạng …", "ex": "Co-ed students develop a wide range of social skills.", "spell": false}, {"w": "Co-existence", "vi": "Sự cùng tồn tại / Chung sống", "ex": "Mixed schools teach students about co-existence."}, {"w": "Gender equality", "vi": "Bình đẳng giới", "ex": "Co-ed schools promote gender equality among students."}, {"w": "Explore each other's perspectives", "vi": "Khám phá quan điểm của nhau", "ex": "Students explore each other's perspectives in mixed classes.", "spell": false}, {"w": "Similarities and differences", "vi": "Điểm giống và khác nhau", "ex": "They learn about their similarities and differences."}], "trans": [{"vi": "Một số người cho rằng việc gửi học sinh đến các trường đơn giới tính sẽ có lợi hơn.", "en": ["It would be argued by some that it is more beneficial to send students to single sex schools."]}, {"vi": "Tuy nhiên, theo quan điểm của tôi, học sinh nên tham gia nền giáo dục hỗn hợp giới tính.", "en": ["In my opinion, however, they should enter mixed gender education."]}, {"vi": "Một mặt, có một số lý do tại sao một số người cho rằng học sinh nên học ở các trường đơn giới tính.", "en": ["On the one hand, there are a number of reasons why some think that students should study in single-gender schools."]}, {"vi": "Lý do đầu tiên là khi nam và nữ được dạy riêng biệt, hầu như không có cơ hội cho các mối quan hệ tình cảm sớm.", "en": ["The first reason is that when boys and girls are taught separately, there is little chance for early relationships."]}, {"vi": "Không phải lo lắng về những sự xao nhãng này, học sinh có thể tập trung nhiều hơn vào việc học và do đó có thể đạt kết quả học tập cao hơn so với những học sinh ở trường hỗn hợp.", "en": ["Without worrying about these distractions, students might be able to concentrate more on their studies, and therefore, might get higher academic results than those at co-ed schools."]}, {"vi": "Một lý do khác là nam và nữ có các nhu cầu học tập khác nhau. Vì vậy, sẽ tốt hơn nếu họ được dạy riêng biệt vì các trường đơn giới tính cung cấp các phong cách giảng dạy, lựa chọn môn học và chương trình học hoàn toàn tập trung vào nam hoặc nữ.", "en": ["Another reason is that boys and girls have different learning needs. Therefore, it is better for them to be taught separately as single-sex schools offer teaching styles, subject choices, and learning programmes that are entirely focused on either boys or girls."]}, {"vi": "Mặt khác, tôi cho rằng sẽ tốt hơn cho học sinh nếu tham gia nền giáo dục hỗn hợp giới tính.", "en": ["On the other hand, I would argue that it would be better for students to enter mixed-gender education."]}, {"vi": "Thứ nhất, học sinh học ở các trường hỗn hợp có cơ hội tương tác và tham gia các hoạt động làm việc nhóm với các bạn cùng lớp khác giới.", "en": ["Firstly, students studying in co-ed schools have the opportunity to interact and take part in group work activities with opposite-sex classmates."]}, {"vi": "Điều này có thể giúp họ học được nhiều kỹ năng khác nhau như giao tiếp hay làm việc nhóm, vốn rất cần thiết cho công việc sau này của họ.", "en": ["This may help them learn a wide range of skills, such as communication or teamwork, which are necessary for their later jobs."]}, {"vi": "Thứ hai, các trường hỗn hợp dạy học sinh về sự cùng tồn tại và bình đẳng giới.", "en": ["Secondly, co-ed schools teach them about co-existence and gender equality."]}, {"vi": "Điều này là vì học sinh nam và nữ được trao cơ hội khám phá quan điểm của nhau, những điểm giống và khác nhau giữa họ.", "en": ["This is because male and female students are given the chance to explore each other's perspectives, their similarities, and differences."]}, {"vi": "Tóm lại, mặc dù một số người cho rằng học sinh nên được gửi đến các trường đơn giới tính, tôi cá nhân tin rằng nền giáo dục hỗn hợp giới tính mang lại nhiều lợi ích hơn cho học sinh.", "en": ["In conclusion, although some people think that students should be sent to single-sex schools, I personally believe that mixed-gender education brings more benefits for students."]}], "outline": [{"h": "Thân bài 1: TẠI SAO MỘT SỐ NGƯỜI NGHĨ RẰNG HỌC SINH NÊN HỌC TẠI TRƯỜNG KHÁC GIỚI", "pts": ["Nam nữ được dạy riêng biệt hầu như không có cơ hội cho việc nảy sinh tình cảm sớm → không bị sao nhãng tập trung học nhiều hơn kết quả học tập cao hơn", "Nam & nữ có yêu cầu học khác nhau → nhà trường có thể cung cấp những phong cách giảng dạy và việc lựa chọn môn học mà được tập trung hoàn toàn vào chỉ nam hoặc chỉ nữ"]}, {"h": "Thân bài 2: TẠI SAO TÔI NGHĨ RẰNG HỌC SINH THAM GIA TRƯỜNG 2 GIỚI", "pts": ["Tương tác + Tham gia hoạt động nhóm với bạn khác giới → học được nhiều kỹ năng (giao tiếp + teamwork) cần thiết cho công việc tương lai", "Trường 2 giới dạy học sinh về việc cùng tồn tại + bình đẳng giới → học sinh có cơ hội khám phá khía cạnh quan điểm của nhau + sự giống và khác nhau"]}], "gap": {"title": "Điền từ", "text": "It would be argued by some that it is more [beneficial] to send students to single-sex schools.\nWhen boys and girls are taught separately, there is little chance for [early relationships].\nStudents might be able to [concentrate] more on their studies without these distractions.\nBoys and girls have different learning [needs], so single-sex schools can cater to each gender specifically.\nStudents in co-ed schools have the opportunity to [interact] and take part in group work with opposite-sex classmates.\nMixed-gender schools teach students about [co-existence] and gender equality.\nMale and female students are given the chance to explore each other's perspectives, their similarities, and [differences].\nI personally believe that mixed-gender education [brings] more benefits for students.", "extra": []}, "build": [{"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "It would be argued | by some | that it is more beneficial | to send students | to single-sex schools."}, {"vi": "Sắp xếp các cụm từ thành câu hoàn chỉnh.", "s": "When boys an hools offer ___, subject choices, and learning programmes that are entirely focused on either boys or girls. (Một lý do khác là nam và nữ có các nhu cầu học tập khác nhau. Vì vậy, sẽ tốt hơn nếu họ được dạy riêng biệt vì các trường đơn giới tính cung cấp các phong cách giảng dạy, lựa chọn môn học và chương trình học hoàn toàn tập trung vào nam hoặc nữ.)", "a": ["teaching styles"], "why": ""}, {"t": "fill", "q": "Secondly, co-ed schools teach them about co-existence and ___. (Thứ hai, các trường hỗn hợp dạy học sinh về sự cùng tồn tại và bình đẳng giới.)", "a": ["gender equality"], "why": ""}, {"t": "fill", "q": "Firstly, students studying in co-ed schools have the opportunity to interact and take part in ___ with opposite-sex classmates. (Thứ nhất, học sinh học ở các trường hỗn hợp có cơ hội tương tác và tham gia các hoạt động làm việc nhóm với các bạn cùng lớp khác giới.)", "a": ["group work activities"], "why": ""}, {"t": "fill", "q": "This is because male and female students are given the chance to ___, their similarities, and differences. (Điều này là vì học sinh nam và nữ được trao cơ hội khám phá quan điểm của nhau, những điểm giống và khác nhau giữa họ.)", "a": ["explore each other's perspectives"], "why": ""}]}, {"id": "t2-living-alone", "code": "Đề 9", "kind": "Positive / Negative", "title": "Living alone", "vi": "Sống một mình", "grp": "Đề theo dạng bài", "prompt": "In some countries, many more people are choosing to live alone nowadays than in the past. Do you think this is a positive or negative development?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["In some nations, an increasing number of people are choosing to live by themselves. I personally believe that this trend has both benefits and drawbacks.", "There are two major disadvantages of the rise in one-person households. The first drawback is that people who decide to live alone may experience feelings of loneliness, isolation, and worry because they live without the daily support from their family. Elderly people and the divorced are a case in point. These groups are more at risk of depression, which is becoming an increasingly severe problem in society. Another drawback is that the safety of people living alone could be at risk since there would be no one to help them out of a dangerous situation. If a person has a heart attack or any other sudden illness, there would be no one to discover him and take him to the hospital.", "Despite the negatives mentioned above, living alone brings a wide range of benefits. Firstly, people who choose to live alone may become more independent and self-reliant than those who live with family members. This is because they may need to learn to pay bills, manage their budget, and take care of themselves. Secondly, living alone can provide inner peace and freedom to design their own lives. They can create their own rules and make their own decisions without worrying about other people's opinions. A person living alone, for instance, is free to decorate his own room in his favourite way and do whatever he wants to do.", "In conclusion, in my opinion, the increase in one-person households has both beneficial and detrimental effects."], "vocab": [{"w": "In some nations / In some countries", "vi": "Ở một số quốc gia", "ex": "In some nations, more people are choosing to live alone.", "spell": false}, {"w": "An increasing number of", "vi": "Một số lượng ngày càng tăng", "ex": "An increasing number of people are deciding to live by themselves."}, {"w": "Choose / Decide", "vi": "Lựa chọn / Quyết định", "ex": "More young adults choose to live alone after graduating.", "sp": "Choose"}, {"w": "To live by themselves / To live alone", "vi": "Sống một mình", "ex": "She decided to live by herself after her divorce.", "spell": false}, {"w": "The rise in one-person households", "vi": "Sự gia tăng của các hộ gia đình một người", "ex": "The rise in ng to live by themselves."]}, {"vi": "Cá nhân tôi tin rằng xu hướng này có cả lợi ích và bất lợi.", "en": ["I personally believe that this trend has both benefits and drawbacks."]}, {"vi": "Có hai bất lợi lớn của sự gia tăng các hộ gia đình một người.", "en": ["There are two major disadvantages of the rise in one-person households."]}, {"vi": "Bất lợi đầu tiên là những người quyết định sống một mình có thể trải qua cảm giác cô đơn, cô lập và lo lắng vì họ sống mà không có sự hỗ trợ hàng ngày từ gia đình.", "en": ["The first drawback is that people who decide to live alone may experience feelings of loneliness, isolation, and worry because they live without the daily support from their family."]}, {"vi": "Người già và người ly dị là những ví dụ điển hình. Những nhóm này có nguy cơ cao hơn về trầm cảm, vốn đang trở thành một vấn đề ngày càng nghiêm trọng trong xã hội.", "en": ["Elderly people and the divorced are a case in point. These groups are more at risk of depression, which is becoming an increasingly severe problem in society."]}, {"vi": "Một bất lợi khác là sự an toàn của những người sống một mình có thể gặp nguy hiểm vì sẽ không có ai giúp họ thoát khỏi một tình huống nguy hiểm.", "en": ["Another drawback is that the safety of people living alone could be at risk since there would be no one to help them out of a dangerous situation."]}, {"vi": "Nếu một người bị nhồi máu cơ tim hoặc bất kỳ bệnh bất ngờ nào khác, sẽ không có ai phát hiện ra và đưa anh ta đến bệnh viện.", "en": ["If a person has a heart attack or any other sudden illness, there would be no one to discover him and take him to the hospital."]}, {"vi": "Mặc dù có những bất lợi được đề cập ở trên, sống một mình mang lại nhiều lợi ích.", "en": ["Despite the negatives mentioned above, living alone brings a wide range of benefits."]}, {"vi": "Thứ nhất, những người chọn sống một mình có thể trở nên độc lập và tự lập hơn so với những người sống cùng các thành viên gia đình.", "en": ["Firstly, people who
