ply unrealistic to offer university places to everyone.", "spell": false}, {"w": "Accommodate such a sudden increase", "vi": "Đáp ứng sự gia tăng đột ngột như vậy", "ex": "Universities cannot accommodate such a sudden increase in students.", "spell": false}, {"w": "Campus (n)", "vi": "Khuôn viên trường", "ex": "The number of students on campus has grown significantly.", "spell": false}, {"w": "Not to mention the fact that …", "vi": "Chưa kể đến việc …", "ex": "Not to mention the fact that most departments are short-staffed.", "spell": false}, {"w": "Department (n)", "vi": "Khoa / Phòng ban", "ex": "Many university departments are struggling with limited staff.", "spell": false}, {"w": "Short-staffed (adj)", "vi": "Thiếu nhân sự", "ex": "Most departments are currently short-staffed and cannot handle more students.", "spell": false}, {"w": "Oppose (v)", "vi": "Phản đối", "ex": "I strongly oppose the idea of providing university for the majority.", "spell": false}], "trans": [{"vi": "Một số người cho rằng việc cung cấp giáo dục đại học cho đa số người trẻ là không thể và không hữu ích.", "en": ["Some people might argue that providing tertiary education for the majority of young people is not possible and not useful."]}, {"vi": "Cá nhân tôi đồng ý với những ý kiến này và sẽ trình bày lý do của mình trong bài viết dưới đây.", "en": ["Personally, I agree with these ideas and will outline my reasons in the essay below."]}, {"vi": "Thứ nhất, việc có bằng đại học không còn đóng vai trò quan trọng trong tương lai của người trẻ, ngay cả trong xã hội đề cao kiến thức này.", "en": ["Firstly, having a university degree no longer plays a vital role in the future of young people, even in this knowledge-based society."]}, {"vi": "Ở nhiều quốc gia, đặc biệt là Đức, đào tạo nghề đã trở nên phổ biến hơn trong giới trẻ vì nó nâng cao cơ hội việc làm cũng như sự đảm bảo việc làm sau khi hoàn thành.", "en": ["In many countries, especially Germany, vocational training has gained more popularity among young people because it enhances employment opportunities as well as job security upon completion."]}, {"vi": "Hơn nữa, nếu tất cả mọi người đều được nhận vào đại học, điều đó sẽ dẫn đến sự mất cân bằng trong nơi làm việc và sẽ gây tổn hại lớn đến cấu trúc kinh tế của một quốc gia.", "en": ["Furthermore, if everyone could get admitted to college, it would lead to imbalances in the workforce that would greatly damage the economic structure of a country."]}, {"vi": "Điều này là vì có rất ít khả năng rằng sinh viên tốt nghiệp đại học sẽ chọn công việc lao động chân tay như làm việc trong nhà máy hơn là các công việc mà họ đủ tiêu chuẩn.", "en": ["This is because there is little chance that university graduates would choose blue-collar jobs such as working in factories over the jobs that they are qualified for."]}, {"vi": "Thứ hai, tôi cho rằng không thể cung cấp cho hầu hết tất cả người trẻ khả năng tiếp cận giáo dục đại học.", "en": ["Secondly, I think that it is impossible to provide almost all young people with access to tertiary education."]}, {"vi": "Ở Việt Nam, nhu cầu vào đại học không ngừng tăng lên. Điều này đặt chính phủ vào tình thế tiến thoái lưỡng nan về việc có nên mạo hiểm phân bổ nguồn lực và có thể đối mặt với khó khăn tài chính do chi phí giáo dục quá cao ở nhiều trường đại học tự chủ tài chính hay không.", "en": ["In Vietnam, the demand for entering college never ceases to grow. This puts the government in a dilemma of whether they should risk allocating their resources and possibly face a financial predicament due to exorbitant education costs in many financially independent universities, such as the National Economics University."]}, {"vi": "Hơn nữa, điều này đơn giản là không thực tế khi các trường đại học phải đáp ứng sự gia tăng đột ngột như vậy về số lượng sinh viên trong khuôn viên trường, chưa kể đến việc hầu hết các khoa hiện đang thiếu nhân sự.", "en": ["Furthermore, it is simply unrealistic for universities to accommodate such a sudden increase in the number of students on campus, not to mention the fact that most departments are currently short-staffed."]}, {"vi": "Tóm lại, tôi mạnh mẽ phản đối ý tưởng cung cấp giáo dục đại học cho một tỷ lệ lớn người trẻ dựa trên những lập luận đã trình bày ở trên.", "en": ["In conclusion, I strongly oppose the idea of dispensing university education to a high proportion of young people owing to the arguments presented above."]}], "outline": [{"h": "Mở bài", "pts": ["Diễn đạt lại đề: cung cấp giáo dục đại học cho đa số người trẻ là không khả thi và không hữu ích", "Nêu quan điểm: **đồng ý**"]}, {"h": "Thân bài 1 – Không hữu ích", "pts": ["Bằng đại học không còn đóng vai trò quan trọng", "Ví dụ Đức: đào tạo nghề phổ biến hơn vì tăng cơ hội việc làm và sự ổn định", "Ai cũng vào đại học → mất cân bằng lực lượng lao động, ít người chọn công việc lao động chân tay"]}, {"h": "Thân bài 2 – Không khả thi", "pts": ["Nhu cầu vào đại học ở Việt Nam tăng không ngừng → chính phủ khó khăn về ngân sách", "Trường đại học không đủ chỗ và thiếu giảng viên cho lượng sinh viên tăng đột ngột"]}, {"h": "Kết bài", "pts": ["Khẳng định lại: phản đối việc cung cấp giáo dục đại học cho đa số người trẻ"]}], "prompt": "It is neither possible nor useful to provide university places for a high proportion of young people. To what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["Some people might argue that providing tertiary education for the majority of young people is not possible and not useful. Personally, I agree with these ideas and will outline my reasons in the essay below.", "Firstly, having a university degree no longer plays a vital role in the future of young people, even in this knowledge-based society. In many countries, especially Germany, vocational training has gained more popularity among young people because it enhances employment opportunities as well as job security upon completion. Furthermore, if everyone could get admitted to college, it would lead to imbalances in the workforce that would greatly damage the economic structure of a country. This is because there is little chance that university graduates would choose blue-collar jobs such as working in factories over the jobs that they are qualified for.", "Secondly, I think that it is impossible to provide almost all young people with access to tertiary education. In Vietnam, the demand for entering college never ceases to grow. This puts the government in a dilemma of whether they should risk allocating their resources and possibly face a financial predicament due to exorbitant education costs in many financially independent universities, such as the National Economics University. Furthermore, it is simply unrealistic for universities to accommodate such a sudden increase in the number of students on campus, not to mention the fact that most departments are currently short-staffed.", "In conclusion, I strongly oppose the idea of dispensing university education to a high proportion of young people owing to the arguments presented above."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "Some people might argue that providing tertiary education for the [majority] of young people is not possible and not useful. Personally, I agree with these ideas and will outline my reasons in the essay below.\nFirstly, having a university degree no longer plays a vital role in the future of young people, even in this knowledge-based society. In many countries, especially Germany, vocational training has gained more popularity among young people because it enhances employment opportunities [as well as] [job security] upon completion. Furthermore, if everyone could get admitted to college, it would lead to imbalances in the workforce that [would greatly damage] the economic structure of a country. This is because [there is little chance that] university graduates would choose [blue-collar jobs] such as working in factories over the jobs that they are qualified for.\nSecondly, I think that it is impossible to [provide] almost all young people with access to tertiary education. In Vietnam, [the demand for] entering college never ceases to grow. This puts the government in a dilemma of whether they should [risk allocating their resources] and [possibly face a financial predicament] due to [exorbitant education costs] in many financially independent universities, such as the National Economics University. Furthermore, it is simply [unrealistic] for universities to accommodate such a sudden increase in the number of students on [campus], not to mention the fact that most departments are currently [short-staffed].\nIn conclusion, I strongly oppose the idea of dispensing university education to a high proportion of young people owing to the arguments presented above."}, "build": [{"vi": "Một số người cho rằng việc cung cấp giáo dục đại học cho đa số người trẻ là không thể và không hữu ích.", "s": "Some people might argue | that providing tertiary education | for the majority | of young people is not possible | and not useful."}, {"vi": "Cá nhân tôi đồng ý với những ý kiến này và sẽ trình bày lý do của mình trong bài viết dưới đây.", "s": "Personally, I agree | with these ideas | and will outline | my reasons in | the essay below."}, {"vi": "Thứ nhất, việc có bằng đại học không còn đóng vai trò quan trọng trong tương lai của người trẻ, ngay cả trong xã hội đề cao kiến thức này.", "s": "Firstly, having a university degree no longer plays a vital role | in the future | of young people, | even in this knowledge-based society."}, {"vi": "Ở nhiều quốc gia, đặc biệt là Đức, đào tạo nghề đã trở nên phổ biến hơn trong giới trẻ vì nó nâng cao cơ hội việc làm cũng như sự đảm bảo việc làm sau khi hoàn thành.", "s": "In many countries, especially Germany, | vocational training has gained more popularity among young people | because it enhances employment opportunities | as well | as job security upon completion."}, {"vi": "Hơn nữa, nếu tất cả mọi người đều được nhận vào đại học, điều đó sẽ dẫn đến sự mất cân bằng trong nơi làm việc và sẽ gây tổn hại lớn đến cấu trúc kinh tế của một quốc gia.", "s": "Furthermore, if everyone could get admitted | to college, it would lead | to imbalances in the workforce | that would greatly damage the economic structure | of a country."}, {"vi": "Thứ hai, tôi cho rằng không thể cung cấp cho hầu hết tất cả người trẻ khả năng tiếp cận giáo dục đại học.", "s": "Secondly, I think | that it is impossible | to provide almost all young people | with access | to tertiary education."}], "ready": true, "test": [{"t": "mc", "q": "“Workplace (n)” nghĩa là:", "o": ["Nơi làm việc", "Tình thế tiến thoái lưỡng nan", "Chi phí giáo dục quá cao"], "why": ""}, {"t": "mc", "q": "“Job security” nghĩa là:", "o": ["Sự đảm bảo việc làm", "Nâng cao cơ hội việc làm", "Tình huống khó khăn"], "why": ""}, {"t": "mc", "q": "“Be qualified for” nghĩa là:", "o": ["Đủ tiêu chuẩn cho", "Thiếu nhân sự", "Các trường đại học tự chủ tài chính"], "why": ""}, {"t": "mc", "q": "“There is little chance that …” nghĩa là:", "o": ["Có rất ít khả năng …", "Được nhận vào (trường)", "Chuyên ngành"], "why": ""}, {"t": "mc", "q": "“Not to mention the fact that …” nghĩa là:", "o": ["Chưa kể đến việc …", "Chi tiêu / Phân phát", "Thu được lợi từ"], "why": ""}, {"t": "mc", "q": "“Risk allocating their resources” nghĩa là:", "o": ["Mạo hiểm phân bổ nguồn lực của họ", "Cấu trúc kinh tế", "Nâng cao cơ hội việc làm"], "why": ""}, {"t": "fill", "q": "In many countries, especially Germany, ___ has gained more popularity among young people because it enhances employment opportunities as well as job security upon completion. (Ở nhiều quốc gia, đặc biệt là Đức, đào tạo nghề đã trở nên phổ biến hơn trong giới trẻ vì nó nâng cao cơ hội việc làm cũng như sự đảm bảo việc làm sau khi hoàn thành.)", "a": ["vocational training"], "why": ""}, {"t": "fill", "q": "This is because there is little chance that university graduates would choose ___ such as working in factories over the jobs that they are qualified for. (Điều này là vì có rất ít khả năng rằng sinh viên tốt nghiệp đại học sẽ chọn công việc lao động chân tay như làm việc trong nhà máy hơn là các công việc mà họ đủ tiêu chuẩn.)", "a": ["blue-collar jobs"], "why": ""}, {"t": "fill", "q": "In Vietnam, the demand for entering college never ceases to grow. This puts the government in a dilemma of whether they should risk allocating their resources and ___ due to exorbitant education costs in many financially independent universities, such as the National Economics University. (Ở Việt Nam, nhu cầu vào đại học không ngừng tăng lên. Điều này đặt chính phủ vào tình thế tiến thoái lưỡng nan về việc có nên mạo hiểm phân bổ nguồn lực và có thể đối mặt với khó khăn tài chính do chi phí giáo dục quá cao ở nhiều trường đại học tự chủ tài chính hay không.)", "a": ["possibly face a financial predicament"], "why": ""}, {"t": "fill", "q": "Secondly, I think that it is impossible to provide almost all young people with ___. (Thứ hai, tôi cho rằng không thể cung cấp cho hầu hết tất cả người trẻ khả năng tiếp cận giáo dục đại học.)", "a": ["access to tertiary education"], "why": ""}]}, {"id": "t2-u1-qualifications", "code": "Unit 1 · Đề 2", "kind": "Lý do + Tích cực / Tiêu cực", "title": "Qualifications vs life experience", "vi": "Bằng cấp hay kinh nghiệm sống khi tuyển dụng", "vocab": [{"w": "formal academic qualifications", "vi": "bằng cấp học thuật chính quy", "spell": false}, {"w": "hands-on experience", "vi": "kinh nghiệm thực tế"}, {"w": "life experience", "vi": "kinh nghiệm sống"}, {"w": "personal qualities", "vi": "phẩm chất cá nhân"}, {"w": "underlying reasons", "vi": "những lý do sâu xa"}, {"w": "job recruiter", "vi": "nhà tuyển dụng"}, {"w": "recruitment process", "vi": "quá trình tuyển dụng"}, {"w": "job hunter", "vi": "người tìm việc"}, {"w": "be the top priority of", "vi": "là ưu tiên hàng đầu của"}, {"w": "acquire a great deal of knowledge", "vi": "tiếp thu rất nhiều kiến thức", "spell": false}, {"w": "carry out experiments", "vi": "tiến hành thí nghiệm"}, {"w": "a great way to save time", "vi": "một cách hay để tiết kiệm thời gian"}, {"w": "be capable of", "vi": "có khả năng"}, {"w": "assigned tasks", "vi": "nhiệm vụ được giao"}, {"w": "be attributable to", "vi": "là do, có thể quy cho"}], "trans": [{"vi": "Trong xã hội ngày càng cạnh tranh này, một số nhà tuyển dụng cho rằng bằng đại học quan trọng hơn kinh nghiệm thực tế khi họ tìm ứng viên mới.", "en": ["In this increasingly competitive society, academic university degrees are considered to be more essential than hands-on experience by some employers when they seek new candidates.", "In this increasingly competitive society, some employers consider academic university degrees to be more essential than hands-on experience when they seek new candidates."]}, {"vi": "Ở nhiều ngành nghề, bằng cấp học thuật chính quy dường như là ưu tiên hàng đầu của nhiều nhà tuyển dụng khi chọn ứng viên mới.", "en": ["In many professions, formal academic degrees seem to be the top priority of many employers when selecting new applicants."]}, {"vi": "Để trở thành bác sĩ, ứng viên phải tiếp thu rất nhiều kiến thức y khoa ở trường đại học.", "en": ["In order to become a doctor, a candidate has to acquire a great deal of medical knowledge at university.", "To become a doctor, a candidate has to acquire a great deal of medical knowledge at university."]}, {"vi": "Xu hướng này có thể là một cách hay để tiết kiệm thời gian cho nhà tuyển dụng.", "en": ["This trend might be a great way to save time for employee recruiters.", "This trend might be a great way to save time for recruiters."]}, {"vi": "Sau một thời gian dài làm việc trong môi trường thực tế, con người cũng có khả năng làm hầu hết các nhiệm vụ được giao.", "en": ["After a long time of working in a real work environment, people are also capable of doing most assigned tasks."]}, {"vi": "Tóm lại, xu hướng này xuất phát từ hai lý do chính, và tôi tin rằng đây là một bước tiến tiêu cực.", "en": ["In conclusion, this trend is attributable to two main reasons, and I believe that this is a negative progress.", "In conclusion, this trend is attributable to two main reasons, and I believe that this is a negative development."]}], "outline": [{"h": "Mở bài", "pts": ["Diễn đạt lại đề: nhà tuyển dụng coi trọng bằng đại học hơn kinh nghiệm thực tế", "Nêu quan điểm: có lý do, nhưng đây là xu hướng **tiêu cực**"]}, {"h": "Thân bài 1 – Lý do", "pts": ["Nhiều nghề bắt buộc bằng cấp (bác sĩ phải học kiến thức y khoa, làm thí nghiệm)", "Tiết kiệm thời gian đào tạo cho nhà tuyển dụng"]}, {"h": "Thân bài 2 – Vì sao tiêu cực", "pts": ["Nhiều người đi làm ngay sau khi ra trường để có kỹ năng sống và kinh nghiệm thực tế", "Làm việc lâu năm vẫn làm tốt công việc dù không có bằng cấp", "Ví dụ: Steve Jobs thành công mà không có bằng cấp chính quy"]}, {"h": "Kết bài", "pts": ["Tóm tắt: xu hướng có 2 lý do chính và là xu hướng tiêu cực"]}], "prompt": "Nowadays, some employers think that formal academic qualifications are more important than life experience or personal qualities when they look for new employees. Why is it the case? Is it a positive or negative development?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["In this increasingly competitive society, academic university degrees are considered to be more essential than hands-on experience by some employers when they seek new candidates. Although there are some underlying reasons for this, I still believe that this is completely a negative movement.", "There are two factors to explain why some job recruiters prefer university qualifications to life experience when recruiting new employees. Firstly, in many professions, formal academic degrees seem to be the top priority of many employers when selecting new applicants. In order to become a doctor, for example, a candidate has to acquire a great deal of medical knowledge at university as well as spend a lot of time practicing and carrying out experiments. Secondly, this trend might be a great way to save time for employee recruiters. Compared to formal academic candidates who are likely ready to start working, employers may have to spend time training non-academic applicants how to work properly. Therefore, this saved time can be used in other valuable ways.", "However, I think that this is a negative development and both academic and non-academic job hunters should receive equal chance in the recruitment process. This is because many people decide to work right after school instead of starting tertiary education in order to gain life skills and practical experience. On top of that, after a long time of working in a real work environment, people are also capable of doing most assigned tasks without a formal academic education. The typical example can be seen in the case of Steve Jobs, a founder of Apple, who was the most successful person in the technology industry without holding any formal education in this field.", "In conclusion, this trend is attributable to two main reasons, and I believe that this is a negative progress for the above-mentioned arguments."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "In this increasingly competitive society, academic university degrees are considered to be more essential than [hands-on experience] by some employers when they seek new candidates. Although there are some [underlying reasons] for this, I still believe that this is completely a negative movement.\nThere are two factors to explain why some job recruiters prefer university qualifications to [life experience] when recruiting new employees. Firstly, in many professions, formal academic degrees seem to [be the top priority of] many employers when selecting new applicants. In order to become a doctor, for example, a candidate has to acquire a great deal of medical knowledge at university as well as spend a lot of time practicing and carrying out experiments. Secondly, this trend might be a great way to save time for employee recruiters. Compared to formal academic candidates who are likely ready to start working, employers may have to spend time training non-academic applicants how to work properly. Therefore, this saved time can be used in other valuable ways.\nHowever, I think that this is a negative development and both academic and non-academic job hunters should receive equal chance in the [recruitment process]. This is because many people decide to work right after school instead of starting tertiary education in order to gain life skills and practical experience. On top of that, after a long time of working in a real work environment, people are also capable of doing most [assigned tasks] without a formal academic education. The typical example can be seen in the case of Steve Jobs, a founder of Apple, who was the most successful person in the technology industry without holding any formal education in this field.\nIn conclusion, this trend is attributable to two main reasons, and I believe that this is a negative progress for the above-mentioned arguments."}, "build": [{"vi": "Trong xã hội ngày càng cạnh tranh này, một số nhà tuyển dụng cho rằng bằng đại học quan trọng hơn kinh nghiệm thực tế khi họ tìm ứng viên mới.", "s": "In this increasingly competitive society, | academic university degrees are considered | to be more essential | than hands-on experience by some employers | when they seek new candidates."}, {"vi": "Ở nhiều ngành nghề, bằng cấp học thuật chính quy dường như là ưu tiên hàng đầu của nhiều nhà tuyển dụng khi chọn ứng viên mới.", "s": "In many professions, | formal academic degrees seem | to be the top priority | of many employers | when selecting new applicants."}, {"vi": "Để trở thành bác sĩ, ứng viên phải tiếp thu rất nhiều kiến thức y khoa ở trường đại học.", "s": "In order | to become a doctor, a candidate has | to acquire a great deal | of medical knowledge | at university."}, {"vi": "Xu hướng này có thể là một cách hay để tiết kiệm thời gian cho nhà tuyển dụng.", "s": "This trend might | be a great | way to save time | for employee recruiters."}, {"vi": "Sau một thời gian dài làm việc trong môi trường thực tế, con người cũng có khả năng làm hầu hết các nhiệm vụ được giao.", "s": "After a long time | of working | in a real work environment, | people are also capable | of doing most assigned tasks."}, {"vi": "Tóm lại, xu hướng này xuất phát từ hai lý do chính, và tôi tin rằng đây là một bước tiến tiêu cực.", "s": "In conclusion, | this trend is attributable | to two main reasons, | and I believe | that this is a negative progress."}], "ready": true, "test": [{"t": "mc", "q": "“be capable of” nghĩa là:", "o": ["có khả năng", "phẩm chất cá nhân", "kinh nghiệm thực tế"], "why": ""}, {"t": "mc", "q": "“hands-on experience” nghĩa là:", "o": ["kinh nghiệm thực tế", "một cách hay để tiết kiệm thời gian", "phẩm chất cá nhân"], "why": ""}, {"t": "mc", "q": "“job hunter” nghĩa là:", "o": ["người tìm việc", "nhiệm vụ được giao", "tiến hành thí nghiệm"], "why": ""}, {"t": "mc", "q": "“acquire a great deal of knowledge” nghĩa là:", "o": ["tiếp thu rất nhiều kiến thức", "một cách hay để tiết kiệm thời gian", "những lý do sâu xa"], "why": ""}, {"t": "mc", "q": "“assigned tasks” nghĩa là:", "o": ["nhiệm vụ được giao", "là do, có thể quy cho", "tiến hành thí nghiệm"], "why": ""}, {"t": "mc", "q": "“formal academic qualifications” nghĩa là:", "o": ["bằng cấp học thuật chính quy", "nhiệm vụ được giao", "tiến hành thí nghiệm"], "why": ""}, {"t": "fill", "q": "After a long time of working in a real work environment, people are also capable of doing most ___. (Sau một thời gian dài làm việc trong môi trường thực tế, con người cũng có khả năng làm hầu hết các nhiệm vụ được giao.)", "a": ["assigned tasks"], "why": ""}, {"t": "fill", "q": "In this increasingly competitive society, academic university degrees are considered to be more essential than ___ by some employers when they seek new candidates. (Trong xã hội ngày càng cạnh tranh này, một số nhà tuyển dụng cho rằng bằng đại học quan trọng hơn kinh nghiệm thực tế khi họ tìm ứng viên mới.)", "a": ["hands-on experience"], "why": ""}, {"t": "fill", "q": "In many professions, formal academic degrees seem to ___ many employers when selecting new applicants. (Ở nhiều ngành nghề, bằng cấp học thuật chính quy dường như là ưu tiên hàng đầu của nhiều nhà tuyển dụng khi chọn ứng viên mới.)", "a": ["be the top priority of"], "why": ""}, {"t": "fill", "q": "This trend might be ___ for employee recruiters. (Xu hướng này có thể là một cách hay để tiết kiệm thời gian cho nhà tuyển dụng.)", "a": ["a great way to save time"], "why": ""}]}, {"id": "t2-u1-highest-marks", "code": "Unit 1 · Đề 3", "kind": "Discuss both views", "title": "University places: highest marks or everyone?", "vi": "Đại học chỉ nhận học sinh điểm cao hay nhận mọi người", "vocab": [{"w": "the acquisition of knowledge", "vi": "việc tiếp thu kiến thức"}, {"w": "access to tertiary education", "vi": "cơ hội tiếp cận giáo dục sau phổ thông"}, {"w": "a life-changing opportunity", "vi": "cơ hội thay đổi cuộc đời"}, {"w": "equal educational opportunities", "vi": "cơ hội giáo dục bình đẳng", "spell": false}, {"w": "superior academic skills", "vi": "kỹ năng học thuật vượt trội"}, {"w": "logical thinking", "vi": "tư duy logic"}, {"w": "time management skills", "vi": "kỹ năng quản lý thời gian"}, {"w": "the immense workload", "vi": "khối lượng công việc khổng lồ"}, {"w": "prestigious colleges", "vi": "các trường đại học danh tiếng"}, {"w": "the national university entrance exam", "vi": "kỳ thi tuyển sinh đại học quốc gia", "spell": false}, {"w": "academically gifted students", "vi": "học sinh có năng khiếu học tập"}, {"w": "unethical", "vi": "trái đạo đức, không công bằng", "pos": "adj"}, {"w": "a diverse community", "vi": "một cộng đồng đa dạng"}, {"w": "in the long run", "vi": "về lâu dài"}], "trans": [{"vi": "Trong xã hội ngày nay, nơi việc tiếp thu kiến thức là chìa khoá cho triển vọng nghề nghiệp tốt hơn, được tiếp cận giáo dục đại học là một cơ hội thay đổi cuộc đời đối với nhiều học sinh.", "en": ["In today's society, where the acquisition of knowledge is the key to better career prospects, having access to tertiary education is a life-changing opportunity for many students."]}, {"vi": "Những học sinh này có nhiều khả năng xử lý được khối lượng công việc và áp lực khổng lồ ở đại học hơn.", "en": ["Such students are more likely to handle the immense workload and pressure at university.", "These students are more likely to handle the immense workload and pressure at university."]}, {"vi": "Chỉ dành chỗ học đại học cho một số lượng hạn chế học sinh sẽ tạo ra những sinh viên chất lượng cao.", "en": ["Offering university places to only a limited number of students would result in high-quality undergraduates."]}, {"vi": "Tuổi tác hay thành tích ở trường của một học sinh không phải lúc nào cũng phản ánh khả năng thành công ở đại học của họ.", "en": ["A student's age or performance at school does not always reflect their potential to succeed at university."]}, {"vi": "Điều này giúp duy trì một cộng đồng đa dạng.", "en": ["This helps to maintain a diverse community."]}, {"vi": "Tôi tin rằng dành chỗ học đại học cho tất cả học sinh là công bằng và có lợi hơn về lâu dài.", "en": ["I believe providing university places for all students is more just and beneficial in the long run.", "I believe that providing university places for all students is more just and beneficial in the long run."]}], "outline": [{"h": "Mở bài", "pts": ["Tiếp cận đại học là cơ hội thay đổi cuộc đời", "Hai quan điểm: chỉ nhận học sinh điểm cao / nhận mọi người → sẽ bàn cả hai và nêu ý kiến"]}, {"h": "Thân bài 1 – Chỉ nhận học sinh điểm cao", "pts": ["Điểm cao = kỹ năng học thuật tốt → chịu được khối lượng học và áp lực", "Chọn ít sinh viên → sinh viên chất lượng cao (ví dụ các trường danh tiếng ở Việt Nam)"]}, {"h": "Thân bài 2 – Nhận mọi người (ý kiến của tôi)", "pts": ["Tuổi và điểm số không phản ánh hết tiềm năng → từ chối là không công bằng", "Tuyển sinh không chỉ dựa vào học lực: Harvard, Yale nhận cả người giỏi thể thao, nghệ thuật → cộng đồng đa dạng"]}, {"h": "Kết bài", "pts": ["Nhận học sinh điểm cao có lợi ở vài mặt, nhưng nhận tất cả công bằng và có lợi hơn về lâu dài"]}], "prompt": "Many people say that universities should only offer places to young students with the highest marks, while others say they should accept people of all ages, even if they did not do well at school. Discuss both views and give your own opinion.\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["In today's society, where the acquisition of knowledge is the key to better career prospects, having access to tertiary education is a life-changing opportunity for many students. However, some claim universities should only accept young students with the highest grades, while others believe every student, regardless of age and academic ability, should be given equal educational opportunities. I will discuss both views and state my opinion in the following essay.", "Firstly, high school students with higher grades are more deserved to attend university as their grades somewhat imply that they have superior academic skills compared to their peers, be it better memory, logical thinking or time management skills. Therefore, such students are more likely to handle the immense workload and pressure at university. Moreover, offering university places to only a limited number of students would result in high-quality undergraduates. For example, most prestigious colleges in Vietnam, whose acceptance rates are low, only recruit the highest scorers in the national university entrance exam to make sure that all of the universities resources are available for students who have a higher chance of success.", "As sensible and beneficial as it is, many people oppose the aforementioned idea since they believe that only accepting young academically-gifted individuals is unfair to older students or those who do not do well at school. Firstly, a student's age or performance at school does not always reflect their potential to succeed at university. Thus, it is unethical to deny access to tertiary education to some students, especially in a world where formal qualifications are of great importance in gaining employment. Also, there is more to college admissions than just academic performance. In fact, many well-known universities in America, like Harvard or Yale, not only accept academically gifted students but also those who are particularly gifted in sport or art. This helps to maintain a diverse community, where each student is valued and rewarded for what they are good at instead of just academic excellence.", "In conclusion, although only accepting students with high marks is advantageous in some ways, I believe providing university places for all students is more just and beneficial in the long run."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "In today's society, where [the acquisition of knowledge] is the key to better career prospects, having [access to tertiary education] is [a life-changing opportunity] for many students. However, some claim universities should only accept young students with the highest grades, while others believe every student, regardless of age and academic ability, should be given [equal educational opportunities]. I will discuss both views and state my opinion in the following essay.\nFirstly, high school students with higher grades are more deserved to attend university as their grades somewhat imply that they have [superior academic skills] compared to their peers, be it better memory, [logical thinking] or [time management skills]. Therefore, such students are more likely to handle [the immense workload] and pressure at university. Moreover, offering university places to only a limited number of students would result in high-quality undergraduates. For example, most [prestigious colleges] in Vietnam, whose acceptance rates are low, only recruit the highest scorers in [the national university entrance exam] to make sure that all of the universities resources are available for students who have a higher chance of success.\nAs sensible and beneficial as it is, many people oppose the aforementioned idea since they believe that only accepting young academically-gifted individuals is unfair to older students or those who do not do well at school. Firstly, a student's age or performance at school does not always reflect their potential to succeed at university. Thus, it is [unethical] to deny access to tertiary education to some students, especially in a world where formal qualifications are of great importance in gaining employment. Also, there is more to college admissions than just academic performance. In fact, many well-known universities in America, like Harvard or Yale, not only accept [academically gifted students] but also those who are particularly gifted in sport or art. This helps to maintain [a diverse community], where each student is valued and rewarded for what they are good at instead of just academic excellence.\nIn conclusion, although only accepting students with high marks is advantageous in some ways, I believe providing university places for all students is more just and beneficial [in the long run]."}, "build": [{"vi": "Những học sinh này có nhiều khả năng xử lý được khối lượng công việc và áp lực khổng lồ ở đại học hơn.", "s": "Such students are | more likely to | handle the | immense workload and | pressure at university."}, {"vi": "Chỉ dành chỗ họ  ["Those courses allow students to have a flexible learning schedule.", "These courses allow students to have a flexible learning schedule."]}, {"vi": "Sinh viên có thể tiếp cận một lượng tài liệu không giới hạn trên Internet, phần lớn trong số đó là miễn phí.", "en": ["Students can have access to an unlimited amount of resources on the Internet, the majority of which are free of charge.", "Students can have access to an unlimited amount of resources on the Internet, most of which are free of charge."]}, {"vi": "Những khoá học này không mang lại cho người học sự tương tác trực tiếp.", "en": ["These courses do not offer learners face-to-face interaction."]}, {"vi": "Không có sự hỗ trợ từ bạn học, kết quả học tập của sinh viên có thể bị ảnh hưởng theo hướng không mong muốn.", "en": ["Without peer support, students' learning outcomes might be affected in an undesirable way.", "Without peer support, students' learning outcomes may be affected in an undesirable way."]}, {"vi": "Sinh viên có xu hướng mất tập trung trong các buổi học trực tuyến.", "en": ["Students may tend to lose focus during online lessons.", "Students tend to lose focus during online lessons."]}], "outline": [{"h": "Mở bài", "pts": ["Học trực tuyến đã phổ biến ở đại học", "Nêu quan điểm: có cả mặt **tích cực** và **tiêu cực**"]}, {"h": "Thân bài 1 – Tích cực", "pts": ["Lịch học linh hoạt, có lợi cho sinh viên ở xa trường", "Nguồn tài liệu không giới hạn, phần lớn miễn phí → tăng khả năng tự học"]}, {"h": "Thân bài 2 – Tiêu cực", "pts": ["Không có tương tác trực tiếp và thảo luận với bạn học → kết quả học tập giảm", "Cần nhiều kỷ luật, Internet nhiều thứ gây xao nhãng → dễ trì hoãn, mất tập trung"]}, {"h": "Kết bài", "pts": ["Khoá học trực tuyến có nhiều lợi ích nhưng cần lưu ý mặt hạn chế về kết quả học tập"]}], "prompt": "Some universities offer online courses as an alternative to classes delivered on campus. Do you think this is a positive or negative development?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["Online learning has become a common feature of university education for some time. In my opinion, this has both positive and negative impacts on students' learning outcomes.", "On the one hand, offering online courses at universities can be beneficial in several ways. Firstly, those courses allow students to have a flexible learning schedule because they are able to attend lessons at a particular time and place that they find most suitable. This is particularly advantageous for students who live far away from campus. Secondly, students can have access to an unlimited amount of resources on the Internet, the majority of which are free of charge. This can facilitate their learning process and improve their independent learning skills.", "On the other hand, online courses are a poor substitute for traditional classes delivered at universities. These courses do not offer learners face-to-face interaction, which is still important to their understanding of the lessons. In addition, this type of learning does not allow discussions between classmates either, and without peer support, students' learning outcomes might be affected in an undesirable way. Furthermore, as a lot of self-discipline is required and there are so many distractions from the Internet while studying from an online website, students are more likely to procrastinate. This also contributes to lower results, as students may tend to lose focus during online lessons.", "In conclusion, having online courses available to choose from while at university benefits students in a number of ways. However, their drawbacks in terms of decreased learning outcomes should be accounted for."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "[Online learning] has become a common feature of university education for some time. In my opinion, this has both positive and negative impacts on students' [learning outcomes].\nOn the one hand, offering [online courses] at universities can be beneficial in several ways. Firstly, those courses allow students to have a [flexible] learning schedule because they are able to attend lessons at a particular time and place that they find most suitable. This is particularly advantageous for students who live far away from campus. Secondly, students can have access to an unlimited amount of resources on the Internet, the majority of which are free of charge. This can facilitate their learning process and improve their independent learning skills.\nOn the other hand, online courses are a poor substitute for traditional classes delivered at universities. These courses do not offer learners [face-to-face interaction], which is still important to their understanding of the lessons. In addition, this type of learning does not allow discussions between classmates either, and without [peer support], students' learning outcomes might be affected in an undesirable way. Furthermore, as a lot of [self-discipline] is required and there are so many distractions from the Internet while studying from an online website, students are more likely to procrastinate. This also contributes to lower results, as students may tend to lose focus during online lessons.\nIn conclusion, having online courses available to choose from while at university benefits students in a number of ways. However, their drawbacks in terms of decreased learning outcomes should be accounted for."}, "build": [{"vi": "Học trực tuyến đã trở thành một đặc điểm phổ biến của giáo dục đại học từ lâu.", "s": "Online learning has | become a common | feature of university education | for some time."}, {"vi": "Những khoá học này cho phép sinh viên có lịch học linh hoạt.", "s": "Those courses | allow students to | have a flexible | learning schedule."}, {"vi": "Sinh viên có thể tiếp cận một lượng tài liệu không giới hạn trên Internet, phần lớn trong số đó là miễn phí.", "s": "Students can have access | to an unlimited amount | of resources on the Internet, | the majority of | which are free of charge."}, {"vi": "Những khoá học này không mang lại cho người học sự tương tác trực tiếp.", "s": "These courses do | not offer | learners face-to-face interaction."}, {"vi": "Không có sự hỗ trợ từ bạn học, kết quả học tập của sinh viên có thể bị ảnh hưởng theo hướng không mong muốn.", "s": "Without peer support, | students' learning outcomes | might be affected in | an undesirable way."}, {"vi": "Sinh viên có xu hướng mất tập trung trong các buổi học trực tuyến.", "s": "Students may | tend to | lose focus during | online lessons."}], "ready": true, "test": [{"t": "mc", "q": "“Variety” nghĩa là:", "o": ["Sự đa dạng", "Mô hình học tập truyền thống", "Phát triển các cách dạy khác nhau"], "why": ""}, {"t": "mc", "q": "“Lack of accreditation” nghĩa là:", "o": ["Thiếu sự công nhận / thiếu bằng cấp chính thức", "Sự trao đổi ý tưởng", "Thảo luận nhóm"], "why": ""}, {"t": "mc", "q": "“Adapt to each student's skill level” nghĩa là:", "o": ["Thích nghi với năng lực của từng học sinh", "Dẫn đến điều gì", "Những nền tảng học trực tuyến"], "why": ""}, {"t": "mc", "q": "“Students' independent learning” nghĩa là:", "o": ["Việc tự học của học sinh", "Chi phí được giảm thiểu", "Sự đa dạng của các khóa học và chương trình học"], "why": ""}, {"t": "mc", "q": "“Internet-based applications” nghĩa là:", "o": ["Các ứng dụng dựa trên Internet", "Sự đa dạng", "Yêu cầu cao về tính tự giác"], "why": ""}, {"t": "mc", "q": "“Pace” nghĩa là:", "o": ["Nhịp độ / Tốc độ", "Thiếu sự công nhận / thiếu bằng cấp chính thức", "Mô hình học tập cá nhân hóa"], "why": ""}, {"t": "fill", "q": "These courses do not offer learners ___. (Những khoá học này không mang lại cho người học sự tương tác trực tiếp.)", "a": ["face-to-face interaction"], "why": ""}, {"t": "fill", "q": "Without peer support, students' ___ might be affected in an undesirable way. (Không có sự hỗ trợ từ bạn học, kết quả học tập của sinh viên có thể bị ảnh hưởng theo hướng không mong muốn.)", "a": ["learning outcomes"], "why": ""}, {"t": "fill", "q": "___ has become a common feature of university education for some time. (Học trực tuyến đã trở thành một đặc điểm phổ biến của giáo dục đại học từ lâu.)", "a": ["Online learning"], "why": ""}, {"t": "fill", "q": "Those courses allow students to have a ___ learning schedule. (Những khoá học này cho phép sinh viên có lịch học linh hoạt.)", "a": ["flexible"], "why": ""}]}, {"id": "t2-u2-schools", "code": "Unit 2 · Đề 2", "kind": "Agree / Disagree", "title": "Are schools still necessary?", "vi": "Trường học có còn cần thiết khi đã có Internet", "vocab": [{"w": "a wealth of information", "vi": "một lượng thông tin phong phú"}, {"w": "affordable", "vi": "giá cả phải chăng", "pos": "adj"}, {"w": "a variety of topic areas", "vi": "nhiều lĩnh vực chủ đề khác nhau"}, {"w": "online courses", "vi": "các khoá học trực tuyến"}, {"w": "flexibly", "vi": "một cách linh hoạt", "pos": "adv"}, {"w": "formal education", "vi": "giáo dục chính quy"}, {"w": "irreplaceable", "vi": "không thể thay thế", "pos": "adj"}, {"w": "teachers' guidance", "vi": "sự hướng dẫn của giáo viên"}, {"w": "peer support", "vi": "sự hỗ trợ từ bạn bè"}, {"w": "intellectual development", "vi": "sự phát triển trí tuệ"}, {"w": "social relationships", "vi": "các mối quan hệ xã hội"}, {"w": "learning outcomes", "vi": "kết quả học tập"}, {"w": "play a vital role", "vi": "đóng vai trò quan trọng"}, {"w": "absurd", "vi": "vô lý", "pos": "adj"}], "trans": [{"vi": "Vì có rất nhiều thông tin trên Internet, học sinh có thể tự học ở nhà hiệu quả như ở trường.", "en": ["Since there is a wealth of information available on the Internet, students can study by themselves at home just as effectively as they do at school.", "Since there is a wealth of information on the Internet, students can study by themselves at home just as effectively as they do at school."]}, {"vi": "Tôi cảm thấy trường học đóng vai trò quan trọng trong xã hội và không thể bị thay thế.", "en": ["I feel that schools play a vital role in our society and cannot be replaced.", "I feel that schools play a vital role in society and cannot be replaced."]}, {"vi": "Trẻ em có thể học được rất nhiều kiến thức về văn hoá, khoa học và nhiều lĩnh vực khác.", "en": ["Children can learn a great deal of knowledge about culture, science, and many other areas.", "Children can learn a great deal of knowledge about culture, science and many other areas."]}, {"vi": "Tôi tin chắc rằng giáo dục chính quy là không thể thay thế trong bất kỳ xã hội nào.", "en": ["My conviction is that formal education is irreplaceable in any society.", "I am convinced that formal education is irreplaceable in any society."]}, {"vi": "Việc thiếu sự hướng dẫn của giáo viên và sự hỗ trợ của bạn bè là một bất lợi rõ ràng.", "en": ["The lack of teachers' guidance and peer support is a clear disadvantage.", "The lack of teachers' guidance and peer support is a clear disadvantage to this form of learning."]}, {"vi": "Những đứa trẻ đi học và kết bạn vừa có thể vui chơi vừa cải thiện kết quả học tập.", "en": ["Children who go to school and establish friendships can both have fun and improve their learning outcomes.", "Children who go to school and make friends can both have fun and improve their learning outcomes."]}], "outline": [{"h": "Mở bài", "pts": ["Diễn đạt lại đề: Internet có nhiều thông tin → có người cho rằng không cần trường học", "Nêu quan điểm: đồng ý học ở nhà được, nhưng trường học **không thể thay thế**"]}, {"h": "Thân bài 1 – Học qua Internet", "pts": ["Nhiều nguồn miễn phí, rẻ: báo trực tuyến, video (National Geographic, YouTube)", "Khoá học trực tuyến → tự chọn môn mình thích"]}, {"h": "Thân bài 2 – Trường học không thể thay thế", "pts": ["Thiếu sự hướng dẫn của giáo viên và hỗ trợ của bạn bè", "Trường học còn mang lại quan hệ xã hội và sự phát triển tinh thần"]}, {"h": "Kết bài", "pts": ["Internet giúp học ở nhà, nhưng cho rằng trường học không cần thiết là vô lý"]}], "prompt": "Schools are no longer necessary because children can get so much information available through the Internet, and they can study just as well at home. To what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["Since there is a wealth of information available on the Internet, students can study by themselves at home just as effectively as they do at school; therefore, some people believe that schools are not needed anymore. In my view, much as I agree that students can study well at home with the help of the Internet, I feel that schools play a vital role in our society and cannot be replaced no matter what.", "There are ways for children to learn from the Internet, most of which are either free or affordable for almost everyone. One great way is through online newspapers and video websites such as National Geographic and YouTube, which offer a variety of topic areas suitable for people of different ages. Children can learn a great deal of knowledge about culture, science, and many other areas that they are taught in school. Also, they can participate in online courses favored by a growing number of youths nowadays. This type of learning is even more advantageous in the sense that children can flexibly choose to study whatever subjects they are interested in.", "That being said, my conviction is that formal education is irreplaceable in any society. It is true that students can acquire knowledge at home very easily with the help of the Internet; however, the lack of teachers' guidance and peer support is a clear disadvantage to this form of learning. These factors are extremely important to a child's intellectual development, which emphasizes the necessity of school environments. Furthermore, knowledge and skills are not the only things to expect from formal education but also social relationships and mental development. Children who go to school and establish friendships can both have fun and improve their learning outcomes.", "In conclusion, the Internet is a good way for young children to study at home, but I think that claiming schools are irrelevant to children's learning because of this is merely absurd."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "Since there is [a wealth of information] available on the Internet, students can study by themselves at home just as effectively as they do at school; therefore, some people believe that schools are not needed anymore. In my view, much as I agree that students can study well at home with the help of the Internet, I feel that schools [play a vital role] in our society and cannot be replaced no matter what.\nThere are ways for children to learn from the Internet, most of which are either free or [affordable] for almost everyone. One great way is through online newspapers and video websites such as National Geographic and YouTube, which offer [a variety of topic areas] suitable for people of different ages. Children can learn a great deal of knowledge about culture, science, and many other areas that they are taught in school. Also, they can participate in [online courses] favored by a growing number of youths nowadays. This type of learning is even more advantageous in the sense that children can [flexibly] choose to study whatever subjects they are interested in.\nThat being said, my conviction is that [formal education] is [irreplaceable] in any society. It is true that students can acquire knowledge at home very easily with the help of the Internet; however, the lack of [teachers' guidance] and [peer support] is a clear disadvantage to this form of learning. These factors are extremely important to a child's [intellectual development], which emphasizes the necessity of school environments. Furthermore, knowledge and skills are not the only things to expect from formal education but also [social relationships] and mental development. Children who go to school and establish friendships can both have fun and improve their [learning outcomes].\nIn conclusion, the Internet is a good way for young children to study at home, but I think that claiming schools are irrelevant to children's learning because of this is merely [absurd]."}, "build": [{"vi": "Vì có rất nhiều thông tin trên Internet, học sinh có thể tự học ở nhà hiệu quả như ở trường.", "s": "Since there is a wealth | of information available on the Internet, | students can study by themselves | at home just as effectively | as they do at school."}, {"vi": "Tôi cảm thấy trường học đóng vai trò quan trọng trong xã hội và không thể bị thay thế.", "s": "I feel that | schools play a | vital role in | our society and | cannot be replaced."}, {"vi": "Trẻ em có thể học được rất nhiều kiến thức về văn hoá, khoa học và nhiều lĩnh vực khác.", "s": "Children can learn a great deal | of knowledge | about culture, | science, and many other areas."}, {"vi": "Tôi tin chắc rằng giáo dục chính quy là không thể thay thế trong bất kỳ xã hội nào.", "s": "My conviction is | that formal education | is irreplaceable | in any society."}, {"vi": "Việc thiếu sự hướng dẫn của giáo viên và sự hỗ trợ của bạn bè là một bất lợi rõ ràng.", "s": "The lack of | teachers' guidance and | peer support is | a clear disadvantage."}, {"vi": "Những đứa trẻ đi học và kết bạn vừa có thể vui chơi vừa cải thiện kết quả học tập.", "s": "Children who go | to school and establish | friendships can both | have fun and improve | their learning outcomes."}], "ready": true, "test": [{"t": "mc", "q": "“formal education” nghĩa là:", "o": ["giáo dục chính quy", "các mối quan hệ xã hội", "đóng vai trò quan trọng"], "why": ""}, {"t": "mc", "q": "“intellectual development” nghĩa là:", "o": ["sự phát triển trí tuệ", "một lượng thông tin phong phú", "các khoá học trực tuyến"], "why": ""}, {"t": "mc", "q": "“a variety of topic areas” nghĩa là:", "o": ["nhiều lĩnh vực chủ đề khác nhau", "một cách linh hoạt", "giá cả phải chăng"], "why": ""}, {"t": "mc", "q": "“online courses” nghĩa là:", "o": ["các khoá học trực tuyến", "một lượng thông tin phong phú", "kết quả học tập"], "why": ""}, {"t": "mc", "q": "“affordable” nghĩa là:", "o": ["giá cả phải chăng", "các khoá học trực tuyến", "vô lý"], "why": ""}, {"t": "mc", "q": "“learning outcomes” nghĩa là:", "o": ["kết quả học tập", "nhiều lĩnh vực chủ đề khác nhau", "các khoá học trực tuyến"], "why": ""}, {"t": "fill", "q": "I feel that schools ___ in our society and cannot be replaced. (Tôi cảm thấy trường học đóng vai trò quan trọng trong xã hội và không thể bị thay thế.)", "a": ["play a vital role"], "why": ""}, {"t": "fill", "q": "The lack of teachers' guidance and ___ is a clear disadvantage. (Việc thiếu sự hướng dẫn của giáo viên và sự hỗ trợ của bạn bè là một bất lợi rõ ràng.)", "a": ["peer support"], "why": ""}, {"t": "fill", "q": "My conviction is that formal education is ___ in any society. (Tôi tin chắc rằng giáo dục chính quy là không thể thay thế trong bất kỳ xã hội nào.)", "a": ["irreplaceable"], "why": ""}, {"t": "fill", "q": "Since there is ___ available on the Internet, students can study by themselves at home just as effectively as they do at school. (Vì có rất nhiều thông tin trên Internet, học sinh có thể tự học ở nhà hiệu quả như ở trường.)", "a": ["a wealth of information"], "why": ""}]}, {"id": "t2-u3-career", "code": "Unit 3 · Đề 1", "kind": "Agree / Disagree", "title": "One career or changing jobs?", "vi": "Theo một nghề từ sớm hay đổi việc thường xuyên", "vocab": [{"w": "career path", "vi": "con đường sự nghiệp"}, {"w": "fulfilment", "vi": "sự thoả mãn, mãn nguyện", "pos": "n"}, {"w": "career satisfaction", "vi": "sự hài lòng với nghề nghiệp"}, {"w": "job satisfaction", "vi": "sự hài lòng với công việc"}, {"w": "switch jobs", "vi": "đổi việc"}, {"w": "pursue a career", "vi": "theo đuổi sự nghiệp"}, {"w": "an extended period of time", "vi": "một khoảng thời gian dài"}, {"w": "financial situation", "vi": "tình hình tài chính"}, {"w": "advance to the top", "vi": "thăng tiến lên vị trí cao nhất"}, {"w": "promotion", "vi": "sự thăng chức", "pos": "n"}, {"w": "overwhelming", "vi": "quá sức, choáng ngợp", "pos": "adj"}, {"w": "real-world experience", "vi": "kinh nghiệm thực tế"}, {"w": "in the long term", "vi": "về lâu dài"}, {"w": "guarantee", "vi": "đảm bảo", "pos": "v"}], "trans": [{"vi": "Theo tôi, sự hài lòng với nghề nghiệp không được quyết định bởi thời điểm một người chọn nghề hay họ theo đuổi nó trong bao lâu.", "en": ["In my opinion, career satisfaction is not determined by when someone chooses a career path or for how long someone pursues it."]}, {"vi": "Bắt đầu sự nghiệp sớm có thể mang lại cho một người tình hình tài chính tốt hơn sau này.", "en": ["Starting a career early can provide someone with a better financial situation later in life."]}, {"vi": "Theo một con đường sự nghiệp trong thời gian dài có thể giúp một người thăng tiến lên vị trí cao nhất trong lĩnh vực của mình.", "en": ["Remaining on a particular career path for a long period of time may allow someone to advance to the top of their chosen field."]}, {"vi": "Tính cách của một số người không phù hợp với việc làm một công việc trong thời gian dài.", "en": ["Some people's personalities are not suitable for staying in a particular job for long periods of time.", "Some people's personalities are not suitable for staying in one job for long periods of time."]}, {"vi": "Việc chọn nghề có thể quá sức đối với người trẻ chưa có nhiều kinh nghiệm thực tế.", "en": ["Choosing a career path can be overwhelming for young people without much real-world experience."]}, {"vi": "Tôi tin rằng chọn nghề sớm và theo nghề đó không đảm bảo sự hài lòng trong công việc sau này.", "en": ["I believe that choosing a career early in life and staying on this career path does not guarantee job satisfaction later in life.", "I believe that choosing a career early and staying on this career path does not guarantee job satisfaction later in life."]}], "outline": [{"h": "Mở bài", "pts": ["Diễn đạt lại đề: chọn nghề sớm và gắn bó thì hài lòng hơn người hay đổi việc", "Nêu quan điểm: sự hài lòng **không** phụ thuộc vào thời điểm chọn nghề hay gắn bó bao lâu"]}, {"h": "Thân bài 1 – Lợi ích của việc gắn bó một nghề", "pts": ["Bắt đầu sớm → tài chính tốt hơn về sau", "Gắn bó lâu → thăng tiến lên vị trí cao nhất"]}, {"h": "Thân bài 2 – Lợi ích của việc đổi việc", "pts": ["Một số tính cách không hợp làm một việc lâu dài", "Người trẻ ít kinh nghiệm → thử nhiều lựa chọn để tìm nghề phù hợp"]}, {"h": "Kết bài", "pts": ["Mỗi người hài lòng vì những điều khác nhau (lương, thăng tiến, danh tiếng, giúp người khác)", "Chọn nghề sớm không đảm bảo sự hài lòng"]}], "prompt": "Some people think that people who choose a job early and keep doing it are more likely to get a satisfying career life than those who frequently change jobs. To what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["It is said that those who pursue and continue with a particular career choice early in life are more likely to experience greater fulfilment with regard to their work than those who tend to switch jobs more regularly. In my opinion, career satisfaction is not determined by when someone chooses a career path or for how long someone pursues it. This essay will outline some important factors believed to be involved.", "Choosing a career early in life and pursuing it for an extended period of time can have many great benefits. For example, starting a career early can provide someone with a better financial situation later in life, and hence greater satisfaction. In addition to this, remaining on a particular career path for a long period of time may allow someone to advance to the top of their chosen field through promotion, which may also lead to greater career fulfilment.", "On the other hand, those who change jobs or career paths more regularly may also experience many benefits. For example, some people's personalities are not suitable for staying in a particular job for long periods of time, and they may need to change career paths more regularly to stay satisfied. In addition, choosing a career path can be overwhelming for young people without much real-world experience, so exploring a range of options early on may help them find a career that suits them better in the long term.", "In conclusion, what one person finds satisfying in their career may differ from what another does. Some may gain job satisfaction from how big their salary is, how far they have advanced within a particular company or field, or how much fame or praise they have earned. Others may be just as content or satisfied in knowing that their chosen career is beneficial towards serving the needs of others. Either way, I believe that choosing a career early in life and staying on this career path does not guarantee job satisfaction later in life."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "It is said that those who pursue and continue with a particular career choice early in life are more likely to experience greater [fulfilment] with regard to their work than those who tend to [switch jobs] more regularly. In my opinion, [career satisfaction] is not determined by when someone chooses a [career path] or for how long someone pursues it. This essay will outline some important factors believed to be involved.\nChoosing a career early in life and pursuing it for [an extended period of time] can have many great benefits. For example, starting a career early can provide someone with a better [financial situation] later in life, and hence greater satisfaction. In addition to this, remaining on a particular career path for a long period of time may allow someone to [advance to the top] of their chosen field through [promotion], which may also lead to greater career fulfilment.\nOn the other hand, those who change jobs or career paths more regularly may also experience many benefits. For example, some people's personalities are not suitable for staying in a particular job for long periods of time, and they may need to change career paths more regularly to stay satisfied. In addition, choosing a career path can be [overwhelming] for young people without much [real-world experience], so exploring a range of options early on may help them find a career that suits them better [in the long term].\nIn conclusion, what one person finds satisfying in their career may differ from what another does. Some may gain [job satisfaction] from how big their salary is, how far they have advanced within a particular company or field, or how much fame or praise they have earned. Others may be just as content or satisfied in knowing that their chosen career is beneficial towards serving the needs of others. Either way, I believe that choosing a career early in life and staying on this career path does not [guarantee] job satisfaction later in life."}, "build": [{"vi": "Theo tôi, sự hài lòng với nghề nghiệp không được quyết định bởi thời điểm một người chọn nghề hay họ theo đuổi nó trong bao lâu.", "s": "In my opinion, | career satisfaction is not determined by | when someone chooses a career path or | for how long someone pursues it."}, {"vi": "Bắt đầu sự nghiệp sớm có thể mang lại cho một người tình hình tài chính tốt hơn sau này.", "s": "Starting a career | early can provide | someone with a | better financial situation | later in life."}, {"vi": "Theo một con đường sự nghiệp trong thời gian dài có thể giúp một người thăng tiến lên vị trí cao nhất trong lĩnh vực của mình.", "s": "Remaining on a particular career path | for a long period | of time may allow someone | to advance to the top | of their chosen field."}, {"vi": "Tính cách của một số người không phù hợp với việc thẳng tăng lên và các bệnh liên quan đến căng thẳng.", "en": ["In the long term, this will lead to an increased level of stress and stress-related illness.", "This, in the long term, will lead to an increased level of stress and stress-related illness."]}, {"vi": "Không có sự giám sát đầy đủ từ cha mẹ, trẻ em có thể dễ dàng đi chệch hướng.", "en": ["Without adequate supervision from parents, children can easily go on the wrong track."]}, {"vi": "Mọi người cần cân nhắc điều gì khiến họ hạnh phúc và sau đó đặt ra thứ tự ưu tiên trong cuộc sống.", "en": ["People need to consider what makes them happy and then set priorities in life.", "People need to consider and see what makes them happy and then set priorities in life."]}, {"vi": "Mọi người nên lên một lịch trình linh hoạt cho cuộc sống của mình.", "en": ["People should plan a flexible schedule for their life.", "People should plan a flexible schedule for their lives."]}], "outline": [{"h": "Mở bài", "pts": ["Hầu hết mọi người không đạt được cân bằng công việc – cuộc sống", "Bài viết bàn về hậu quả và đề xuất giải pháp"]}, {"h": "Thân bài 1 – Vấn đề", "pts": ["Sức khoẻ: bỏ tập thể dục, giải trí → căng thẳng, bệnh liên quan đến stress", "Nuôi dạy con: cha mẹ nghiện việc → ít thời gian chăm con → trẻ dễ đi chệch hướng"]}, {"h": "Thân bài 2 – Giải pháp", "pts": ["Xác định điều làm mình hạnh phúc, đặt thứ tự ưu tiên; về nhà thì \"tắt\" công việc", "Lên lịch linh hoạt: có ngày tập trung công việc, có ngày dành cho sở thích, gia đình"]}, {"h": "Kết bài", "pts": ["Mất cân bằng gây hại cho sức khoẻ và gia đình → cần có biện pháp khắc phục"]}], "prompt": "Nowadays, most people try to balance between work and other part of lives. Unfortunately, not many achieve this balance. What problems does this cause? Can you suggest some solutions to this issue?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "model": ["Nowadays, most people fail to achieve the ideal work-life balance. This essay will discuss some effects and also suggest ways to address this problem.", "This issue is often associated with some unwanted consequences. Firstly, having an unhealthy work-life balance can have a negative effect on people's health since these individuals tend to sacrifice their daily physical activities and recreational activities for work. This, in the long term, will lead to an increased level of stress and stress-related illness. Secondly, work-life imbalance can also give rise to growing problems with parenting. The materialistic society of today drives many parents to become workaholics, which leads them to spend less time taking care of their children. Without adequate supervision from parents, children can easily go on the wrong track.", "Therefore, some practical solutions are suggested to mitigate the problem. One viable step is that people need to consider and see what makes them happy and then set priorities in life. When they come home from work, they must learn to switch the office button off. By doing so, they will have more time to enjoy leisure activities and refresh themselves. Furthermore, people should plan a flexible schedule for their life. For example, some days, they might focus more on work, while others might have more time and energy to pursue their hobbies or relax with their loved ones. This will enable them to enjoy every part of their life.", "In conclusion, work-life imbalance can lead to some harmful impacts on people's health and families, and some steps should be taken into account to mitigate this problem."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "Nowadays, most people fail to achieve the ideal [work-life balance]. This essay will discuss some effects and also suggest ways to address this problem.\nThis issue is often associated with some [unwanted consequences]. Firstly, having an unhealthy work-life balance can have a negative effect on people's health since these individuals tend to [sacrifice] their daily physical activities and [recreational activities] for work. This, in the long term, will lead to an increased level of stress and [stress-related illness]. Secondly, work-life imbalance can also [give rise to] growing problems with parenting. The materialistic society of today drives many parents to become workaholics, which leads them to spend less time taking care of their children. Without [adequate supervision] from parents, children can easily [go on the wrong track].\nTherefore, some practical solutions are suggested to [mitigate] the problem. One [viable] step is that people need to consider and see what makes them happy and then [set priorities] in life. When they come home from work, they must learn to switch the office button off. By doing so, they will have more time to enjoy [leisure activities] and refresh themselves. Furthermore, people should plan a [flexible schedule] for their life. For example, some days, they might focus more on work, while others might have more time and energy to pursue their hobbies or relax with their loved ones. This will enable them to enjoy every part of their life.\nIn conclusion, work-life imbalance can lead to some harmful impacts on people's health and families, and some steps should be taken into account to mitigate this problem."}, "build": [{"vi": "Ngày nay, hầu hết mọi người không đạt được sự cân bằng lý tưởng giữa công việc và cuộc sống.", "s": "Nowadays, most | people fail to | achieve the ideal | work-life balance."}, {"vi": "Mất cân bằng giữa công việc và cuộc sống có thể ảnh hưởng xấu đến sức khoẻ của con người.", "s": "Having an unhealthy | work-life balance can | have a negative effect | on people's health."}, {"vi": "Về lâu dài, điều này sẽ dẫn đến mức độ căng thẳng tăng lên và các bệnh liên quan đến căng thẳng.", "s": "In the long term, | this will lead | to an increased level | of stress | and stress-related illness."}, {"vi": "Không có sự giám sá , "q": "In the long term, this will lead to an increased level of stress and ___. (Về lâu dài, điều này sẽ dẫn đến mức độ căng thẳng tăng lên và các bệnh liên quan đến căng thẳng.)", "a": ["stress-related illness"], "why": ""}]}, {"id": "t2-u4-social-responsibility", "code": "Unit 4 · Đề 1", "kind": "Agree / Disagree", "title": "Business & social responsibility", "vi": "Doanh nghiệp và trách nhiệm xã hội", "vocab": [{"w": "social responsibilities", "vi": "trách nhiệm xã hội"}, {"w": "make a profit", "vi": "tạo ra lợi nhuận"}, {"w": "maximize profit", "vi": "tối đa hoá lợi nhuận"}, {"w": "competitive market", "vi": "thị trường cạnh tranh"}, {"w": "operating costs", "vi": "chi phí vận hành"}, {"w": "economic sector", "vi": "lĩnh vực kinh tế"}, {"w": "pay taxes", "vi": "nộp thuế"}, {"w": "pressing problems", "vi": "những vấn đề cấp bách"}, {"w": "environmental degradation", "vi": "sự suy thoái môi trường"}, {"w": "exhaust emissions", "vi": "khí thải"}, {"w": "rectify", "vi": "khắc phục, sửa chữa", "pos": "v"}, {"w": "job opportunities", "vi": "cơ hội việc làm"}, {"w": "unemployment rates", "vi": "tỷ lệ thất nghiệp"}], "trans": [{"vi": "Một số người tin rằng doanh nghiệp nên đảm nhận trách nhiệm xã hội bên cạnh mục tiêu tạo ra lợi nhuận.", "en": ["Some people believe that businesses should embrace social responsibilities besides their aim to make a profit."]}, {"vi": "Doanh nghiệp cần kiếm tiền để tồn tại trong thị trường cạnh tranh ngày nay.", "en": ["It is important for businesses to make money in order to survive in today's competitive market.", "Businesses need to make money to survive in today's competitive market."]}, {"vi": "Ưu tiên cao nhất của bất kỳ công ty nào là tối đa hoá lợi nhuận.", "en": ["The highest priority of any company is to maximize profit.", "The highest priority of any company is to maximise profit."]}, {"vi": "Khi một công ty tạo ra lợi nhuận, nó sẽ đóng góp vào sự phát triển của xã hội bằng cách nộp thuế.", "en": ["When a company makes a profi  facility costs, but also expand their business. Furthermore, when a company makes a profit, it will contribute to the development of society by paying taxes.", "In addition to making money, businesses, especially large ones, should play a role in helping society to deal with pressing problems. Firstly, the manufacturing of consumer products is a major cause of environmental degradation. Waste and exhaust emissions from industrial factories contribute to increased levels of water and air pollution, which is strong evidence that responsible companies should act to rectify their mistakes. More importantly, in many areas where local people are forced out of employment because of the appearance of large companies, it is reasonable for those companies to provide job opportunities for local people.", "In conclusion, I believe that businesses should be responsible for helping society to solve problems, such as environmental degradation and increased unemployment rates."], "grp": "Đề theo chủ đề (Unit 1 – 4)", "gap": {"title": "Bài mẫu", "text": "Some people believe that businesses should embrace [social responsibilities] besides their aim to [make a profit]. Personally, I entirely agree with this statement.\nIt is important for businesses to make money in order to survive in today's [competitive market]. In fact, the highest priority of any company is to [maximize profit], regardless of the [economic sector] they are working in. This is because they have to not only cover all the company's [operating costs], including staff salaries and facility costs, but also expand their business. Furthermore, when a company makes a profit, it will contribute to the development of society by paying taxes.\nIn addition to making money, businesses, especially large ones, should play a role in helping society to deal with [pressing problems]. Firstly, the manufacturing of consumer products is a major cause of [environmental degradation]. Waste and [exhaust emissions] from industrial factor  if(it.t==='mc')body=`<div class="q">${q.replace(/___/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div><div class="opts">${o.map((x,k)=>`<button class="opt" type="button" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>`;
 else if(it.t==='fill'){let j=0;body=`<div class="qsent">${q.replace(/___/g,()=>{const a=alts(it.a[j]||'')[0]||'';return `<input class="gp" data-j="${j++}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(5,a.length+3)}ch" aria-label="Chỗ trống">`})}</div>`}
 else if(it.t==='fix')body=`<div class="wrong">${q}</div><textarea class="ln" id="ans" spellcheck="false">${esc(it.q)}</textarea>`;
 else body=`<div class="vi">${q}</div>${it.hint?`<div class="hint" style="margin:0">Gợi ý: ${fmt(it.hint)}</div>`:''}<textarea class="ln" id="ans" autocapitalize="sentences" spellcheck="false" placeholder="Viết câu tiếng Anh…"></textarea>`;
 return `<div class="tr"><span class="count">Câu ${n}/${tot}</span><span class="tag2">${TLAB[it.t]}</span>${body}<div class="fb" id="fb"></div><div id="mdl"></div>${it.t!=='mc'?'<div class="row" style="justify-content:flex-start"><button class="btn" type="button" id="ck">Kiểm tra</button></div>':''}</div>`}
function checkItem(it,o){ /* trả về {ok, miss} */
 if(it.t==='fill'){const res=$$('.gp').map(x=>{const j=+x.dataset.j;return alts(it.a[j]).some(a=>nrm(a)===nrm(x.value))});return {ok:res.every(Boolean),res}}
 const v=$('#ans').value;return {ok:it.a.some(k=>nrm(k)===nrm(v)),miss:bestMiss(v,it.a)}}
function runItems(d,step,items,isTest,onDone){const Q=isTest?items.slice():shuffle(items);let i=0,first=0;const log=[];
 const show=()=>{if(i>=Q.length){return done()}
  const it=Q[i];let wrong=0,copy=false;const o=it.t==='mc'?shuffle(it.o.map((t,k)=>({t,ok:k===0}))):null;
  $('#pn').innerHTML=itemHtml(it,i+1,Q.length,o||[]);
  const next=(ok,ans)=>{log.push({it,ok,ans});if(ok&&!wrong)first++;setTimeout(()=>{i++;show()},isTest?0:(it.why?2000:1200))};
  if(it.t==='mc'){$$('.opt').forEach(b=>b.onclick=()=>{const x=o[+b.dataset.k];
    if(isTest){$$('.opt').forEach(z=>z.disabled=true);b.classList.add(x.ok?'ok':'no');if(!x.ok)$$('.opt').forEach(z=>{if(o[+z.dataset.k].ok)z.classList.add('ok')});fb(x.ok?'good':'bad',(x.ok?'Đúng.':'Chưa đúng. Đáp án: <b>'+esc(it.o[0])+'</b>')+(it.why?' '+esc(it.why):''));log.push({it,ok:x.ok,ans:x.t});if(x.ok)first++;setTimeout(()=>{i++;show()},x.ok?900:2200);return}
    if(x.ok){b.classList.add('ok');$$('.opt').forEach(z=>z.disabled=true);fb('good','Đúng rồi! '+esc(it.why||''));next(true)}else{wrong++;b.classList.add('no');shake(b);b.disabled=true;fb('bad','Chưa đúng, em chọn lại nhé.')}});return}
  const inp=$('#ans')||$('.gp');if(inp)inp.focus();
  const ck=()=>{
   if(it.t==='fill'&&$$('.gp').some(x=>!x.value.trim())){fb('bad','Em điền hết các chỗ trống rồi kiểm tra nhé.');return}
   if(it.t!=='fill'&&!$('#ans').value.trim())return;
   const r=checkItem(it,o);
   if(it.t==='fill')$$('.gp').forEach((x,k)=>{x.classList.toggle('ok',r.res[k]);x.classList.toggle('no',!r.res[k]);if(r.res[k])x.readOnly=true});
   if(isTest){$('#ck').disabled=true;const ans=it.t==='fill'?$$('.gp').map(x=>x.value).join(' / '):$('#ans').value;log.push({it,ok:r.ok,ans});if(r.ok)first++;
    fb(r.ok?'good':'bad',r.ok?'Đúng.':'Chưa đúng. Đáp án: <b>'+esc(ansText(it))+'</b>'+(it.why?' – '+esc(it.why):''));if(r.ok&&it.t!=='fill')say(it.a[0]);setTimeout(()=>{i++;show()},r.ok?1100:3200);return}
   if(r.ok){fb('good','Chính xác!'+(it.why?' '+esc(it.why):''));$('#ck').disabled=true;if(it.t!=='fill'){$('#mdl').innerHTML=`<div class="model"><b>Đáp án:</b> ${esc(it.a[0])}</div>`;say(it.a[0])}next(true);return}
   wrong++;shake(inp);
   if(it.t==='fill'){fb('bad',wrong>=3?'Đáp án đúng: <b>'+esc(ansText(it))+'</b> – em gõ lại vào các ô đỏ nhé.':(wrong>=2?'Gợi ý: '+it.a.map((a,k)=>r.res[k]?'✓':'chữ đầu "'+esc(alts(a)[0][0])+'"').join(' · '):'Ô màu đỏ chưa đúng, em sửa lại nhé.'));return}
   if(copy){fb('bad','Em gõ lại đúng câu mẫu bên dưới nhé (chú ý từng từ).');return}
   if(wrong===1)fb('bad',it.t==='rw'?'Chưa đúng. Em kiểm tra lại cách dùng từ trong ngoặc, thì của động từ và chính tả nhé.':it.t==='fix'?'Câu vẫn chưa đúng. Em tìm lỗi sai (thì, giới từ, số ít – số nhiều, dạng từ…) và sửa lại nhé.':'Chưa đúng. Em kiểm tra lại <b>thì, mạo từ (a/an/the), số ít – số nhiều, giới từ</b> và chính tả nhé.');
   else if(wrong===2)fb('bad',`Gần đúng hơn rồi! Câu đúng còn có ${r.miss.length} từ em chưa viết hoặc viết sai:<div class="miss">${r.miss.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`);
   else{copy=true;fb('bad','Em xem câu đúng, nghe đọc, rồi <b>gõ lại</b> vào ô để ghi nhớ nhé.');$('#mdl').innerHTML=`<div class="model"><b>Đáp án:</b> ${esc(it.a[0])}</div>`;say(it.a[0]);$('#ans').value=''}};
  $('#ck').onclick=ck;$$('#ans,.gp').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ck()}}))};
 const done=()=>{
  if(isTest){const pct=Math.round(first/Q.length*100);const wrongs=log.filter(x=>!x.ok);
   report(d,step,first,Q.length,wrongs.map((x,k)=>`Sai: ${x.it.q} → HS: ${x.ans} | Đúng: ${ansText(x.it)}`).join('\n'));
   (onDone||((m,x)=>finish(d,step,m,x)))(`Em đúng <b>${first}/${Q.length}</b> câu (${pct}%). Kết quả đã được gửi cho cô.`,`<ul class="rv">${log.map((x,k)=>`<li class="${x.ok?'ok':'no'}"><b>${k+1}.</b> ${esc(x.it.q)}${x.ok?' ✓':`<br><span class="u">Em: ${esc(x.ans)}</span><br><span class="k">Đáp án: ${esc(ansText(x.it))}</span>`}</li>`).join('')}</ul>`)}
  else{report(d,step,first,Q.length);finish(d,step,`Em làm đúng ngay lần đầu ${first}/${Q.length} câu.`)}};
 show()}
