 $('#ck').onclick=()=>{let ok=0;$$('.gp').forEach(x=>{const j=+x.dataset.j;if(x.classList.contains('ok')){ok++;return}if(nrm(x.value)===nrm(ans[j])){x.classList.remove('no');x.classList.add('ok');x.readOnly=true;ok++}else{x.classList.add('no');if(x.value.trim())shake(x)}});
  if(firstOk===null)firstOk=ok;
  if(ok===ans.length){$('#ck').disabled=true;$('#pl').style.display='';$('#pl').onclick=()=>sayAll(full);report(d,'gap',firstOk,ans.length);const nx=nextOf(d,'gap');fb('good',`Chính xác cả ${ans.length} chỗ trống!${nx?` <a href="#/d/${d.id}/${nx[0]}">Sang ${nx[1]} →</a>`:''}`)}
  else fb('bad',`Đúng ${ok}/${ans.length}. Em sửa các ô màu đỏ rồi bấm Kiểm tra lại nhé.`)};
 $$('.gp').forEach(x=>x.addEventListener('input',()=>x.classList.remove('no')))}
/* ---------- Ghép câu ---------- */
function vBuild(d){const O=d.build;let i=0,first=0;
 const show=()=>{if(i>=O.length){report(d,'build',first,O.length);finish(d,'build',`Em ghép đúng ngay lần đầu ${first}/${O.length} câu.`);return}
  const it=O[i];const ch=it.s.split('|').map(s=>s.trim()).filter(Boolean);const target=ch.join(' ');let pool=ch.map((w,k)=>({w,k}));do{pool=shuffle(pool)}while(ch.length>2&&pool.map(x=>x.w).join(' ')===target);let picked=[],wrong=false;
  const draw=()=>{$('#pn').innerHTML=`<div class="ord"><span class="count">Câu ${i+1}/${O.length}</span><div class="vi-hint" style="font-size:17px;color:var(--blue);font-weight:600">${esc(it.vi)}</div><div class="ans" id="ans">${picked.length?picked.map((p,k)=>`<button class="chip" type="button" data-p="${k}">${esc(p.w)}</button>`).join(''):'<span class="hint" style="margin:0">Chạm vào các cụm từ bên dưới theo đúng thứ tự…</span>'}</div><div class="pool">${pool.map((p,k)=>`<button class="chip" type="button" data-k="${k}">${esc(p.w)}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="row"><button class="btn ghost" type="button" id="rs">Xếp lại</button><button class="btn" type="button" id="ck">Kiểm tra</button></div></div>`;
   $$('[data-k]').forEach(b=>b.onclick=()=>{picked.push(pool.splice(+b.dataset.k,1)[0]);draw()});
   $$('[data-p]').forEach(b=>b.onclick=()=>{pool.push(picked.splice(+b.dataset.p,1)[0]);draw()});
   $('#rs').onclick=()=>{pool=pool.concat(picked);picked=[];draw()};
   $('#ck').onclick=()=>{if(pool.length){fb('bad','Em dùng hết các cụm từ rồi mới kiểm tra nhé.');return}const got=picked.map(p=>p.w).join(' ');if(got===target){if(!wrong)first++;fb('good','Chính xác! '+esc(target));say(target);$('#ck').disabled=true;$('#rs').disabled=true;setTimeout(()=>{i++;show()},2300)}else{wrong=true;fb('bad','Chưa đúng thứ tự. Em chạm vào cụm bị sai để trả lại rồi xếp lại nhé.');shake($('#ans'))}}};
  draw()};
 show()}
/* ---------- Dàn ý ---------- */
function vOutline(d){const P=d.outline;
 const read=()=>{$('#pn').innerHTML=`<p class="hint" style="margin-top:0">Đọc kỹ dàn ý của bài. Sau đó bấm <b>Luyện sắp xếp dàn ý</b> để kiểm tra em đã nhớ chưa.</p>${d.tip?`<div class="lnote"><b>Lưu ý:</b> ${fmt(d.tip)}</div>`:""}<div class="ol">${P.map(p=>`<div class="olp"><b>${esc(p.h)}</b><ul>${p.pts.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" type="button" id="go">Luyện sắp xếp dàn ý</button></div>`;$('#go').onclick=prac};
 const prac=()=>{const items=[];P.forEach((p,pi)=>p.pts.forEach(x=>items.push({x,pi})));let pool=shuffle(items.map((it,k)=>({...it,k})));let picked=[],wrong=false;
  const draw=()=>{$('#pn').innerHTML=`<div class="ord"><p class="hint" style="margin:0">Chạm vào các ý theo đúng thứ tự trong bài (từ Mở bài đến Kết bài).</p><div class="ans para" id="ans">${picked.length?picked.map((p,k)=>`<button class="chip" type="button" data-p="${k}"><small style="color:var(--o);font-weight:800">${k+1}.</small> ${fmt(p.x)}</button>`).join(''):'<span class="hint" style="margin:0">Chưa chọn ý nào…</span>'}</div><div class="pool para" style="display:flex">${pool.map((p,k)=>`<button class="chip" type="button" data-k="${k}">${fmt(p.x)}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="row"><button class="btn ghost" type="button" id="rs">Xếp lại</button><button class="btn ghost" type="button" id="rv">Xem lại dàn ý</button><button class="btn" type="button" id="ck">Kiểm tra</button></div></div>`;
   $$('[data-k]').forEach(b=>b.onclick=()=>{picked.push(pool.splice(+b.dataset.k,1)[0]);draw()});
   $$('[data-p]').forEach(b=>b.onclick=()=>{pool.push(picked.splice(+b.dataset.p,1)[0]);draw()});
   $('#rs').onclick=()=>{pool=shuffle(pool.concat(picked));picked=[];draw()};$('#rv').onclick=read;
   $('#ck').onclick=()=>{if(pool.length){fb('bad','Em xếp hết các ý rồi mới kiểm tra nhé.');return}
    const bad=picked.findIndex((p,k)=>p.pi!==items[k].pi||(p.k!==k&&!(P[p.pi].h.match(/Tổng quan|Overall/i))));
    if(bad<0){report(d,'outline',wrong?0:1,1);finish(d,'outline','Em đã nắm chắc dàn ý của bài. Giờ mình viết bài nhé!')}else{wrong=true;fb('bad',`Ý thứ ${bad+1} chưa đúng vị trí. Em chạm vào để trả lại rồi xếp lại nhé.`);shake($('#ans'))}}};
  draw()};
 read()}
/* ---------- Viết bài ---------- */
let tmr=null;
function vWrite(d){const isT1=secOf(d).k==='task1';const minw=d.minw||(isT1?150:250);const mins=d.mins||(isT1?20:40);const dk='draft_'+d.id;let left=store.get('tleft_'+d.id,mins*60);let running=false;clearInterval(tmr);
 const sent=store.get('sent_'+d.id,null);const V=d.vocab||[];
 $('#pn').innerHTML=`${relHtml(d)}${promptHtml(d)}${d.tip?`<div class="lnote"><b>Lưu ý:</b> ${fmt(d.tip)}</div>`:""}
 <p class="hint" style="margin-top:0">Viết ít nhất <b>${minw} từ</b>, khoảng <b>${mins} phút</b>. Bài được lưu nháp tự động trên máy. Khi xong, bấm <b>Nộp bài cho cô</b>.</p>
 <div class="wbar"><span class="wc" id="wc">0 từ</span><span><span class="tmr" id="tm"></span> <button class="btn ghost" type="button" id="tb" style="min-height:38px;padding:6px 12px">Bấm giờ</button></span></div>
 <textarea class="wr" id="es" spellcheck="false" placeholder="${minw<150?'Viết đoạn văn của em ở đây.':isT1?'Viết bài của em ở đây. Xuống dòng giữa các đoạn (Mở bài – Tổng quan – Thân bài 1 – Thân bài 2).':'Viết bài của em ở đây. Xuống dòng giữa các đoạn (Mở bài – Thân bài 1 – Thân bài 2 – Kết bài).'}"></textarea>
 ${V.length?`<div class="hint">Từ vựng của bài em đã dùng:</div><div class="used" id="used">${V.map((v,k)=>`<span data-u="${k}">${esc(v.w)}</span>`).join('')}</div>`:''}
 <ul class="ck" id="ckl"></ul><div class="fb" id="fb"></div>
 <div class="row" style="justify-content:flex-start"><button class="btn" type="button" id="sb">Nộp bài cho cô</button></div><div id="after"></div>`;
 bindZoom();
 const es=$('#es');es.value=store.get(dk,'');
 const tm=()=>{const m=Math.floor(Math.max(0,left)/60),s=Math.max(0,left)%60;$('#tm').textContent=(left<=0?'Hết giờ · ':'')+m+':'+String(s).padStart(2,'0')};tm();
 $('#tb').onclick=()=>{running=!running;$('#tb').textContent=running?'Tạm dừng':'Bấm giờ';clearInterval(tmr);if(running)tmr=setInterval(()=>{if(!$('#tm')){clearInterval(tmr);return}left--;store.set('tleft_'+d.id,left);tm();if(left===0)fb('bad','Đã hết '+mins+' phút. Em viết nốt câu cuối rồi nộp bài nhé.')},1000)};
 let confirmSend=false;
 const upd=()=>{const t=es.value;const n=wcount(t);store.set(dk,t);const w=$('#wc');w.textContent=n+' / '+minw+' từ';w.className='wc '+(n>=minw?'ok':'low');
  let used=0;V.forEach((v,k)=>{const on=stemOk(t,v.w);if(on)used++;const s=document.querySelector(`[data-u="${k}"]`);if(s)s.classList.toggle('on',on)});
  const paras=t.split(/\n/).filter(p=>wcount(p)>=6).length;const needP=minw<150?1:4;const needV=Math.min(4,V.length);
  $('#ckl').innerHTML=[[n>=minw,`Đủ ${minw} từ (${n})`],[paras>=needP,`Có ít nhất ${needP} đoạn (${paras})`]].concat(V.length?[[used>=needV,`Dùng ít nhất ${needV} từ vựng của bài (${used})`]]:[]).map(x=>`<li class="${x[0]?'ok':'no'}">${x[0]?'✓':'○'} ${x[1]}</li>`).join('');
  confirmSend=false;$('#sb').textContent=store.get('sent_'+d.id,null)?'Nộp lại bài đã sửa':'Nộp bài cho cô';return {n,used}};
 es.addEventListener('input',upd);upd();
 const showAfter=(when)=>{const ps=(d.model||[]);$('#after').innerHTML=`<div class="note" style="margin-top:14px"><b style="color:var(--green)">Đã nộp bài lúc ${esc(when)}.</b> Cô sẽ chấm và nhận xét. Em có thể sửa và nộp lại – cô sẽ nhận bản mới nhất.</div>${ps.length?`<details class="note"><summary>Xem bài mẫu để so sánh</summary><div class="row" style="justify-content:flex-start;margin:8px 0"><button class="btn alt" type="button" id="pall">Nghe cả bài mẫu</button></div><div class="essay">${ps.map((p,k)=>`<div class="pr"><button class="spk" type="button" data-mp="${k}" aria-label="Nghe đoạn">${SPK}</button><p>${esc(p)}</p></div>`).join('')}</div></details>`:''}`;
  if(ps.length){$('#pall').onclick=()=>sayAll(ps);$$('[data-mp]').forEach(b=>b.onclick=()=>say(ps[+b.dataset.mp]))}};
 if(sent)showAfter(sent);
 $('#sb').onclick=()=>{const r=upd();if(r.n<Math.round(minw*0.5)){fb('bad',`Bài mới có ${r.n} từ – em cần viết ít nhất ${Math.round(minw*0.5)} từ mới nộp được.`);shake(es);return}
  if(r.n<minw&&!confirmSend){confirmSend=true;fb('bad',`Bài chưa đủ ${minw} từ (thi thật sẽ bị trừ điểm). Nếu em vẫn muốn nộp, bấm nút thêm 1 lần nữa.`);$('#sb').textContent='Vẫn nộp bài';return}
  report(d,'write',r.used,Math.max(1,V.length),es.value.trim(),r.n);const when=new Date().toLocaleString('vi-VN');store.set('sent_'+d.id,when);
  fb('good','Đã gửi bài cho cô! ✓');confirmSend=false;$('#sb').textContent='Nộp lại bài đã sửa';clearInterval(tmr);running=false;$('#tb').textContent='Bấm giờ';showAfter(when)};
}
/* ---------- điều hướng ---------- */
function route(){stopSay();clearInterval(tmr);setWho();const h=location.hash.replace(/^#\/?/,'').split('/');
 if(h[0]==='s')secView(h[1]);else if(h[0]==='d')deView(h[1],h[2]);else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
