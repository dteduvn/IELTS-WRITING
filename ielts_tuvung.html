<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing · Luyện viết – D&amp;T Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--o:#9F1239;--o2:#E11D48;--ol:#FFF1F3;--navy:#1D3557;--red:#D02F3A;--blue:#2346A8;--green:#1E7B4F;--teal:#0F766E;--ink:#1F2937;--mut:#5B6472;--bg:#FFF8F9;--card:#FFFFFF;--line:#F5D0D8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header.top{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;padding:14px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--o);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:18px;line-height:1.1}.brand small{font-size:13px;opacity:.95}
.who{font-size:14px;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;border:0;color:#fff}
h1{font-size:26px;margin:22px 0 6px;color:var(--navy)}h2{font-size:21px;margin:18px 0 10px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 16px}
.namebox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.namebox label{font-weight:700;width:100%}
.namebox input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--o);color:#fff;min-height:46px}
.btn.alt{background:#fff;color:var(--o);border:2px solid var(--o)}
.btn.ghost{background:transparent;color:var(--mut);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:8px 0 18px}
.bigbtn{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:22px;padding:20px;color:#fff;min-height:130px;text-decoration:none}
.bigbtn b{font-size:22px}.bigbtn span{font-size:14.5px;opacity:.95}
.bigbtn.soon{filter:grayscale(.35);opacity:.75;cursor:default}
.tag{display:inline-block;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;width:max-content}
.prog{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bar{height:14px;background:#F8DDE3;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));border-radius:9px;transition:width .4s}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ucard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px}
.ucard .n{font-size:13px;font-weight:800;color:var(--o);letter-spacing:1px}.ucard b{font-size:17px;color:var(--navy)}.ucard small{color:var(--mut)}
.ucard.lock{opacity:.55;cursor:default}
.ucard .done{margin-top:auto;font-size:13px;font-weight:700;color:var(--green)}
.back{background:none;border:0;color:var(--o);font-weight:700;font-size:15px;padding:12px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 10px;margin:8px 0 6px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;color:var(--mut);min-height:44px}
.tab.on{background:var(--o);border-color:var(--o);color:#fff}.tab .ok{color:var(--green)}.tab.on .ok{color:#fff}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.map img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.hint{font-size:14px;color:var(--mut);margin:8px 0 0}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fc{perspective:900px;height:230px;width:100%;display:block;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.fc .b{transform:rotateY(180deg);background:var(--ol)}
.fc img{width:100%;height:120px;object-fit:contain}
.noimg{font-size:26px;font-weight:800;color:var(--o);min-height:80px;display:flex;align-items:center}.fc .f .w:only-child{font-size:15px}
.fc .w{font-weight:800;font-size:19px;color:var(--red)}.fc .ipa{color:var(--mut);font-size:14px}.fc .vi{color:var(--blue);font-weight:700;font-size:17px}
.spk{border:0;background:var(--o);color:#fff;border-radius:50%;width:46px;height:46px;display:inline-grid;place-items:center;flex:0 0 auto}
.spk svg{width:22px;height:22px}
.ex{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:520px;margin:0 auto}
.ex img{max-width:260px;width:100%;height:170px;object-fit:contain}
.ex .vi{font-size:19px;font-weight:700;color:var(--blue)}
.ex input{font:inherit;font-size:22px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);width:100%;max-width:340px;letter-spacing:1px}
.slots{font-size:22px;letter-spacing:6px;color:var(--mut);font-weight:700}
.count{font-size:14px;color:var(--mut);font-weight:700}
.fb{min-height:28px;font-weight:700;font-size:16px}.fb.good{color:var(--green)}.fb.bad{color:var(--red)}
.shake{animation:sh .35s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-size:15px;min-height:56px;color:var(--ink)}
.mi.sel{border-color:var(--o);background:var(--ol)}.mi.ok{border-color:var(--green);background:#E8F5EE;color:var(--green);cursor:default}.mi.no{border-color:var(--red)}
.q{font-size:19px;font-weight:700;color:var(--navy);margin:4px 0 14px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;text-align:left;min-height:52px;color:var(--ink)}
.opt.no{border-color:var(--red);background:#FFF1F1}.opt.ok{border-color:var(--green);background:#E8F5EE}
.done-box{text-align:center;padding:22px 10px}.done-box .star{font-size:44px;color:var(--o2);font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--mut);font-size:13.5px;padding:20px 16px 30px}
.lf{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.lf .sent{font-size:20px;line-height:1.7;color:var(--navy);font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lf .sent input{font:inherit;font-size:19px;width:160px;max-width:100%;padding:6px 10px;border-radius:10px;border:2px solid var(--o);text-align:center;color:var(--red)}
.tfl{display:flex;flex-direction:column;gap:10px}
.tfi{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tfi span{font-size:16.5px;flex:1 1 260px}
.tfi .tb{display:flex;gap:8px}
.tfb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-weight:700;min-width:86px;min-height:44px;color:var(--ink)}
.tfb.ok{border-color:var(--green);background:#E8F5EE;color:var(--green)}.tfb.no{border-color:var(--red);background:#FFF1F1;color:var(--red)}
.tfi.done{border-color:#BFE3CF;background:#F5FBF7}
.passage{background:var(--ol);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16.5px;line-height:1.65;white-space:pre-line;margin-bottom:14px}
.passage .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;white-space:normal}
.passage .ph b{color:var(--o);font-size:17px}
.listenbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ol);border-radius:16px;padding:14px;margin-bottom:14px;text-align:center}
.spk.lg{width:64px;height:64px}.spk.lg svg{width:30px;height:30px}
.ord{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.ord .ans{min-height:64px;border:2px dashed var(--o);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff}
.ord .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:18px;font-weight:600;min-height:46px;color:var(--navy)}
.ans .chip{background:var(--ol);border-color:var(--o2)}
.vi-hint{font-size:15px;color:var(--mut);text-align:center}
.note{background:var(--ol);border:2px dashed var(--o2);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:1.5}
.note summary{font-weight:700;color:var(--o);cursor:pointer}
.sp{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.qbox{display:flex;align-items:center;gap:10px;justify-content:center;font-size:21px;font-weight:700;color:var(--navy);line-height:1.4}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--o);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.mic svg{width:36px;height:36px}.mic:disabled{opacity:.4}
.mic.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(208,47,58,.55)}100%{box-shadow:0 0 0 20px rgba(208,47,58,0)}}
.said{min-height:22px;color:var(--mut);font-style:italic;font-size:15px}
.steps{text-align:left;margin:0;padding-left:22px;line-height:1.7;font-size:16px}
.timer{width:100%;height:12px;background:var(--line);border-radius:8px;overflow:hidden}.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width 1s linear}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.gapp{font-size:17px;line-height:2.3;white-space:pre-line}
.gapp input.gp{font:inherit;font-weight:700;color:var(--blue);border:0;border-bottom:3px solid var(--o);background:var(--ol);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;min-width:4ch;max-width:100%}
.gapp input.gp.ok{border-color:var(--green);color:var(--green);background:#E8F5EE}.gapp input.gp.no{border-color:var(--red);color:var(--red);background:#FFF1F1}
.para{flex-direction:column;align-items:stretch}.para .chip{text-align:left;font-size:16px}
textarea.wr{width:100%;min-height:230px;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.7;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-top:6px}
textarea.wr:focus{outline:3px solid var(--o2);border-color:var(--o)}
.ck{list-style:none;padding:0;margin:10px 0;font-weight:700;line-height:1.8}.ck .ok{color:var(--green)}.ck .no{color:var(--red)}
@media (max-width:520px){h1{font-size:22px}.match{grid-template-columns:1fr}.fc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fc{height:190px}.fc img{height:90px}.fc .w{font-size:17px}}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vgrid .fc{height:250px}
.fc .pos{font-size:13px;font-weight:700;color:var(--teal);background:#E6F4F1;border-radius:999px;padding:1px 9px}
.fc .exs{font-size:14px;color:var(--ink);font-style:italic;line-height:1.45}
.fc .f .w{font-size:20px}
.prompt{background:#fff;border:2px solid var(--line);border-left:6px solid var(--o);border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.6;white-space:pre-line;margin-bottom:12px}
.prompt .lb{display:block;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--o);margin-bottom:4px}
.pimg{display:block;max-width:100%;margin:10px auto 0;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.tr{display:flex;flex-direction:column;gap:12px;max-width:740px;margin:0 auto}
.tr .vi{font-size:18px;font-weight:700;color:var(--blue);line-height:1.5}
.tr .wrong{font-size:18px;font-weight:600;color:var(--red);line-height:1.5}
textarea.ln{width:100%;min-height:96px;font:inherit;font-size:17px;line-height:1.55;padding:10px 12px;border:2px solid var(--line);border-radius:14px;box-sizing:border-box}
textarea.ln:focus,textarea.wr:focus{outline:3px solid #FBCFE8;border-color:var(--o)}
.model{background:#F5FBF7;border:2px solid #BFE3CF;border-radius:14px;padding:10px 14px;font-size:16.5px;line-height:1.55}
.model b{color:var(--green)}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.miss span{background:#FFF1F1;border:1px solid #F7C6C6;color:var(--red);border-radius:8px;padding:2px 8px;font-weight:700;font-size:15px}
.ol{display:flex;flex-direction:column;gap:12px}
.olp{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.olp>b{color:var(--o);display:block;margin-bottom:4px;font-size:17px}.olp ul{margin:0;padding-left:20px;line-height:1.7}
.tw{overflow-x:auto;margin:8px 0}
table.nt{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
table.nt th{background:var(--ol);color:var(--navy);text-align:left;padding:7px 9px;border:1px solid var(--line)}
table.nt td{padding:7px 9px;border:1px solid var(--line);vertical-align:top}
table.dt{width:auto;min-width:60%;margin:10px auto 0;white-space:normal}table.dt td{text-align:center}table.dt td:first-child{text-align:left;font-weight:700}
.wbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.wc{font-weight:800;font-size:16px}.wc.ok{color:var(--green)}.wc.low{color:var(--red)}
.tmr{font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy);background:var(--ol);border-radius:999px;padding:6px 14px}
.used{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.used span{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:14px;color:var(--mut)}.used span.on{background:#E8F5EE;border-color:#BFE3CF;color:var(--green);font-weight:700}
.essay p{margin:0 0 10px;line-height:1.7;font-size:16.5px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pr .spk{width:38px;height:38px}.pr .spk svg{width:18px;height:18px}
.secb{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--ol);color:var(--o);width:max-content}
.subt{font-weight:800;color:var(--navy);font-size:17px;margin:2px 0 8px}
.chip{font-size:17px}
.grph{font-size:15px;font-weight:800;color:var(--o);letter-spacing:.5px;margin:18px 0 8px;text-transform:uppercase}
.qsent{font-size:19px;font-weight:600;color:var(--navy);line-height:2.1}
.qsent input.gp{font:inherit;font-weight:700;color:var(--blue);border:0;border-bottom:3px solid var(--o);background:var(--ol);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;min-width:5ch}
.qsent input.gp.ok{border-color:var(--green);color:var(--green);background:#E8F5EE}.qsent input.gp.no{border-color:var(--red);color:var(--red);background:#FFF1F1}
.tag2{display:inline-block;font-size:12.5px;font-weight:800;border-radius:8px;padding:2px 8px;background:#EEF2FF;color:var(--blue);margin-bottom:6px}
.rv{list-style:none;padding:0;margin:12px 0 0;text-align:left;display:flex;flex-direction:column;gap:8px}
.rv li{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.5}
.rv li.ok{border-color:#BFE3CF;background:#F5FBF7}.rv li.no{border-color:#F7C6C6;background:#FFF7F7}
.rv .k{color:var(--green);font-weight:700}.rv .u{color:var(--red)}
.lnote{background:#FFFBEB;border:2px dashed #F59E0B;border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0;line-height:1.55}
</style>
</head>

 {"id": "wic-u3", "code": "Unit 3", "kind": "Words in Context", "grp": "Words in Context", "title": "Work", "vi": "Công việc", "ready": true, "note": [{"h": "Cân bằng cuộc sống - công việc có nên là sự ưu tiên của giới trẻ không?", "t": "Chắc hẳn chúng ta đều quá quen thuộc với khái niệm “cân bằng cuộc sống – công việc”, đặc biệt là khi truyền thông đều tập trung vào việc định hướng chúng ta làm sao để achieve work-life balance⁽¹⁾.\nCác trang báo mạng đều tràn ngập những bài viết khuyến khích chúng ta tìm kiếm “công việc mơ ước” với favourable work environment⁽²⁾ và nhiều promotion prospects⁽³⁾. Vấn đề ở đây là liệu rằng chúng ta – những người trẻ mới chân ướt chân ráo ra khỏi môi trường đại học có quyền và khả năng chọn một công việc thỏa mãn tất cả các kỳ vọng của chúng ta hay không?\nThực tế là chúng ta under intense pressure⁽⁴⁾ từ công việc chúng ta làm. Áp lực có thể đến từ heavy workload⁽⁵⁾ hay từ những workplace conflicts⁽⁶⁾ mà chúng ta phải đối mặt hằng ngày. Chính vì vậy, our personal lives⁽⁷⁾ sẽ bị ảnh hưởng rất nhiều nếu chúng ta muốn thực hiện tốt công việc. Như vậy, nếu chúng ta chỉ tìm kiếm những job opportunities⁽⁸⁾ cho phép chúng ta có sự cân bằng giữa cuộc sống cá nhân và công việc, liệu rằng chúng ta có đang tự ảo tưởng quá không?\nTheo nhiều nghiên cứu gần đây, việc nhân viên luôn có kỳ vọng và ưu tiên sự cân bằng cuộc sống – công việc lại chính là nguyên nhân chính dẫn đến việc nhảy việc, và về lâu về dài có thể ảnh hưởng job satisfaction⁽⁹⁾. Trong một buổi phỏng vấn, Jeff Bezos – nhà sáng lập Amazon – đã chỉ ra rằng khi chúng ta đã quyết tâm pursue a career path⁽¹⁰⁾ nào đó, đừng để sự cân bằng cuộc sống cá nhân và công việc trở thành mối tâm hàng đầu của mình, mà hãy tập trung vào việc học hỏi và không ngừng phát triển năng lực bản thân, cho dù điều đó đồng nghĩa với việc phải làm công việc mình không thích."}, {"h": "Từ vựng", "t": "", "tbl": [["Từ / cụm từ", "Loại từ", "Nghĩa"], ["Achieve work-life balance", "v-n-n", "Đạt được sự cân bằng công việc cuộc sống"], ["Favourable work environment", "adj-n-n", "Môi trường làm việc thuận lợi"], ["Promotion prospects", "n-n", "Triển vọng thăng tiến"], ["Under intense pressure", "adj-n", "Phải chịu rất nhiều áp lực"], ["Heavy workload", "adj-n", "Khối lượng công việc khổng lồ"], ["Workplace conflicts", "n-n", "Xung đột nơi làm việc"], ["Our personal lives", "adj-n", "Cuộc sống cá nhân của chúng ta"], ["Job opportunities", "n-n", "Cơ hội nghề nghiệp"], ["Job satisfaction", "n-n", "Sự thỏa mãn công việc"], ["Pursue a career path", "v-n-n", "Theo đuổi một con đường sự nghiệp"]]}], "vocab": [{"w": "Achieve work-life balance", "pos": "v-n-n", "vi": "Đạt được sự cân bằng công việc cuộc sống"}, {"w": "Favourable work environment", "pos": "adj-n-n", "vi": "Môi trường làm việc thuận lợi"}, {"w": "Promotion prospects", "pos": "n-n", "vi": "Triển vọng thăng tiến"}, {"w": "Under intense pressure", "pos": "adj-n", "vi": "Phải chịu rất nhiều áp lực"}, {"w": "Heavy workload", "pos": "adj-n", "vi": "Khối lượng công việc khổng lồ"}, {"w": "Workplace conflicts", "pos": "n-n", "vi": "Xung đột nơi làm việc"}, {"w": "Our personal lives", "pos": "adj-n", "vi": "Cuộc sống cá nhân của chúng ta"}, {"w": "Job opportunities", "pos": "n-n", "vi": "Cơ hội nghề nghiệp"}, {"w": "Job satisfaction", "pos": "n-n", "vi": "Sự thỏa mãn công việc"}, {"w": "Pursue a career path", "pos": "v-n-n", "vi": "Theo đuổi một con đường sự nghiệp"}], "prac": [{"t": "mc", "q": "Từ/cụm từ trong câu sau được dùng PHÙ HỢP không? — People who have a heavy workload hardly have time for personal hobbies.", "o": ["Phù hợp (Yes)", "Không phù hợp (No)"], "why": ""}, {"t": "mc", "q": "Từ/cụm từ trong câu sau được dùng PHÙ HỢP không? — Employees tend to contribute more to their work if there are good promotion prospects.", "o": ["Phù hợp (Yes)", "Không phù hợp (No)"], "why": ""}, {"t": "mc", "q": "Từ/cụm từ trong câu sau được dùng PHÙ HỢP không? — A favourable work environment does not encourage employees to perform well.",  describe the balance that an individual needs between the time allocated for work and other aspects of life. (chọn: Work-life balance / pursuing a single career path / Voluntary work / Heavy workload / Favourable / Job satisfaction / Manage conflicts / Better job opportunities)", "a": ["work-life balance"], "why": ""}, {"t": "fill", "q": "It is important for supervisors to learn how to ___ at work. (chọn: Work-life balance / pursuing a single career path / Voluntary work / Heavy workload / Favourable / Job satisfaction / Manage conflicts / Better job opportunities)", "a": ["manage conflicts"], "why": ""}, {"t": "fill", "q": "Students should participate in ___ to contribute to society and gain valuable experience. (chọn: Work-life balance / pursuing a single career path / Voluntary work / Heavy workload / Favourable / Job satisfaction / Manage conflicts / Better job opportunities)", "a": ["voluntary work"], "why": ""}, {"t": "fill", "q": "Getting the best possible education and undergoing thorough training will enable employees to have ___. (chọn: Work-life balance / pursuing a single career path / Voluntary work / Heavy workload / Favourable / Job satisfaction / Manage conflicts / Better job opportunities)", "a": ["better job opportunities"], "why": ""}], "prompt": "Viết một đoạn văn ngắn (100 – 120 từ) trả lời MỘT trong hai câu hỏi sau:\n1. What are the benefits of staying at one job for a long time?\n2. What are the benefits of changing jobs frequently?", "minw": 100, "mins": 15, "model": ["Working in a position for a long period of time can have many great benefits. Firstly, those sticking with one job in the long term can be familiar with their tasks as well as the working environment. Therefore, they can be under less pressure and more easily achieve a work-life balance than those changing jobs frequently. In addition, working in an organization for a long time enables workers to accumulate experiences and necessary skill, which in turn is likely to help them climb their career ladder and get more generous salary package.", "Those who change jobs or career paths more regularly may also be able to reap many benefits. Firstly, some people's personalities are not suitable for remaining in a career path for long periods of time, and they may need to change their jobs more regularly to have a sense of job satisfaction. My friend, for example, always wants to challenge herself with different positions so she changes jobs periodically to have invigorating experiences and alleviate boredom at work. In addition to this, if their current position involves too much pressure with a heavy workload, or simply does not provide employees with a living wage, exploring different career paths may lead workers to eventually find a career that will be more suitable for them in the long term."], "related": [{"id": "t2-u3-career", "prompt": "Some people think that people who choose a job early and keep doing it are more likely to get a satisfying career life than those who frequently change jobs. To what extent do you agree or disagree?", "file": "ielts_task2_b.html"}, {"id": "t2-u3-work-life", "prompt": "Nowadays, most people try to balance between work and other part of lives. Unfortunately, not many achieve this balance. What problems does this cause? Can you suggest some solutions to this issue?", "file": "ielts_task2_b.html"}]}, {"id": "wic-u4", "code": "Unit 4", "kind": "Words in Context", "grp": "Words in Context", "title": "Business", "vi": "Kinh doanh", "ready": true, "note": [{"h": "Mục tiêu duy nhất của một doanh nghiệp liệu có phải chỉ liên quan đến lợi nhuận?", "t": "Việc các doanh nghiệp ưu tiên cho make a profit⁽¹⁾ là hoàn toàn hợp lý và chính đáng. In today's highly competitive market⁽²⁾, hầu hết các công ty đều cần allocate budget⁽³⁾ cho nhiều mục đích khác nhau, đặc biệt là cho việc marketing nhằm maximize profit⁽⁴⁾ cũng như tạo nền tảng tài chính để expand their business⁽⁵⁾. Ví dụ, nhiều công ty thường đầu tư massive financial resources⁽⁶⁾ vào marketing campaigns⁽⁷⁾ giới thiệu sản phẩm mới nhằm boost sales⁽⁸⁾. Ngoài ra, nếu doanh thu không đủ để cover the running costs⁽⁹⁾ như chi phí thuê mặt bằng thì công ty có thể go bankrupt⁽¹⁰⁾.\nTuy nhiên, các công ty không nên chỉ tập trung vào mục tiêu tối đa hóa lợi nhuận mà còn có thể have social responsibilities⁽¹¹⁾ như đối xử công bằng với lao động địa phương hay đóng góp một phần thu nhập của mình vào việc giải quyết social problems⁽¹²⁾ tại nơi mà họ đang hoạt động.\nViệc các công ty cần phải đối xử tốt với người lao động địa phương không chỉ là một cử chỉ nhân đạo mà còn giúp boost productivity⁽¹³⁾ của người lao động và từ đó gia tăng sản lượng của chính công ty họ. Ngoài ra, các doanh nghiệp cũng contribute part of their income⁽¹⁴⁾ để hỗ trợ các tổ chức nhân đạo của địa phương hay các dự án về phát triển giáo dục, y tế."}, {"h": "Từ vựng", "t": "", "tbl": [["Từ / cụm từ", "Loại từ", "Nghĩa"], ["Make a profit", "v-n", "Kiếm lợi nhuận"], ["In today's highly competitive market", "adj-n", "Trong thị trường cạnh tranh khốc liệt ngày nay"], ["Allocate budget", "v-n", "Phân bổ ngân sách"], ["Maximize profit", "v-n", "Tối đa hóa lợi nhuận"], ["Expand their business", "v-n", "Mở rộng kinh doanh"], ["Massive financial resources", "adj-n", "Nguồn lực tài chính khổng lồ"], ["Marketing campaigns", "n-n", "Những chiến dịch marketing"], ["Boost sales", "v-n", "Tăng doanh số"], ["Cover the running costs", "v-n", "Chi trả được chi phí hoạt động"], ["Go bankrupt", "v-adj", "Phá sản"], ["Have social responsibilities", "v-adj-n", "Có trách nhiệm xã hội"], ["Social problems", "adj-n", "Các vấn đề xã hội"], ["Boost productivity", "v-n", "Tăng năng suất"], ["Contribute part of their income", "v-n", "Đóng góp một phần thu nhập"]]}], "vocab": [{"w": "Make a profit", "pos": "v-n", "vi": "Kiếm lợi nhuận"}, {"w": "In today's highly competitive market", "pos": "adj-n", "vi": "Trong thị trường cạnh tranh khốc liệt ngày nay", "spell": false}, {"w": "Allocate budget", " ts.", "o": ["Phù hợp (Yes)", "Không phù hợp (No)"], "why": ""}, {"t": "mc", "q": "Từ/cụm từ trong câu sau được dùng PHÙ HỢP không? — When a company's revenue declines dramatically over a long period of time, it is more likely to go bankrupt.", "o": ["Phù hợp (Yes)", "Không phù hợp (No)"], "why": ""}, {"t": "fill", "q": "In addition to making money, large businesses should also ___ and help the local authorities tackle serious social problems, including poverty.", "a": ["have social responsibilities"], "why": ""}, {"t": "fill", "q": "The primary purpose of any company is to ___ in order to survive the fierce competition in the business world.", "a": ["make a profit"], "why": ""}, {"t": "fill", "q": "It is not reasonable to say that small and struggling businesses should spend money helping the poor because many of them can barely ___, such as facility costs and staff salaries.", "a": ["cover the running costs"], "why": ""}, {"t": "fill", "q": "Many successful businesses are now running a number of ___ through various platforms, such as social media, to enhance their images and attract more customers.", "a": ["marketing campaigns"], "why": ""}, {"t": "fill", "q": "Taking regular breaks at work can actually help relieve stress, improve concentration, and therefore help ___.", "a": ["boost productivity"], "why": ""}, {"t": "fill", "q": "A ___ encourages competition among businesses and forces them to provide consumers with constantly improved goods and services.", "a": ["competitive market"], "why": ""}], "sentTasks": [{"phrases": ["Competitive market", "make a profit", "cover the running costs"], "sample": "In today's competitive market, many small companies cannot make a profit but only manage to cover the running costs, which prevents them from expanding their businesses."}, {"phrases": ["Maximize profit", "social responsibilities"], "sample": "In addition to maximizing their profits, businesses should also have social responsibilities."}, {"phrases": ["A competitive market", "marketing campaigns", "boost sales"], "sample": "In today's competitive market, companies have to conduct diverse marketing campaigns in order to boost sales."}, {"phrases": ["Make a profit", "cover the running costs", "go bankrupt"], "sample": "A business must make a profit to at least cover the running costs or it would go bankrupt."}, {"phrases": ["Allocate budget", "boost productivity"], "sample": "It is important that a company allocates part of their budget to improving their employees' ability to use technology in the workplace to boost productivity."}], "test": [{"t": "mc", "q": "“Make a profit” nghĩa là:", "o": ["Kiếm lợi nhuận", "Mở rộng kinh doanh", "Tăng năng suất"], "why": ""}, {"t": "mc", "q": "“Boost sales” nghĩa là:", "o": ["Tăng doanh số", "Đóng góp một phần thu nhập", "Phân bổ ngân sách"], "why": ""}, {"t": "mc", "q": "“Boost productivity” nghĩa là:", "o": ["Tăng năng suất", "Những chiến dịch marketing", "Có trách nhiệm xã hội"], "why": ""}, {"t": "mc", "q": "“Allocate budget” nghĩa là:", "o": ["Phân bổ ngân sách", "Tăng doanh số", "Trong thị trường cạnh tranh khốc liệt ngày nay"], "why": ""}, {"t": "mc", "q": "“Cover the running costs” nghĩa là:", "o": ["Chi trả được chi phí hoạt động", "Những chiến dịch marketing", "Đóng góp một phần thu nhập"], "why": ""}, {"t": "mc", "q": "“Maximize profit” nghĩa là:", "o": ["Tối đa hóa lợi nhuận", "Mở rộng kinh doanh", "Kiếm lợi nhuận"], "why": ""}, {"t": "mc", "q": "“Social problems” nghĩa là:", "o": ["Các vấn đề xã hội", "Mở rộng kinh doanh", "Phá sản"], "why": ""}, {"t": "mc", "q": "“Expand their business” nghĩa là:", "o": ["Mở rộng kinh doanh", "Nguồn lực tài chính khổng lồ", "Kiếm lợi nhuận"], "why": ""}, {"t": "fill", "q": "The primary purpose of any company is to ___ in order to survive the fierce competition in the business world.", "a": ["make a profit"], "why": ""}, {"t": "fill", "q": "A ___ encourages competition among businesses and forces them to provide consumers with constantly improved goods and services.", "a": ["competitive market"], "why": ""}, {"t": "fill", "q": "Many successful businesses are now running a number of ___ through various platforms, such as social media, to enhance their images and attract more customers.", "a": ["marketing campaigns"], "why": ""}, {"t": "fill", "q": "It is not reasonable to say that small and struggling businesses should spend money helping the poor because many of them can barely ___, such as facility costs and staff salaries.", "a": ["cover the running costs"], "why": ""}], "prompt": "Viết một đoạn văn ngắn (100 – 120 từ) trả lời câu hỏi sau:\nDo you think that businesses should pay attention to how their operation affects the surrounding environment and therefore help to deal with environmental problems?", "minw": 100, "mins": 15, "model": ["It is entirely justifiable for businesses to prioritize making money. In today's extremely competitive market, almost all companies need to conduct marketing campaigns or launching products to generate revenue for their businesses. If their income was insufficient to cover the running costs such as employees' salaries and rent, their business would be on the verge of going bankrupt and at that time, any intentions of doing social work would become impossible. After all, in order to embrace social responsibilities, companies first have to survive and make profits."], "related": [{"id": "t2-u4-social-responsibility", "prompt": "As well as making money, businesses also have social responsibilities. To what extent do you agree or disagree?", "file": "ielts_task2_b.html"}, {"id": "t2-u4-local-products", "prompt": "Large businesses have big budgets for marketing and promotion and as a result, people gravitate towards buying their products. What problems does this cause? What could be done to encourage people to buy local products?", "file": "ielts_task2_b.html"}]}, {"id": "tv-education", "code": "Chủ đề", "kind": "Từ vựng theo chủ đề", "grp": "Danh sách từ theo chủ đề", "title": "Education", "vi": "Giáo dục – từ vựng mở rộng & word form", "ready": true, "note": [{"h": "1. LOẠI HÌNH GIÁO DỤC (TYPES OF EDUCATION)", "t": "", "tbl": [["English", "Tiếng Việt", "Ví dụ"], ["University education", "Giáo dục đại học", "University education opens many doors for young people."], ["Tertiary education", "Các loại hình giáo dục sau phổ thông", "Access to tertiary education is a life-changing opportunity."], ["Traditional learning models", "Những mô hình học tập truyền thống", "Traditional learning models are being replaced by interactive methods."], ["Interactive learning", "Cách học tập nhiều tương tác", "Interactive learning encourages two-way discussion between teachers and students."], ["A holistic learning environment", "Môi trường học tập toàn diện", "Universities offer a holistic learning environment for students to grow."], ["Educational programmes", "Chương trình giáo dục", "Schools should design educational programmes that balance theory and practice."], ["Prestigious university", "Trường đại học danh tiếng", "Graduating from a prestigious university improves career prospects."], ["Knowledge-based society", "Xã hội đề cao kiến thức", "In a knowledge-based society, education is essential for success."]]}, {"h": "2. BẰNG CẤP & THÀNH TÍCH (QUALIFICATIONS & ACHIEVEMENT)", "t": "", "tbl": [["English", "Tiếng Việt", "Ví dụ"], ["Formal qualifications", "Các loại bằng cấp", "Employers often require formal qualifications when hiring."], ["Certificate", "Chứng chỉ", "She received a certificate after completing the online course."], ["Bachelor (degree)", "Bằng cử nhân", "A bachelor's degree is the minimum requirement for many jobs."], ["Master (degree)", "Bằng thạc sĩ", "He pursued a master's degree to advance his career."], ["Doctoral (adj) / Degree", "Thuộc về tiến sĩ / Bằng cấp", "She is completing her doctoral research at Cambridge University."], ["Academic results", "Kết quả học tập", "High academic results reflect a student's dedication and ab   report(d,'write',r.used,Math.max(1,V.length),es.value.trim(),r.n);const when=new Date().toLocaleString('vi-VN');store.set('sent_'+d.id,when);
  fb('good','Đã gửi bài cho cô! ✓');confirmSend=false;$('#sb').textContent='Nộp lại bài đã sửa';clearInterval(tmr);running=false;$('#tb').textContent='Bấm giờ';showAfter(when)};
